# path_substitutions.yaml
#
# Build-time filesystem-path rewrites applied by scripts/build_runner.py to paths
# it writes into dist/Runner.xlsm. BUILD-TIME ONLY: the VBA runtime never reads
# this file (same status as config/transforms/*.yaml; see docs/ARCHITECTURE.md
# "The VBA runtime never parses or reads YAML").
#
# WHY THIS EXISTS
# build_runner.py fills the Runner sheet's "Bootstrap Source Folder" cell with the
# absolute path to vba_src/ so BootstrapImporter can find the modules to import.
# On a Windows build host that is a drive-letter path, e.g. C:\...\vba_src.
# BootstrapImporter.DetectSeparator (vba_src/bootstrap/BootstrapImporter.bas)
# infers the path separator by scanning for "/" first, then ":". A Windows path
# has no "/" but contains the "C:" colon, so DetectSeparator wrongly infers ":"
# (a leftover from classic-Mac "HD:Folder:File" paths) and builds
# "C:\...\vba_src:*.*", which matches no files. The manual import step then fails
# with "No .bas or .cls files found under: ...".
#
# Rewriting "\" -> "/" makes DetectSeparator resolve the separator correctly.
# Windows Excel VBA (Dir / GetAttr / FileCopy / Open / Kill) accepts "/" as a
# separator transparently, so the rewritten path works for every downstream file
# operation. build_runner.py --verify compares resolved paths, so the "/" vs "\"
# form of the recorded path does not affect verification.
#
# CONSEQUENCE IF THIS DRIFTS FROM REALITY: a Windows build silently writes an
# unusable source-folder path and the manual BootstrapImporter step fails at
# "No .bas or .cls files found". A wrong os_default_profile on macOS would rewrite
# paths that are already correct.
#
# See docs/BUILD_WIN.md ("Runner workbook - build steps", Step 3/4).
version: 1

# build_runner.py selects a profile in this order:
#   1. --path-profile <name> on the command line, if given
#   2. os_default_profile[<platform.system()>] below
#   3. fallback_profile
fallback_profile: none

os_default_profile:
  Darwin: none                        # macOS build host - paths written verbatim
  Linux: none
  Windows: windows_forward_slash

profiles:
  none:
    description: No substitution; paths are written exactly as resolved on the build host.
    rules: []

  windows_forward_slash:
    description: >-
      Rewrite backslash path separators to forward slashes so
      BootstrapImporter.DetectSeparator resolves the separator correctly on
      Windows. A UNC path "\\server\share\..." becomes "//server/share/...",
      which Windows Excel VBA also accepts.
    # Ordered list; each rule is a literal string replace (str.replace), applied
    # top to bottom. Not regex - keep it boring and predictable.
    rules:
      - { replace: "\\", with: "/" }

# The build-written values the selected profile is applied to. build_runner.py
# only rewrites a value whose target name appears here. Extend this list (and the
# matching call site in build_runner.py) if another written path ever needs the
# same treatment; today only the bootstrap source folder is both machine-generated
# on the build host AND consumed by VBA on that same host.
apply_to:
  - bootstrap_source_folder
