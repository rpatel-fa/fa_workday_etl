# root_path_substitutions.yaml
#
# Build-time filesystem-path rewrites applied by scripts/build_runner.py to paths
# it writes into dist/Runner.xlsm. BUILD-TIME ONLY: the VBA runtime never reads
# this file (same status as config/transforms/*.yaml; see docs/ARCHITECTURE.md
# "The VBA runtime never parses or reads YAML").
#
# WHY THIS EXISTS (two jobs, one Windows profile)
#
# (1) DATA ROOT. config/reference_paths.yaml and every config/transforms/*.yaml
# shell_defaults block (source_data / target_eib / output_file_path) are authored
# with one person's mac path root (/Users/Rakesh.Patel/Documents/__data) and have
# no per-host override mechanism of their own -- build_runner.py writes them
# verbatim into the workbook. A Windows build host needs its own root instead.
# The windows_forward_slash profile's first rule rewrites that mac root to the
# current Windows build host's local data root.
#
# (2) SEPARATOR. build_runner.py also fills the Runner sheet's "Bootstrap Source
# Folder" cell with the absolute path to vba_src/ so BootstrapImporter can find
# the modules to import. On a Windows build host that is a drive-letter path,
# e.g. C:\...\vba_src. BootstrapImporter.DetectSeparator
# (vba_src/bootstrap/BootstrapImporter.bas) infers the path separator by
# scanning for "/" first, then ":". A Windows path has no "/" but contains the
# "C:" colon, so DetectSeparator wrongly infers ":" (a leftover from
# classic-Mac "HD:Folder:File" paths) and builds "C:\...\vba_src:*.*", which
# matches no files. The manual import step then fails with "No .bas or .cls
# files found under: ...". Rewriting "\" -> "/" makes DetectSeparator resolve
# the separator correctly. Windows Excel VBA (Dir / GetAttr / FileCopy / Open /
# Kill) accepts "/" as a separator transparently, so the rewritten path works
# for every downstream file operation -- including the data-root-swapped paths
# from job (1), which is why rule (1) runs BEFORE rule (2): the backslashes
# job (1) introduces (e.g. "C:\Users\...") also need normalizing to "/", and
# running (2) second catches both jobs' output in one pass. See the `rules`
# list under `windows_forward_slash` below -- order matters.
#
# build_runner.py --verify compares resolved paths, so the "/" vs "\" form of
# a recorded path does not affect verification.
#
# CONSEQUENCE IF THIS DRIFTS FROM REALITY: a Windows build silently writes
# unusable paths -- either pointing at files that don't exist on this machine
# (job 1) or a source folder BootstrapImporter can't parse (job 2). A wrong
# os_default_profile on macOS would rewrite paths that are already correct.
#
# See docs/BUILD_WIN.md ("Runner workbook - build steps", Step 3 -- Root-path
# substitution), which explains both jobs; they run automatically as part of
# Step 2's build_runner.py invocation, not as a separate command.
version: 1

# build_runner.py selects a profile in this order:
#   1. --path-profile <name> on the command line, if given
#   2. os_default_profile[<platform.system()>] below
#   3. fallback_profile
fallback_profile: none

os_default_profile:
  Darwin: none                        # macOS build host - paths written verbatim
  Linux: none
  Windows: windows_forward_slash

profiles:
  none:
    description: No substitution; paths are written exactly as resolved on the build host.
    rules: []

  windows_forward_slash:
    description: >-
      Windows build host: (1) rewrite the mac data root baked into
      reference_paths.yaml / transforms/*.yaml to this host's local data root,
      then (2) rewrite backslash path separators to forward slashes so
      BootstrapImporter.DetectSeparator resolves correctly. A UNC path
      "\\server\share\..." becomes "//server/share/...", which Windows Excel
      VBA also accepts. Order matters -- (1) must run before (2) so the
      backslashes (1) introduces also get normalized.
    # Ordered list; each rule is a literal string replace (str.replace), applied
    # top to bottom. Not regex - keep it boring and predictable.
    rules:
      # (1) Data root swap. EDIT THIS to your own local data root before
      # building on Windows.
      - { replace: "/Users/Rakesh.Patel/Documents/__data", with: "C:\\Users\\chika\\Documents\\temp_fa\\data" }
      # (2) Separator normalize. Must run after (1) -- see rationale above.
      - { replace: "\\", with: "/" }

# The build-written values the selected profile is applied to. build_runner.py
# only rewrites a value whose target name appears here.
apply_to:
  - bootstrap_source_folder    # vba_src folder path, generated by build_runner.py itself
  - mapping_spreadsheet        # config/reference_paths.yaml (or a transform's shell_defaults override)
  - customer_spreadsheet       # config/reference_paths.yaml (or a transform's shell_defaults override)
  - supplier_spreadsheet       # config/reference_paths.yaml (or a transform's shell_defaults override)
  - source_data                # config/transforms/*.yaml shell_defaults
  - target_eib                 # config/transforms/*.yaml shell_defaults
  - output_file_path           # config/transforms/*.yaml shell_defaults
