# root_path_substitutions.yaml
#
# Build-time filesystem-path rewrites applied by scripts/build_runner.py to paths
# it writes into dist/Runner.xlsm. BUILD-TIME ONLY: the VBA runtime never reads
# this file (same status as config/transforms/*.yaml; see docs/ARCHITECTURE.md
# "The VBA runtime never parses or reads YAML").
#
# WHY THIS EXISTS
#
# config/reference_paths.yaml and every config/transforms/*.yaml shell_defaults
# block (source_data / target_eib / output_file_path) are authored with one
# person's mac path root and have no per-host override mechanism of their own --
# build_runner.py writes them verbatim into the workbook. build_runner.py also
# fills the Runner sheet's "Bootstrap Source Folder" cell with the absolute path
# to vba_src/ so BootstrapImporter can find the modules to import. A Windows
# build host needs its own data root, and (historically) needed its paths
# rewritten to forward slashes for BootstrapImporter.DetectSeparator to parse a
# drive-letter path correctly.
#
# A profile here does exactly three things, in order:
#   (1) root_path_substitution -- the old root to find (a literal string).
#   (2) new_root_path          -- what to replace it with (a literal string).
#   (3) convert_forward_slash_to_backslash -- normalize every remaining "/" to
#       "\" afterward, for a fully native Windows path.
# build_runner.py applies them in that order -- (1)->(2) then (3) -- to every
# field listed in apply_to below, uniformly (no per-field rule targeting; see
# PathSubstitution.rewrite() in scripts/build_runner.py).
#
# Applying (3) to bootstrap_source_folder is safe: BootstrapImporter.DetectSeparator
# and BaseName (vba_src/bootstrap/BootstrapImporter.bas) explicitly recognise the
# Windows drive-letter shape ("C:\...") and correctly use "\" as the separator --
# fixed for this reason. Before that fix, DetectSeparator misread a drive-letter
# path's "C:" colon as a classic-Mac "HD:Folder:File" separator, building
# "C:\...\vba_src:*.*" (matches nothing), so this file used to rewrite that one
# field to forward-slash instead as a workaround. That workaround is no longer
# needed -- backslash paths now work end-to-end for every field.
#
# CONSEQUENCE IF THIS DRIFTS FROM REALITY: a Windows build silently writes
# unusable paths -- either pointing at files that don't exist on this machine
# (data-root fields) or, if BootstrapImporter.bas ever regresses the
# drive-letter fix above, a source folder BootstrapImporter can't parse. A
# wrong os_default_profile on macOS would rewrite paths that are already
# correct.
#
# See docs/BUILD_WIN.md ("Runner workbook - build steps"). Step 2's build
# (`build_runner.py`) rewrites bootstrap_source_folder automatically. Step 3
# (`build_runner.py --substitute-root-paths`) is a separate command, run after
# Step 2, that patches the already-built workbook's data-root fields in place
# using this same profile.
version: 2

# build_runner.py selects a profile in this order:
#   1. --path-profile <name> on the command line, if given
#   2. os_default_profile[<platform.system()>] below
#   3. fallback_profile
fallback_profile: none

os_default_profile:
  Darwin: none                        # macOS build host - paths written verbatim
  Linux: none
  Windows: windows_local

profiles:
  none:
    description: No substitution; paths are written exactly as resolved on the build host.
    root_path_substitution: ""
    new_root_path: ""
    convert_forward_slash_to_backslash: false

  windows_local:
    description: >-
      Windows build host: (1) rewrite the mac data root baked into
      reference_paths.yaml / transforms/*.yaml to this host's local data root,
      then (2) normalize every remaining "/" to "\" for a fully native Windows
      path. Applied uniformly to every field in apply_to below, including
      bootstrap_source_folder -- see "WHY THIS EXISTS" above for why that is
      safe now.
    # (1) EDIT root_path_substitution/new_root_path to your own machine before
    # building on Windows -- these two values are a matched pair (root to find,
    # root to replace it with).
    root_path_substitution: "/Users/Rakesh.Patel/Documents/__data"
    new_root_path: "C:\\Users\\chika\\Documents\\temp_fa\\data"
    # (3) Normalize forward slashes to backslashes after the swap above (also
    # catches forward slashes from the rest of the original mac path, not just
    # the ones the swap just introduced).
    convert_forward_slash_to_backslash: true

# The build-written values the selected profile is applied to. build_runner.py
# only rewrites a value whose target name appears here.
apply_to:
  - bootstrap_source_folder    # vba_src folder path, generated by build_runner.py itself
  - mapping_spreadsheet        # config/reference_paths.yaml (or a transform's shell_defaults override)
  - customer_spreadsheet       # config/reference_paths.yaml (or a transform's shell_defaults override)
  - supplier_spreadsheet       # config/reference_paths.yaml (or a transform's shell_defaults override)
  - source_data                # config/transforms/*.yaml shell_defaults
  - target_eib                 # config/transforms/*.yaml shell_defaults
  - output_file_path           # config/transforms/*.yaml shell_defaults
