# Transform spec - ap_amex_hotel_v3
#
# Authoring decision record and authoritative EIB field mapping. Core mappings
# follow ap_amex_trains_v3, adapted to the AMEX hotel prepared Workday_Upload.

meta:
  key: ap_amex_hotel_v3
  label: AP AMEX Hotel V3
  exemplar_to_fork: ap_amex_trains_v3
  note: >
    Supplier, company, invoice fields, amount, tax driver, and worktags follow the
    prepared Workday_Upload source. The invoice memo is derived from SupplierID and
    InvoiceNumber.

shared_helpers:
  supplier_resolution: direct_workday_id_with_extract_check
  company_resolution: per_row_direct_source_column
  accounting_string_derivation: none
  worktag_hierarchy_lookup: none
  row_net_resolution: direct_amount
  row_trailer_detection: text_cols_and_amount_cols_parameterized
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  supplier:
    source_code: per_row_direct_with_extract_check
    source_column: SupplierID
    resolved_via: Supplier Spreadsheet
    validation_column: Supplier ID
    reject_if_unresolved: true
    note: >
      Write the source Workday Supplier ID to EIB U after confirming it exists
      in the Supplier extract.
  company:
    source_code: per_row_direct_source_column
    source_column: Company
    reject_if_blank: true
    note: Write the source company value to EIB R without lookup or fallback.

worktags_pre_resolved:
  spend_category:     {source_column: Spend Category, eib_column: EW, mandatory: true}
  reporting_type:     {source_column: Reporting Type, eib_column: GR, mandatory: true}
  cost_centre:        {source_column: Cost Centre, eib_column: GT, mandatory: true}
  event:              {source_column: Event, eib_column: GV, mandatory: false}
  camp:               {source_column: Camp, eib_column: GX, mandatory: false}
  fa_learning:        {source_column: FA Learning Course, eib_column: GZ, mandatory: false}
  commercial_partner: {source_column: Commercial Partner, eib_column: HB, mandatory: false}
  grant:              {source_column: Grant, eib_column: HD, mandatory: false}
  program:            {source_column: Programme, eib_column: HF, mandatory: false}
  project:            {source_column: Project, eib_column: HH, mandatory: false}
  reject_values: [NOT_FOUND]

fields:
  invoice_number:
    source_column: InvoiceNumber
    eib_columns: [K, BG]
    number_format: "@"
    rule: Write the same source InvoiceNumber to both EIB invoice-number fields as text.
  invoice_date:
    source_column: InvoiceDate
    target_eib_column: AF
    normalization: shared_helper:source_date_normalization.excel_serial_and_dmy_text
  currency:
    source_column: Currency
    target_eib_column: T
    blank_default: GBP
  line_description:
    source_column: Description
    target_eib_column: EP
    post_process: UCase(Trim(value))
  line_amount:
    source_column: Net
    extended_amount_eib_column: GF
    unit_cost_eib_column: GE
    basis: net
    extended_amount_number_format: "0.00"
    unit_cost: blank
  invoice_memo:
    derivation: supplier_id_and_invoice_number
    source_columns: [SupplierID, InvoiceNumber]
    target_eib_column: GQ
    separator: "_"
  tax:
    mode: per_row
    driver_source_column: TaxCode
    sets:
      - when_value: [P20]
        applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
        code: GBR_Standard
        recoverability: Fully_Recoverable
      - when_value: [P0, PZ]
        applicability: GBR_Outside_of_Scope
        code: GBR_Zero_Rated
        recoverability: Nonrecoverable_Allocate
    on_unknown_when_value: reject_and_report

eib_house_defaults:
  submit_flag: "Y"
  tax_point_date_type: INVOICE/ADJUSTMENT_DATE
  tax_option: CALC_TAX_DUE
  company_fallback: ""

skip_rule:
  drop_when:
    - Net < 0
  on_drop: reject_row_and_report

open_questions: []

mapping:
  # Supplier Invoice EIB column mappings. House defaults: I=Y,
  # FH=INVOICE/ADJUSTMENT_DATE, FL=CALC_TAX_DUE.
  - target: B
    function: invoice_line_grouping
    note: Spreadsheet Key grouped by InvoiceNumber.
  - target: I
    default: "Y"
  - target: K
    source_column: InvoiceNumber
    number_format: "@"
    note: Same AMEX source value as Suppliers Invoice Number (BG).
  - target: R
    source_column: Company
    note: Company verbatim; blank rejects.
  - target: T
    source_column: Currency
    default: GBP
  - target: U
    source_column: SupplierID
    lookup:
      file: Supplier Spreadsheet
      input_column: Supplier ID
      output_column: Supplier ID
      on_fail: reject
  - target: AF
    source_column: InvoiceDate
    normalize_source_date: true
  - target: AG
    function: leave_blank
  - target: AS
    function: leave_blank
  - target: BG
    source_column: InvoiceNumber
    number_format: "@"
  - target: EL
    function: leave_blank
  - target: EK
    function: invoice_line_grouping
    note: Row ID mirrors Line Order.
  - target: EM
    function: invoice_line_grouping
    note: Line Order is 1..N within each InvoiceNumber group.
  - target: EP
    source_column: Description
    post_process: UCase(Trim(value))
  - target: EW
    source_column: Spend Category
    passthrough: true
  - target: FE
    function: per_row_tax_applicability
    source_column: TaxCode
  - target: FF
    function: per_row_tax_code
    source_column: TaxCode
  - target: FH
    default: INVOICE/ADJUSTMENT_DATE
  - target: FK
    function: per_row_tax_recoverability
    source_column: TaxCode
  - target: FL
    default: CALC_TAX_DUE
  - target: GE
    function: leave_blank
  - target: GF
    source_column: Net
    number_format: "0.00"
  - target: GQ
    function: concat_underscore_supplier_id_invoice_number
  - target: GR
    source_column: Reporting Type
    passthrough: true
  - target: GT
    source_column: Cost Centre
    passthrough: true
  - target: GV
    source_column: Event
    passthrough: true
    optional: true
  - target: GX
    source_column: Camp
    passthrough: true
    optional: true
  - target: GZ
    source_column: FA Learning Course
    passthrough: true
    optional: true
  - target: HB
    source_column: Commercial Partner
    passthrough: true
    optional: true
  - target: HD
    source_column: Grant
    passthrough: true
    optional: true
  - target: HF
    source_column: Programme
    passthrough: true
    optional: true
  - target: HH
    source_column: Project
    passthrough: true
    optional: true
