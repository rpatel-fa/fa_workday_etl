# Transform spec - ap_cfa_distributions  (*** CFA DISTRIBUTIONS ONLY — NOT CFA CLAIMS ***)
#
# *** CRITICAL NAME CLARITY (2026-08-24):
#     "CFA" is an ambiguous Finance shorthand. Sibling transforms:
#       1. ap_cfa_distributions  <- THIS transform, for the monthly FA Grant / EP Workforce
#          & Leadership / EP WorkforceIS etc. CFA "distributions" workbook.  Source/target
#          folders live under  .../eib/ap/cfa_distributions/.  Labels = "CFA Distributions".
#       2. ap_cfa_distributions_amendments <- credit notes from the SAME workbook
#          (Supplier Invoice Adjustment EIB).  NOT yet reworked for the Oct-2026 layout.
#       3. ap_cfa_claims / ap_cfa_claims_v2 <- the SEPARATE CFA-Claims workbook.
#     Do not mix these up.  When searching / adding code grep for either "cfa_distributions"
#     or "cfa_claims" explicitly, never bare "cfa".
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors. Lives in
# config/transform_specs/ (not config/transforms/, which the build globs as runnable profiles).
#
# Operational facts - identity, EIB population type, template/source/output paths, and source
# layout (worksheet, header row, required headers) - live in the build profile
# config/transforms/ap_cfa_distributions.yaml (the build-consumed source of truth). Not restated here.
#
# REWORKED 2026-10-22 for the October-2026 source workbook "Distributions Oct26.xlsm".
# Data sheet: "Finance Master sheet" (header row 5, data rows 6.., cols A..N, 54 data rows in Oct)
#   Col A = DocNo / Row Key      (headerless; e.g. "AFAOct2026FA Grant" — 54/54 distinct;
#                                  Memo trace + skip gate)
#   B = CFA                       (County FA name: AFA / Army / … — anchor for col A; NOT the
#                                  legal-entity Company code; Company = constant "FA")
#   C = Type                      ("CFA" / "ED" — informational)
#   D = Old Creditor ID           (GP creditor code AMA003 / ARM003 / BED013 / … — 54/54 distinct;
#                                  SUPPLIER LOOKUP KEY into the Supplier extract, see Rule 0)
#   E = Document type             ("invoice" — row filter, UPPER == INVOICE)
#   F = Description - remittance  (e.g. "Oct2026FA Grant" — Invoice Number + Item Description;
#                                  NOT unique per row: 3 distinct values across 54 rows in Oct)
#   G = Distribution/Cost Code    (accounting string: 1077-504007-PNGC0001-0000)
#   H = Total                     (net line amount, unrounded e.g. 12670.404999… — Extended Amount)
#   I = Tax amount                (0 on all Oct rows; >0 triggers Standard Rated tax treatment)
#   J = Tax detail                (POS — informational)
#   K = Batch ID                  (per-file date 2026-10-01 — Invoice Date + Receipt Date)
#   L = Code lookup / M = Code desc (informational)
#   N = Workday Id Code           (Finance S-XXXXXX — informational ONLY, NOT read; the extract
#                                  lookup on col D is authoritative. Oct: ROY001 col N = S-006003
#                                  (ROY001-NFC) vs lookup S-006004 (ROY001-FA) — lookup value
#                                  CONFIRMED correct by user 2026-10-22.)
#
# Why not "Finance Master analysis" any more: the Oct layout of that tab dropped the pre-computed
# Invoice Number / Invoice Description / Invoice Date columns (Z/AA/AD) and its col T Workday ID
# is blank on some rows.
#
# Derived-field rules (Finance Master sheet -> EIB mapping).
#
#   Rule 0 — Supplier (EIB U): col D "Old Creditor ID" looked up in the Supplier extract
#             (Reference ID -> Supplier ID) via ResolveSupplierWithCompanyPrecedence:
#             HIGH = "{CreditorID}-FA", LOW = bare "{CreditorID}". Not found = reject row
#             (unresolvedSupplierRows++). Oct dry-run: 54/54 resolved.
#   Rule 1 — Company (EIB R): CONSTANT "FA" -> ResolveMappedCompany -> THE FA GROUP - FA.
#   Rule 2 — Row filter: only rows whose col E UPPER(TRIM()) = "INVOICE" are processed. Other
#             non-blank Document types are skipped silently (counted) — reserved for credit notes /
#             ap_cfa_distributions_amendments. Blank col E = missing-field reject.
#   Rule 3 — Invoice Number (EIB K): col F TRIM verbatim (e.g. "Oct2026FA Grant").
#   Rule 4 — Suppliers Invoice Number (EIB BG): 1:1 mirror of K.
#   Rule 5 — Invoice grouping: Spreadsheet Key (B) + Row ID / Line Order (EK/EM) via
#             AssignInvoiceLineGroup keyed on Supplier + "|" + Invoice Number. Col F repeats
#             across suppliers, so grouping on K alone would merge suppliers; Old Creditor IDs
#             are unique per row (user 2026-10-22), so each row = one single-line invoice.
#   Rule 6 — Invoice Date + Receipt Date (EIB AF/AG): col K "Batch ID" via NormalizeSourceDate.
#   Rule 7 — Item Description (EIB EP): col F TRIM verbatim.
#   Rule 8 — Unit Cost (EIB GE): BLANK (not written).
#   Rule 9 — Extended Amount (EIB GF): col H "Total" rounded to 2 dp (Excel ROUND semantics,
#             half away from zero — Application.WorksheetFunction.Round, NOT VBA banker's Round)
#             with cell NumberFormat "0.00".
#   Rule 10 — Worktags: Cost Centre (GT) + Spend Category (EW) mandatory, Reporting Type (GR) +
#              7 optional worktags from col G via Mapping MASTER lowest-hierarchy match - UNCHANGED.
#   Rule 11 — Tax per row (conditional_on_tax_amount) on col I - UNCHANGED.
#   Rule 12 — Memo (EIB GQ): col A + " " + col G - UNCHANGED.
#
# Reuses the standard Supplier Invoice EIB field block (see docs/ADDING_A_TRANSFORM.md); house
# defaults inherited unchanged: I=Y, FH=INVOICE/ADJUSTMENT_DATE, FL=CALC_TAX_DUE.

meta:
  key: ap_cfa_distributions
  label: AP CFA Distributions
  requester: Finance (AP)
  date_confirmed: 2026-10-22
  exemplar_to_fork: ap_referees
  note: >
    Reworked 2026-10-22 for "Distributions Oct26.xlsm": source tab "Finance Master sheet";
    Supplier = Old Creditor ID (D) via Supplier extract (CreditorID-FA then bare); Invoice
    Number + Item Description = Description - remittance (F); Unit Cost blank; Extended Amount =
    Total (H) rounded 2 dp; Invoice/Receipt Date = Batch ID (K); grouping Supplier + Invoice
    Number. Supersedes the 2026-09-24 "Finance Master analysis" layout (cols T/U/V/Z/AA/AD).

shared_helpers:
  supplier_resolution: direct_gp_creditor_id_via_extract
  company_resolution: fixed_literal
  accounting_string_derivation: direct_final_code_column
  worktag_hierarchy_lookup: standard_9pack_lowest_specificity
  row_net_resolution: direct_amount
  row_trailer_detection: text_cols_and_amount_cols_parameterized
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  supplier:
    source_code: per_row_lookup
    source_column: Old Creditor ID (D)
    resolved_via: Supplier Spreadsheet (Workday Supplier extract, reference_paths.supplier_spreadsheet)
    key_column: Reference ID (pipe-delimited)
    value_column: Supplier ID (S-XXXXXX)
    key_precedence:
      - "{CreditorID}-FA"
      - "{CreditorID}"
    reference_id_delimiter: "|"
    on_unresolved: reject
    note: >
      ResolveSupplierWithCompanyPrecedence(lookup, colD, "FA"). Col D is a plain GP creditor code
      (no hyphen, no split). Oct dry-run 54/54 resolved. Finance's col N "Workday Id Code" is
      NOT read.
  company:
    source_code: constant
    value: FA
    source_column_present: false
    resolved_via: ResolveMappedCompany("FA") → THE FA GROUP - FA
    note: >
      Finance Master sheet has NO legal-entity Company column (col B = County FA NAME).
      OUTPUT_COMPANY_DEFAULT_FALLBACK = "THE FA GROUP - FA" retained as a safety net. The
      constant "FA" is also the company suffix in the supplier key precedence.

fields:
  invoice_number:
    source_column: Description - remittance (F)
    rule: "TRIM(F)"
    note: >
      e.g. "Oct2026FA Grant". NOT unique per row (3 distinct values across 54 Oct rows) — uniqueness
      comes from the Supplier + Invoice Number grouping key (Workday invoice-number uniqueness is
      per supplier).
  suppliers_invoice_number:
    rule: "1:1 mirror of invoice_number (EIB K)"
    source_column: Description - remittance (F)
  spreadsheet_key_group_id:
    group_key_derived_field: "supplier_id + '|' + invoice_number"
    note: >
      AssignInvoiceLineGroup keyed on resolved Supplier ID + "|" + Invoice Number. Old Creditor IDs
      are unique per row, so each row is its own single-line invoice (B increments per row,
      EK = EM = 1).
  invoice_date:
    source_column: Batch ID (K)
    format: NormalizeSourceDate -> YYYY-MM-DD text
  receipt_date:
    source_column: Batch ID (K) - same as InvoiceDate
    format: NormalizeSourceDate (same as InvoiceDate)
  item_description:
    source_column: Description - remittance (F)
    rule: "TRIM(F)"
  memo:
    rule: "ColA (DocNo) + ' ' + ColG (Distribution/Cost Code)"
  unit_cost:
    rule: BLANK
    note: EIB GE intentionally not written (left blank) per Finance 2026-10-22.
  line_amount:
    source_column: Total (H)
    basis: net
    rounding: 2 dp, Excel ROUND (half away from zero) via Application.WorksheetFunction.Round
    number_format: "0.00"
    note: >
      Written to EIB GF (Extended Amount) only. Col H is unrounded (e.g. 12670.404999…); Excel
      ROUND reproduces Finance's own rounded figures, VBA's banker's Round would not on .xx5 rows.
  spend_category:
    derivation: per_row_lookup
    key_source_column: Distribution/Cost Code (G)
    key_rule: lowest-hierarchy matching accounting-string segment
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Spend Category
    specificity_standard: integration_default
    on_unresolved: skip_and_report
    note: >
      Verified against Mapping MASTER: 504007 → Staff_Grant (FA Grant rows);
      504012 → Programme_Grant (EP Workforce & Leadership rows).
  reporting_type:
    source_column: Distribution/Cost Code (G)
    rule: second accounting-string segment first character via reporting_type_from_final_code helper
  cost_centre:
    derivation: per_row_lookup
    key_source_column: Distribution/Cost Code (G)
    key_rule: lowest-hierarchy matching accounting-string segment
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Cost Center
    specificity_standard: integration_default
    on_unresolved: skip_and_report
  related_worktags:
    event:
      target: GV
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Events - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    camp:
      target: GX
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Camps - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    fa_learning_course:
      target: GZ
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: FA Learning - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    commercial_partner:
      target: HB
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Commercial Partners - Custom Worktag
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    grant:
      target: HD
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Grant
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    programme:
      target: HF
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Program - Delivered Org
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok
    project:
      target: HH
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Projects (Opex)
      use_shared_lookup: standard_9pack_lowest_specificity
      on_unresolved: skip_ok

tax:
  mode: conditional_on_tax_amount
  zero_rated:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  standard_rated:
    # AP Supplier-Invoice standard-rated uses the domestic PURCHASE ref-ids (AP confirmed 2026-09-14).
    applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
    code: GBR_Standard
    recoverability: Fully_Recoverable
  note: >
    Per-row on Finance Master sheet col I (Tax amount):
      TaxAmount > 0     → Domestic Purchase / Standard / Fully Recoverable
      TaxAmount == 0/∅ → Outside of Scope / Zero Rated / Nonrecoverable

skip_rule:
  silent_skip_when:
    - Col E (Document type) non-blank AND UPPER != INVOICE   [reserved for credit notes / amendments]
  drop_when:
    - Col A (DocNo/Row Key) blank
    - Col D (Old Creditor ID) blank
    - Col E (Document type) blank
    - Col F (Description - remittance / Invoice Number) blank
    - Col G (Distribution/Cost Code) blank
    - Col K (Batch ID / InvoiceDate) blank
    - Col H (Total) == 0
    - cost_centre unresolved
    - spend_category unresolved
    - supplier unresolved (col D not found in Supplier extract as "{D}-FA" or "{D}")

trailer_row_handling:
  pattern: >
    54 data rows in the Oct file (50 FA Grant + 3 EP Workforce + 1 EP WorkforceIS). The
    consecutive-empty-rows stop-gate (>= 8 blanks) halts iteration after the data block; any
    TOTAL / GRAND / SUBTOTAL / SUM row is absorbed by RowIsEmptyOrTrailer.

open_questions:
  - >-
    ap_cfa_distributions_amendments still reads "Finance Master analysis" (cols T/U/V/Z/AA/AD).
    Before the first month with credit notes, AP to confirm how a credit note appears on
    "Finance Master sheet" (Document type value? negative Total?) so the two transforms
    partition rows cleanly.
  - >-
    Month-on-month maintenance: update shell_defaults.source_data to the new workbook; ensure
    col K Batch ID = the month start date; ensure every col D Old Creditor ID exists in the
    current Supplier extract (reference_paths.supplier_spreadsheet).

mapping:
- target: B
  function: invoice_line_grouping
  note: Spreadsheet Key via AssignInvoiceLineGroup keyed on Supplier + "|" + Invoice Number (Rule 5).
- target: I
  default: "Y"
- target: K
  source_column: Description - remittance (F)
  note: Rule 3 — Invoice Number = TRIM(col F).
- target: R
  default: "{resolved via ResolveMappedCompany(\"FA\")}"
  source_value: constant_FA
  lookup:
    file: this
    tab: mapping
    filter_column: entity
    filter_value: company
    input_column: source
    output_column: target
  note: Rule 1 — Company = constant "FA" (THE FA GROUP - FA).
- target: T
  default: GBP
  note: No currency column in source; CFA = UK entities.
- target: U
  source_column: Old Creditor ID (D)
  function: resolve_supplier_with_company_precedence
  lookup:
    file: Supplier Spreadsheet
    tab: Sheet1
    input_column: Reference ID
    output_column: Supplier ID
    key_precedence: ["{CreditorID}-FA", "{CreditorID}"]
    on_fail: reject
  note: Rule 0 — Supplier via Supplier extract lookup on col D.
- target: AF
  source_column: Batch ID (K)
  function: normalize_source_date
  note: Rule 6 — Invoice Date.
- target: AG
  source_column: Batch ID (K)
  function: normalize_source_date
  note: Rule 6 — Receipt Date = Invoice Date.
- target: BG
  source_column: Description - remittance (F)
  note: Rule 4 — Suppliers Invoice Number = 1:1 mirror of K.
- target: EK
  function: invoice_line_grouping
  note: Row ID = 1..N within the Supplier + Invoice Number group (mirror of EM).
- target: EM
  function: invoice_line_grouping
  note: Line Order = 1..N within the Supplier + Invoice Number group (mirror of EK).
- target: EP
  source_column: Description - remittance (F)
  note: Rule 7 — Item Description = TRIM(col F).
- target: EW
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Spend Category
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
    on_fail: reject
- target: FE
  function: tax_on_taxamount_conditional
  slot: applicability
  note: Rule 11 — If TaxAmount (I) > 0 → Domestic Purchase; else → Outside_of_Scope.
- target: FF
  function: tax_on_taxamount_conditional
  slot: code
  note: Rule 11 — If TaxAmount (I) > 0 → GBR_Standard; else → GBR_Zero_Rated.
- target: FH
  default: INVOICE/ADJUSTMENT_DATE
- target: FK
  function: tax_on_taxamount_conditional
  slot: recoverability
  note: Rule 11 — If TaxAmount (I) > 0 → Fully_Recoverable; else → Nonrecoverable_Allocate.
- target: FL
  default: CALC_TAX_DUE
  note: Workday computes VAT on standard-rated rows from the net Extended Amount and tax code.
# GE (Unit Cost) intentionally NOT mapped — left blank (Rule 8).
- target: GF
  source_column: Total (H)
  function: round_2dp_excel
  number_format: "0.00"
  note: Rule 9 — Extended Amount = ROUND(col H, 2), formatted "0.00".
- target: GQ
  function: concat_cola_docno_space_colg_distributioncostcode
  note: Rule 12 — Memo = col A + " " + col G.
- target: GR
  source_column: Distribution/Cost Code (G)
  function: reporting_type_from_final_code
- target: GT
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Cost Center
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
    on_fail: reject
- target: GV
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Events - Custom Org
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
- target: GX
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Camps - Custom Org
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
- target: GZ
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: FA Learning - Custom Org
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
- target: HB
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Commercial Partners - Custom Worktag
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
- target: HD
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Grant
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
- target: HF
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Program - Delivered Org
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
