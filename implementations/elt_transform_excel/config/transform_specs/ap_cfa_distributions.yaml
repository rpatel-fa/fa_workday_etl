# Transform spec - ap_cfa_distributions  (*** CFA DISTRIBUTIONS ONLY — NOT CFA CLAIMS ***)
#
# *** CRITICAL NAME CLARITY (2026-08-24):
#     "CFA" is an ambiguous Finance shorthand. Two sibling transforms exist / will exist:
#       1. ap_cfa_distributions  <- THIS transform, for the monthly FA Grant / EP Workforce
#          & Leadership / EP WorkforceIS etc. CFA "distributions" workbook.  Source/target
#          folders live under  .../eib/ap/cfa_distributions/  (renamed 2026-08-24 from
#          the old ambiguous name  .../eib/ap/cfa/).  Labels = "CFA Distributions".
#       2. ap_cfa_claims         <- FUTURE transform.  Will handle the SEPARATE CFA-Claims
#          workbook (different schema).  Will live under .../eib/ap/cfa_claims/.
#     Do not mix these up.  When searching / adding code grep for either "cfa_distributions"
#     or "cfa_claims" explicitly, never bare "cfa".
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors. Lives in
# config/transform_specs/ (not config/transforms/, which the build globs as runnable profiles).
#
# Operational facts - identity, EIB population type, template/source/output paths, and source
# layout (worksheet, header row, required headers) - live in the build profile
# config/transforms/ap_cfa_distributions.yaml (the build-consumed source of truth). Not restated here.
#
# Source workbook: Distributions - Aug (002) - analysis.xlsm
# Data sheet: Finance Master sheet (header row 5, data rows 6.., cols A..U, 21 cols)
#   Col A = DocNo / Row Key      (e.g. "AFAAug2026FA Grant" — 54/54 distinct per FA / EP row;
#                                  used as SuppliersInvoiceNumber AU and InvoiceNumber suffix)
#   B = CFA                       (County FA name: AFA / Army / Bedfordshire / … — informational,
#                                  NOT the legal-entity Company code; Company = constant "FA")
#   C = Type                      ("CFA" on all rows — informational)
#   D = Creditor ID               (legacy AMA003 / ARM003 / BED013 / … County FA creditor codes;
#                                  RETAINED for traceability + skip-row gate, but NO LONGER used
#                                  to resolve the Workday Supplier — see Rule 0 below.)
#   E = Document type             ("invoice" lowercase / INVOICE — gate checks UPPER == INVOICE)
#   F = Description - remittance  (human-readable label; aliased same as old Decscription|Description)
#   G = Distribution/Cost Code    (accounting string: 1077-504007-PNGC0001-0000)
#   H = Total                     (net line amount per FA grant / EP allocation — PurchasesAmount)
#   I = Tax amount                (0 on most rows; rows with >0 trigger Standard Rated tax treatment)
#   J = Tax detail                (POS / VAT tax-detail marker per row; informational)
#   K = Batch ID                  (per-file date: e.g. 2026-08-01 — authoritative InvoiceDate;
#                                  also drives batchIdToken derivation: CFAD + MMYY from this date)
#   L = Code lookup               (FA Grant | EP Workforce & Leadership — informational)
#   M = Code desc                 (extended accounting-code desc; informational)
#   N = Name on GP                (supplier GP name; informational)
#   … gap cols O..T (empty in source)
#   U = Workday ID                *** NEW COLUMN, Finance-team-curated ***
#                                  Workday Supplier Reference ID, pre-selected by the AP team
#                                  (e.g. S-000361 / S-000521 / …). THIS IS THE SOURCE OF TRUTH
#                                  for the EIB Supplier column (O); the Creditor ID → Supplier
#                                  Spreadsheet two-part lookup is BYPASSED completely.
#
# Key structural change (2026-08-24): Finance now populate "Workday ID" (col U) directly in the
# Finance Master sheet, so the Creditor-ID-driven spreadsheet lookup is no longer needed.
# Supplier resolution rule = "use col U verbatim, non-blank gate only".
#
# Derived-field rules (Finance Master sheet -> EIB mapping). Finance Master IS the direct input.
#
#   Rule 0 — Supplier resolution (MAJOR CHANGE vs legacy Integration-tab transform):
#             Supplier is read DIRECTLY from Finance Master col U ("Workday ID").
#             The value is the Workday Supplier Reference (S-XXXXXX) pre-selected by AP team.
#             We NO LONGER load the Supplier Spreadsheet, NO LONGER call
#             ResolveSupplierWithCompanyPrecedence, and NO LONGER do the two-part
#             CreditorID + Company suffix lookup. Supplier is a direct passthrough with
#             a LenB>0 gate (blank Workday ID = skip + report unresolvedSupplierRows).
#             Retained for backwards traceability ONLY: col D (Creditor ID) is still gated
#             as non-blank at RowIsSkippable (so Finance cannot accidentally drop it),
#             but it is not used for resolution.
#   Rule 1 — Company / Legal Entity: CONSTANT "FA". The Finance Master sheet has no
#             explicit Company column (col B = County FA NAME e.g. "AFA", not "FA").
#             Company is resolved via ResolveMappedCompany("FA") → THE FA GROUP - FA.
#             Uniformity check across batch is trivially satisfied (it's a constant).
#   Rule 2 — BatchID token / Invoice-Number prefix: DERIVED from Finance Master col K
#             (Batch ID = date e.g. 2026-08-01). Format = "CFAD" + two-digit-month +
#             two-digit-year-last-2 (e.g. 2026-08-01 → "CFAD0826"). Spaces stripped (none
#             in this derived token); validated non-blank and shared across every row of
#             the batch (which is trivial — all rows share the same col K date).
#             Month-on-month maintenance: Finance change the source file (e.g. September
#             → "Distributions - Sep.xlsm") and set col K to 2026-09-01; the batchIdToken
#             becomes "CFAD0926" with NO Private Const / YAML literal edits.
#   Rule 3 — DocumentType: UPPER(TRIM(Finance Master E)). Gate matches UPPER == "INVOICE".
#   Rule 4 — ItemDescription / Description: UPPER(TRIM(Finance Master F "Description - remittance")).
#             Alias rule preserved (Decscription|Description accepted) for the underlying
#             generic helpers, but the Finance Master header in col F is explicitly
#             "Description - remittance" (no typo).
#   Rule 5 — InvoiceDate: Finance Master col K ("Batch ID") AS IS (read via NormalizeSourceDate
#             → YYYY-MM-DD text). ALL rows of the batch share the same InvoiceDate (date in K
#             is a per-file batch date, not per-row). NOT derived from batchIdToken.
#   Rule 6 — ReceiptDate: Finance Master col K (same as InvoiceDate). The Finance Master
#             sheet carries no separate ReceiptDate; ReceiptDate = InvoiceDate is the
#             operating assumption (downstream Finance can re-key in Workday if the true
#             goods-receipt date differs materially).
#   Rule 7 — DocNo / SuppliersInvoiceNumber (EIB AU): Finance Master col A VERBATIM
#             (e.g. "AFAAug2026FA Grant"). Col A is 54/54 distinct per populated row →
#             passes Workday per-supplier SuppliersInvoiceNumber uniqueness gate directly.
#   Rule 8 — Invoice Number (EIB G): {batchIdToken}-{DocNo}.
#             batchIdToken = "CFAD" + MMYY derived from Finance Master col K (Rule 2).
#             DocNo = Finance Master col A (Rule 7). Result e.g. "CFAD0826-AFAAug2026FA Grant".
#   Rule 9 — Distribution/Cost Code / Final Code / accounting string: Finance Master G
#             AS IS. Written verbatim into the lowest-hierarchy worktag lookups (Cost Centre,
#             Spend Category, Event…Project = cols EQ, DP, ER..EX).
#   Rule 10 — PurchasesAmount (net line amount): Finance Master H AS IS.
#   Rule 11 — TaxAmount: Finance Master I AS IS (informational; tax DS/DT/DY driven by TaxAmount>0).
#   Rule 12 — TaxDetailID: Finance Master J AS IS (informational marker; not used in tax-code split).
#   Rule 13 — Tax applicability per-row (conditional_on_tax_amount):
#              If TaxAmount (Finance Master I) > 0  → GBR_Domestic_Purchase_Of_Goods_And_Services / GBR_Standard / Fully_Recoverable  (AP Supplier std-rated; changed 2026-09-14)
#              Otherwise (TaxAmount == 0/blank) → Outside_of_Scope / Zero_Rated / Nonrecoverable_Allocate
#   Rule 14 — Memo (EIB EO): DocNo + " " + Distribution/Cost Code (col A + " " + col G).
#             Row traceability without reopening the source Excel.
#
# Reuses the standard Supplier Invoice EIB field block (see docs/ADDING_A_TRANSFORM.md); house
# defaults inherited unchanged: f=Y, dd=1, dv=INVOICE/ADJUSTMENT_DATE, dz=CALC_TAX_DUE.

meta:
  key: ap_cfa_distributions
  label: AP CFA Distributions
  requester: Finance (AP)
  date_confirmed: 2026-08-24
  exemplar_to_fork: ap_referees
  note: >
    Finance Master sheet IS the direct input (confirmed by Finance 2026-08-24). 21-column
    layout (A..U) with header on row 5, data rows 6 onwards. KEY CHANGE vs the previous
    Integration-tab-based transform: Finance now populate a "Workday ID" column (col U)
    with the pre-selected Workday Supplier Reference ID (S-XXXXXX). The Creditor ID →
    Supplier Spreadsheet two-part lookup (CreditorID-Company first, then bare CreditorID)
    is NO LONGER PERFORMED; Supplier column (EIB O) = col U passthrough + non-blank gate.
    Company is a constant "FA" (CFA = The FA Group legal entity); batchIdToken is derived
    as "CFAD" + MMYY from Finance Master col K (Batch ID = per-file date); InvoiceDate and
    ReceiptDate both = col K date; DocNo / SuppliersInvoiceNumber (AU) = col A (row key);
    InvoiceNumber (G) = CFADMMYY-{col A}.

shared_helpers:
  supplier_resolution: direct_workday_id_passthrough
  company_resolution: fixed_literal
  accounting_string_derivation: direct_final_code_column
  worktag_hierarchy_lookup: standard_9pack_lowest_specificity
  row_net_resolution: direct_amount
  row_trailer_detection: text_cols_and_amount_cols_parameterized
  source_date_normalization: excel_serial_and_dmy_text

parties:
  supplier:
    source_code: per_row_direct_passthrough
    source_column: Workday ID
    resolved_via: AP Team curated value in Finance Master col U (DIRECT PASSTHROUGH - no lookup)
    key_column: N/A (no spreadsheet lookup)
    value_column: Finance Master col U = Workday Supplier Reference ID (S-XXXXXX)
    key_precedence: N/A (passthrough)
    reference_id_delimiter: N/A
    note: >
      Finance Master col U ("Workday ID") is the authoritative Workday Supplier Reference,
      pre-selected by the AP team. NO Supplier Spreadsheet lookup is performed; the
      Creditor-ID-driven two-part precedence (CreditorID-Company then bare CreditorID) is
      OBSOLETE as of 2026-08-24. Col U non-blank gate only; blank = skip row + report.
      Col D ("Creditor ID") retained purely for traceability + skip-row validation, not
      resolution.
  company:
    source_code: constant
    value: FA
    source_column_present: false
    resolved_via: ResolveMappedCompany("FA") → THE FA GROUP - FA
    note: >
      Finance Master sheet has NO legal-entity Company column (col B = County FA NAME e.g.
      "AFA", not the "FA" code). CFA distributions ALWAYS belong to THE FA GROUP - FA,
      so the company code is a constant "FA" resolved via ResolveMappedCompany with
      OUTPUT_COMPANY_DEFAULT_FALLBACK = "THE FA GROUP - FA" retained as a safety net.

fields:
  invoice_number:
    rule: "{batchIdToken}-{DocNo}"
    note: >
      batchIdToken = "CFAD" + two-digit-month + two-digit-last-2-of-year derived from
      Finance Master col K (Batch ID = per-file date). Example: col K = 2026-08-01 →
      CFAD0826 → e.g. CFAD0826-AFAAug2026FA Grant. DocNo = Finance Master col A
      (54/54 distinct per row → per-invoice uniqueness guaranteed).
  invoice_date:
    source_column: Batch ID (K)
    format: Excel serial date / date-valued cell coerced to YYYY-MM-DD text via NormalizeSourceDate
    note: >
      Finance Master col K ("Batch ID") = per-file batch date. ALL rows of the batch share
      the same date (it's a batch-level field, not per-row). NormalizeSourceDate handles
      both Excel serial-date numeric cells and already-date-valued cells.
  receipt_date:
    source_column: Batch ID (K) - same as InvoiceDate
    format: NormalizeSourceDate (same as InvoiceDate)
    note: >
      Finance Master sheet carries no separate goods-receipt date. ReceiptDate is set equal
      to InvoiceDate (col K) as the operating default.
  suppliers_invoice_number:
    source_column: DocNo / Row Key (A)
    note: >
      Finance Master col A is the per-row unique key (e.g. "AFAAug2026FA Grant"), 54/54
      distinct per valid row. Used VERBATIM as EIB AU (SuppliersInvoiceNumber).
  item_description:
    rule: "UPPER(TRIM(Description - remittance))"
    source_column: Description - remittance (F)
    note: >
      Finance Master col F = "Description - remittance" (no typo; no 'c' extra).
      Uppercase trimmed for consistency with Referees / AMEX transforms; the underlying
      SplitHeaderAliases helper continues to accept the legacy "Decscription|Description"
      pipe-delimited alias in case a future Finance workbook uses the alternate spelling.
  memo:
    rule: "ColA (DocNo) + ' ' + ColG (Distribution/Cost Code)"
    note: >
      EIB EO = Finance Master col A + " " + Finance Master col G. Downstream traceability
      without reopening the source Distributions workbook.
  line_amount:
    source_column: Total
    basis: net
    note: >
      Net line amount per FA grant / per EP allocation (Finance Master col H). Tax per-row
      (Rule 13) splits zero vs standard; CALC_TAX_DUE computes the VAT addition on
      standard-rated rows from the tax code applied to the net amount.
  spend_category:
    derivation: per_row_lookup
    key_source_column: Distribution/Cost Code (G)
    key_rule: lowest-hierarchy matching accounting-string segment
    # --- SHARED --- standard_9pack_lowest_specificity.shared_lookup_skeleton
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Spend Category
    specificity_standard: integration_default
    on_unresolved: skip_and_report
    note: >
      Verified against Mapping MASTER: 504007 → Staff_Grant (FA Grant rows);
      504012 → Programme_Grant (EP Workforce & Leadership rows).
  reporting_type:
    source_column: Distribution/Cost Code (G)
    rule: second accounting-string segment first character via reporting_type_from_final_code helper
    note: Same reporting_type_from_final_code helper used by AMEX / Referees transforms; splits on "-".
  cost_centre:
    derivation: per_row_lookup
    key_source_column: Distribution/Cost Code (G)
    key_rule: lowest-hierarchy matching accounting-string segment
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Cost Center
    specificity_standard: integration_default
    on_unresolved: skip_and_report
  related_worktags:
    event:
      target: er
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Events - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    camp:
      target: es
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Camps - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    fa_learning_course:
      target: et
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: FA Learning - Custom Org
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    commercial_partner:
      target: eu
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Commercial Partners - Custom Worktag
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    grant:
      target: ev
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Grant
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    programme:
      target: ew
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Program - Delivered Org
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok
    project:
      target: ex
      source_column: Distribution/Cost Code (G)
      worktag_business_object_key: Projects (Opex)
      use_shared_lookup: standard_9pack_lowest_specificity
      specificity_standard: integration_default
      on_unresolved: skip_ok

tax:
  mode: conditional_on_tax_amount
  zero_rated:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  standard_rated:
    # CHANGED 2026-09-14: AP Supplier-Invoice standard-rated uses the domestic PURCHASE ref-ids
    # (was GBR_Standard_Rated / GBR_Standard_Rated / Recoverable_Allocate, which is the AR
    # Customer-Invoice value). AP confirmed; matches ap_taxi / ap_stationery / ap_travel_places.
    applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
    code: GBR_Standard
    recoverability: Fully_Recoverable
  note: >
    Tax code is per-row conditional based on Finance Master I (Tax amount):
      TaxAmount > 0     → Standard Rated / Standard / Recoverable
      TaxAmount == 0/∅ → Outside of Scope / Zero Rated / Nonrecoverable
    (Identical logic to the previous Integration-tab transform; only the source column letter
    changed from Integration K to Finance Master I.)

skip_rule:
  drop_when:
    - Col A (DocNo/Row Key) blank
    - Col D (Creditor ID) blank                      [retained gate for data integrity — NOT used for resolution]
    - Col E (Document type) UPPER != INVOICE         [accepts lowercase "invoice" via UCASE compare]
    - Col F (Description) blank
    - Col K (Batch ID / InvoiceDate) blank
    - Col G (Distribution/Cost Code) blank
    - Col H (Total / PurchasesAmount) == 0
    - Col U (Workday ID) blank                       [new mandatory gate - AP curated supplier ID]
    - cost_centre unresolved
    - spend_category unresolved
    - supplier unresolved = col U blank (Creditor-ID-spreadsheet path removed)

trailer_row_handling:
  pattern: >
    Exemplar data rows = 54 (rows 6..60 approx; 50 FA Grant + 3 EP Workforce + 1 EP WorkforceIS
    in the August 002 file). consecutive-empty-rows stop-gate of >=3 blanks halts iteration
    cleanly after the data block. If any Grand Total / summation row is present below, the
    RowIsEmptyOrTrailer summation-keyword match (TOTAL / GRAND / SUBTOTAL / SUM whole-word)
    absorbs it silently; otherwise RowIsSkippable rejects it on DocNo/Description blank.

open_questions:
  - >-
    ReceiptDate fallback: confirm ReceiptDate == InvoiceDate (col K) is acceptable. Finance
    Master has no separate goods-receipt date column. If a true receipt date becomes
    material, add a ReceiptDate column in Finance Master and thread it through directly.
  - >-
    Month-on-month maintenance (e.g. September → new "Distributions - Sep.xlsm"):
    (1) shell_defaults.source_data = new file path;
    (2) ensure Finance Master col K (Batch ID) = the correct month start date
        (e.g. 2026-09-01 → batchIdToken auto-derives "CFAD0926" - NO code edits needed);
    (3) ensure col U (Workday ID) is populated for every valid row (non-blank gate now live);
    (4) ALL other layout + headers unchanged (dates from K per batch, not per-row, tax
        conditional per-row from col I).
  - >-
    Optional worktags (ER through EX: Event/Camp/FA Learning/Commercial Partner/Grant/Program/
    Project): treated as optional (row writes blank silently, no reject, no skip). Confirm
    all seven are genuinely optional vs any should be mandatory like cost-centre/spend-category.
  - >-
    Tax treatment on EP Workforce rows: confirm zero-rated (TaxAmount == 0 on all 4 EP rows in
    the Aug 002 exemplar; conditional branch Standard-Rated is live should any future EP row
    carry VAT > 0).

mapping:
- target: B
  function: invoice_line_grouping
  note: >
    Spreadsheet Key via modInvoiceGrouping.AssignInvoiceLineGroup -- increments per NEW Invoice
    Number (K); shared across a group's rows. Single-line invoices trivially get 1..N (CHANGED
    2026-09-14 from per-row sequence). One uniform mechanism, no single/multi-line distinction.
- target: I
  default: "Y"
- target: K
  function: concat_batchidtoken_derived_from_col_k_date_minus_col_a_docno
  note: Rule 8 — "{batchIdToken}-{DocNo}" per row. batchIdToken = "CFAD" + MMYY from Finance Master col K (Batch ID date). DocNo = Finance Master col A (per-row unique key). EIB G = Invoice Number.
- target: R
  default: "{resolved via ResolveMappedCompany(\"FA\")}"
  source_value: constant_FA
  lookup:
    file: this
    tab: mapping
    filter_column: entity
    filter_value: company
    input_column: source
    output_column: target
  note: Rule 1 — Company = constant "FA" (CFA always = THE FA GROUP - FA). No Finance Master column drives Company.
- target: T
  default: GBP
  note: No currency column in Finance Master; CFA = UK entities.
- target: U
  source_column: Workday ID
  note: Rule 0 — Supplier = Finance Master col U PASSTHROUGH. AP-team-curated Workday Supplier Reference ID (S-XXXXXX). NO Supplier Spreadsheet lookup. Creditor-ID two-part precedence lookup RETIRED 2026-08-24.
- target: AF
  source_column: Batch ID (K)
  function: normalize_source_date
  note: Rule 5 — InvoiceDate per batch from Finance Master col K (same date for all rows).
- target: AG
  source_column: Batch ID (K)
  function: normalize_source_date
  note: Rule 6 — ReceiptDate = InvoiceDate (Finance Master K, no separate receipt date in source).
- target: BG
  source_column: DocNo / Row Key (A)
  note: Rule 7 — SuppliersInvoiceNumber = Finance Master col A (per-row unique key).
- target: EK
  function: invoice_line_grouping
  note: Row ID = 1..N within the Invoice Number group (mirror of EM). Single-line rows get 1 (CHANGED 2026-09-14 from hardcoded 1).
- target: EM
  function: invoice_line_grouping
  note: Line Order = 1..N within the Invoice Number group (mirror of EK). ADDED 2026-09-14.
- target: EP
  function: upper_trim
  source_column: Description - remittance (F)
  note: Rule 4 — UPPER(TRIM(Finance Master F "Description - remittance")).
- target: EW
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
    file: Mapping Spreadsheet
    tab: MAPPING MASTER
    filter_column: WORKDAY BUSINESS OBJECT
    filter_value: Spend Category
    filter_include_column: Core vs Prism
    filter_include_value: Core
    input_column: OLD CODE
    output_column: WORKDAY REF ID
    on_fail: reject
- target: FE
  function: tax_on_taxamount_conditional
  slot: applicability
  note: Rule 13 — If TaxAmount (I) > 0 → Standard_Rated; else → Outside_of_Scope.
- target: FF
  function: tax_on_taxamount_conditional
  slot: code
  note: Rule 13 — If TaxAmount (I) > 0 → Standard_Rated code; else → Zero_Rated code.
- target: FH
  default: INVOICE/ADJUSTMENT_DATE
- target: FK
  function: tax_on_taxamount_conditional
  slot: recoverability
  note: Rule 13 — If TaxAmount (I) > 0 → Recoverable_Allocate; else → Nonrecoverable_Allocate.
- target: FL
  default: CALC_TAX_DUE
  note: >
    CALC_TAX_DUE = Workday computes the VAT figure on standard-rated rows from the net
    PurchasesAmount (col H) and the DS/DT/DY tax codes. Zero-rated rows have no VAT to add.
- target: GE
  source_column: Total (H)
  note: Rule 10 — Net line amount = Finance Master col H (Total / PurchasesAmount).
- target: GF
  source_column: Total (H)
- target: GQ
  function: concat_cola_docno_space_colg_distributioncostcode
  note: Rule 14 — Memo (EO) = Finance Master col A (DocNo) + " " + Finance Master col G (Distribution/Cost Code).
- target: GR
  source_column: Distribution/Cost Code (G)
  function: reporting_type_from_final_code
- target: GT
  source_column: Distribution/Cost Code (G)
  function: lookup_worktag_from_final_code
  lookup:
