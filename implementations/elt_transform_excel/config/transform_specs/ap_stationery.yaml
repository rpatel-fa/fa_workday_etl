tax:
  mode: per_row
  driver_source_column: TaxCode               # Rule 11 = col P string (NOT percentage)
  header_alias_primary: TaxCode
  header_alias_secondary: TaxDetailID         # if in future supplier reverts to old GP name
  sets:
    - when_value_eq: P20
      applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable
      note: CHANGED 2026-09-09 — previously GBR_Standard_Rated / GBR_Standard_Rated / Recoverable_Allocate. AP confirmed (vs Will's Aug Ambassador Taxi hand-edited EIB) that Supplier-Invoice Purchase ref-IDs MUST use Domestic Purchase Of Goods And Services / GBR_Standard / Fully_Recoverable. Generic Standard_Rated is for Customer-Invoice domain, not Supplier.
    - when_value_eq: P0
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
      note: Future UK zero-rated exports / tax-exempt stationery purchases.
    - when_value_eq: PZ
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
      note: Alternative zero-rated code used by some Finance GP configs.
  on_unknown_when_value: reject_and_report    # never silently default to a tax code

skip_rule:
  drop_when:
    - Template blank                          # guard against blank padding rows after last data
    - SupplierID blank or missing "-" separator   # can't split into Company/Creditor
    - InvoiceNumber blank
    - InvoiceDate blank
    - Net (or Net Amount) <= 0 AND Gross - Tax <= 0   # zero-value lines rejected
    - CostCode (New/Final) blank after separator normalization
    - cost_centre unresolved

unused_source_columns:
  # Columns present in the source that are EXPLICITLY NOT written to the EIB output.
  # Confirmed with Finance — these are Proactis-internal controls, not Workday fields.
  - Template:                                 # Always "MDINV" in all 4 exemplars. Workday doesn't need this label.
  - Tray:                                     # "Invoices A to I" — Finance in-tray bucket. Workday has no analogue.
  - CreatedBy:                                # "FA\JPATEL1" style NT login — internal GP audit trail, not supplier-facing EIB data.
  - ItemCode:                                 # Always "VAL" — Proactis validation marker, irrelevant to Workday.
  - ReceivedDate:                             # NOTE: NOT ACTUALLY UNUSED — listed here just to cross-link to Rule 5 note that it falls back to InvoiceDate if empty.
    note: Used by Rule 5 (ReceiptDate); listed only for cross-reference completeness.

open_questions: []                           # all decisions resolved in this spec

mapping:
# EIB-level columns (not line-level). House defaults = f=Y, dd=1, dv=INVOICE/ADJUSTMENT_DATE,
# dz=CALC_TAX_DUE. Only restating divergences here for brevity.
#
# CHANGED 2026-09-08 (Ambassador Taxi Invoice 496 multi-line: same invoice number on N rows
#   → Workday duplicate-ref rejection if per-row sequential B, hardcoded EK=1):
#   B Spreadsheet Key: per-group SHARED integer keyed by InvoiceNumber (Rule 15).
#   AS Control Amount Total: LEAVE BLANK (Rule 17 — CHANGED 2026-09-09; AP confirmed no value here).
#   EL Supplier Invoice Line ID: BLANK (Workday auto-assigns from Line Order EM).
#   EM Line Order: per-group 1..N reset counter (Rule 16).
#   EK Row ID: EXACT mirror of EM (Rule 19); replaced legacy hardcoded default=1.
#   GE Unit Cost / GF Extended Amount: BOTH = Net (Rule 10 CHANGED 2026-09-09; AP confirmed both must match — no VAT pre-add in GF).
- target: B
  source: spreadsheet_key_group_id (fields.spreadsheet_key_group_id)
  rule: Rule 15 (per Col C InvoiceNumber group, sequential ID starting at 1; all rows of
          same group WRITE THE SAME integer to B. Source-file appearance order.
          Group key = source Col C InvoiceNumber; 1 group per distinct InvoiceNumber.)
- target: I
  default: "Y"
- target: K
  source: invoice_number (fields.invoice_number)
  function: concatenate_3segments_creditorid_yymm_sourceinvnum_dash_separated
  rule: >
    Rule 3 (CHANGED 2026-09-08 — UNIQUE composite K = CreditorID_RightSegment
    (SupplierID split RIGHT) + '-' + YYMM(InvoiceDate, ISO YYYY-MM-DD -> last 2
    year+2 month, hyphen stripped) + '-' + RawSourceInvoiceNumber (source col C).
    Format e.g. ADD001-2607-18 / AMB001-2607-496 / DHL001-2606-55 / ECO003-2607-576.
    Guarantees no cross-supplier, cross-month, or cross-invoice collision in
    Workday within Supplier+Company scope. Same K on all rows of a multi-line
    group. YYMM is derived from NormalizeSourceDate's output to guarantee
    byte-identity with AF InvoiceDate on every row.)
- target: R
  source_resolution: split_SupplierID_left    # Rule 1: Company from SupplierID
  lookup:
    file: this
    tab: mapping
    filter_column: entity
    filter_value: company
    input_column: source
    output_column: target
    fallback_on_fail: THE FA GROUP - FA
- target: T
  source_column: Currency
  default: GBP
- target: U
  source_resolution: split_SupplierID_right_2part_precedence  # Rule 2
  lookup:
    file: Supplier Spreadsheet
    tab: Sheet1
    input_column: Reference ID
    output_column: Supplier ID
    equality: pipe_delimiter_contains
    on_fail: reject
- target: AF
  source_column: InvoiceDate
  source_format: Excel serial date
  target_format: YYYY-MM-DD
- target: AG
  source: receipt_date (fields.receipt_date)
  rule: >
    Rule 5. CHANGED 2026-09-09 — LEAVE BLANK / EMPTY per Will's hand-edited Aug EIB
    (14/14 rows AG=None). Do NOT read from ReceivedDate, do NOT fall back to InvoiceDate.
    AG is EXCLUDED from Rule 18 guard because it can legitimately vary — but in this
    case Will's file confirms we omit the column entirely.
- target: AS
  source: control_amount_total_per_group (fields.control_amount_total_per_group)
  rule: Rule 17 (CHANGED 2026-09-09 — LEAVE BLANK / EMPTY. AP explicitly confirmed no
          Control Amount Total value is required. The correct Aug reference file has
          AS entirely blank.)
- target: BG
  source: suppliers_invoice_number (fields.suppliers_invoice_number)
  source_column: InvoiceNumber
  rule: >
    Rule 6. BG = EXTERNAL-FACING bare passthrough of col C InvoiceNumber (no Creditor prefix,
    no YYMM token). INTENTIONALLY DIFFERENT from K (Rule 3 composite). Example pair:
    K=AMB001-2607-496 (internal Workday unique key)  vs  BG=496 (external supplier-issued ref
    for AP PDF cross-check). Retained 2026-09-09 per user instruction: keep composite K for
    uniqueness; keep BG raw for AP reconciliation. Previously (Will's shortcut): K=BG=495.
- target: BH
  source_column: PONumber
  on_blank: leave_empty
- target: EL
  source: "Supplier Invoice Line ID (col 142)"
  rule: "Leave EMPTY (do not write a value). Workday auto-allocates Supplier Invoice
          Line ID internal refs from Line Order col EM."
- target: EM
  source: line_order_within_group (fields.line_order_within_group)
  rule: >
    Rule 16. CRITICAL for mixed single + multi-line batches (Sept). Per-group 1..N sequential
    counter, reset on new InvoiceNumber group. Workday B+EM tuple = authoritative line
    position tuple; EM counter enables CALC_TAX_DUE line-level tax allocation and grouping.
    Single-line groups trivially produce 1 (no drift vs Aug 1-group case).
- target: EK
  source: invoice_line_row_id (fields.invoice_line_row_id)
  rule: >
    Rule 19. EXACT MIRROR of Rule 16 EM Line Order. Written from the SAME `lineOrderNext` VBA
    local to guarantee byte-identity per row. Mixed single/multi-line Sept batches require
    EK == EM invariant per row. Single-line groups trivially produce 1 (matches constant-1
    legacy default for Great Plains 1:1 migration).
- target: EP
  source_column: Description
  post_process: UCaseTrim
