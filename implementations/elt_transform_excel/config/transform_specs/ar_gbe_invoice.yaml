# Transform spec - ar_gbe_invoice
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors.
#
# Operational facts - identity, EIB population type, template/source/output paths, source
# layout (worksheet, header row, required headers) and the two tab variants - live in the
# build profile config/transforms/ar_gbe_invoice.yaml. Not restated here.
#
# ONE transform, TWO variant sources (Governing Body Endorsement player-registration
# invoices). Same workbook, two IDENTICALLY-shaped tabs run as separate Runner selections:
#   "Mens GBE"   -> AR Invoice GBE Mens
#   "Womens GBE" -> AR Invoice GBE Womens
# The one-transform-many-sources pattern mirrors ap_stationery; here the "many sources" are
# two tabs of one file, selected per-variant via source_worksheet_name.
#
# Source layout (both tabs, header row 1, data rows 2..N), AS OF 2026-09-17 (AR-supplied
# "22. GBE - August 26.xlsx"):
#   A WORKDAY ID|Customer ID | B Date | C Club|Customer Name | D Gross | E VAT | F Net |
#   G Invoice Line Description | H Invoice line part 2|Invoice Line Description 2 |
#   I PO | J (blank) | K Company | L Cost Centre | M Reporting Type | N Revenue Category
#   NOTE: col I "PO" (previously listed as "Invoice Memo") feeds Customer PO Number (CQ) per
#   row as a direct passthrough (2026-10-22); optional - not in required_headers.
#   NOTE: the "Womens GBE" header row OMITS the "VAT" label in col E (the data is still
#   present). VAT is therefore not read: the VAT amount driving Line Tax Applicability (FA)
#   and Line Tax Code (FB) is derived as Gross - Net, present on both tabs (2026-10-07).
#   NOTE: col A's header differs by tab ("WORKDAY ID" Mens / "Customer ID" Womens) but both
#   carry a ready-made Workday Customer ID per row (e.g. "C-000102").
#   NOTE: K/L/M/N (Company / Cost Centre / Reporting Type / Revenue Category) are BATCH
#   CONSTANTS - only row 2 carries a value; it applies to every row in the run.
#   NOTE: DECIDED 2026-09-17 - Player and Reference are no longer separate columns; both are
#   embedded in col G ("Invoice Line Description"), e.g.
#   "Romain Jordan Faivre-FOOT01/22/S-2024-1669". Split at runtime on the literal "-FOOT"
#   anchor token: verified against all 584 rows of this file (435 Mens + 149 Womens, 100%
#   match), including hyphenated surnames (e.g. "Peyraud-Magnin-FOOT01/###/S-2024-0795" still
#   splits correctly since the anchor is the literal substring "-FOOT", not "first/last dash").
#   Mirrors ap_travel_places' inline SupplierID split (InStr + Left$/Mid$, no shared helper).
#
# Data shape = one source row = one single-line Workday Customer Invoice. Each row is one
# club/player GBE line, keyed by the Reference extracted from col G.

meta:
  key: ar_gbe_invoice
  label: AR Invoice GBE
  requester: Finance (AR)
  date_confirmed: 2026-09-02
  exemplar_to_fork: ar_bulk_invoice   # one-row-one-invoice v46.1 Customer Invoice
  note: >
    Structural fork of ar_bulk_invoice with three deliberate differences:
    (1) CUSTOMER RESOLVED BY DIRECT PASSTHROUGH (as of 2026-09-17). AR now delivers a
        ready-made Workday Customer ID per row in source col A ("WORKDAY ID" on the Mens
        tab / "Customer ID" on the Womens tab, e.g. "C-000102"). That value is copied
        straight to target AJ; a blank col A rejects the row. This SUPERSEDES the
        earlier two-level club-name cascade (customer_name_resolution =
        two_level_l1_l2_sql_migration, described in open_questions.gbe_customer_id_from_ar
        below for history) - the shared helper is untouched in shared_helper_registry.yaml
        / modFinanceCommon.bas and remains available to other transforms, it is simply no
        longer called here.
    (2) NO PER-ROW COST CODE, BUT BATCH-CONSTANT WORKTAGS. GBE still has no per-row
        accounting-string column, so Event/Camp/FA Learning/Commercial Partner/Grant/
        Programme/Project stay blank (Mapping-MASTER hierarchy lookup remains inert:
        costCodeColumn resolves to 0). However Company (J), Cost Centre (FX), Reporting
        Type (FY) and Revenue Category (EM) are now supplied by AR as BATCH CONSTANTS in
        source columns K/L/M/N: only row 2 carries a value; it is read once and applied to
        every output row (as of 2026-09-17).
    (3) PER-ROW TAX (restored 2026-10-07). Line Tax Applicability (FA) and Line Tax Code (FB)
        are set per row with the same rule and values as ar_integration_invoice, using
        VAT = Gross - Net so the Womens tab (missing the VAT header) is handled identically.
        FA/FB were blank 2026-09-28 to 2026-10-07. Invoice Number (BO) stays blank.

shared_helpers:
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number
  # customer_name_resolution (two_level_l1_l2_sql_migration) is NO LONGER called by this
  # transform as of 2026-09-17 - see parties.customer below. The helper itself is untouched
  # in shared_helper_registry.yaml / modFinanceCommon.bas for other transforms to use.

parties:
  customer:
    source_column: WORKDAY ID|Customer ID
    source_column_letter: A
    source_code: per_row_direct_passthrough
    on_blank: reject
    note: >
      DECIDED 2026-09-17: AR now delivers a ready-made Workday Customer ID per row (col A;
      header "WORKDAY ID" on the Mens tab / "Customer ID" on the Womens tab). Direct
      passthrough to target AJ, mirroring the ap_cfa_claims supplier-ID pattern. This
      supersedes the earlier two-level club-name cascade match (history retained in
      open_questions.gbe_customer_id_from_ar below).
  company: {source_column: Company, source_column_letter: K, mode: batch_constant_first_data_row, fallback: THE FA GROUP - FA}

notes: >
  GBE (Governing Body Endorsement) invoices bill football clubs for player-registration
  endorsement panels/extensions. The composite customer-invoice identifier is written to G
  as gbe_{mens|womens}_{Customer without hyphen}_{Invoice Date YYYYMMDD}_{Spreadsheet Key},
  while D is intentionally left blank because Workday treats it as an existing-invoice lookup
  and rejects a new ID there. The extracted Reference from col G ("Invoice Line Description",
  split on the literal "-FOOT" anchor token - see mapping target `g` below) remains the shared
  invoice-line grouping key for Spreadsheet Key plus Row ID / Line Order and is still copied
  into the header Memo (DB). A repeated `Reference` therefore collapses to one Workday header
  with 1..N lines; a unique `Reference` remains the single-line case. v46.1 layout. Amounts
  mirrored ar_bulk_invoice / ar_multi_line_invoice's GROSS-into-amounts convention originally;
  DECIDED 2026-09-17: Amount Due (CM), Unit Cost (FL) and Extended Amount (FO) all came from
  NET (col F) instead of GROSS; as of 2026-10-07 CM and FO are left blank on every row (as
  ar_integration_invoice / ar_discipline_invoice) and only FL carries NET. Invoice Number (BO) is left blank on every row (DECIDED
  2026-09-28); Line Tax Applicability (FA) and Line Tax Code (FB) are set per row from the
  Net / (Gross - Net) split, mirroring ar_integration_invoice (see tax_rules). Line Item Description
  (EN) + line Memo (FV) = Player + " - " + Type, where Player is the text before the "-FOOT"
  split and Type comes from col H. Customer PO Number (CQ) = source col I "PO" per row
  (2026-10-22), blank when the cell or column is absent.

fields:
  customer_po_number:
    source_column: PO
    source_column_letter: I
    source_code: per_row_direct_passthrough
    on_blank: leave_empty
    note: >
      Added 2026-10-22 per requester instruction: Customer PO Number (CQ) maps to source
      col I "PO". Optional column (not in required_headers) - a missing column or blank cell
      leaves CQ empty; Customer PO Number is not mandatory for Submit Customer Invoice.
  invoice_number:
    source_column: Invoice Line Description
    source_column_letter: G
    function: split_on_anchor_token
    split_anchor_token: "-FOOT"
    split_part: after_anchor
    note: >
      DECIDED 2026-09-17: Reference is no longer its own column - it is the part of col G
      ("Invoice Line Description") from the literal "-FOOT" anchor token onward (e.g.
      "FOOT01/22/S-2024-1669" out of "Romain Jordan Faivre-FOOT01/22/S-2024-1669"). Verified
      against all 584 rows of the 2026-09-17 AR file. It remains the shared grouping key for
      the invoice-line helper and is copied to DB; G holds the composite gbe_... identifier and
      D remains blank. A row whose col G has no "-FOOT" token is rejected (never guessed) - see skip_rule.
  spreadsheet_key_group_id:
    function: per_source_invoice_number_group_sequential_id
    group_key_source_column: Reference
    id_start: 1
    id_assignment_order: source_file_row_order
    note: >
      Spreadsheet Key B is assigned once per distinct extracted `Reference` in first-seen row order.
  line_row_id_within_group:
    function: per_source_invoice_number_group_1based_reset_counter
    group_key_source_column: Reference
    counter_start: 1
    reset_on_new_group: true
    counter_assignment_order: source_file_row_order_within_group
    note: >
      Target DS is the grouped row id emitted from the shared invoice-line helper.
  line_order_within_group:
    function: per_source_invoice_number_group_1based_reset_counter
    group_key_source_column: Reference
    counter_start: 1
    reset_on_new_group: true
    counter_assignment_order: source_file_row_order_within_group
    note: >
      Target DV is the grouped line order emitted from the shared invoice-line helper.

tax_rules:
  note: >
    Restored 2026-10-07 -- same rule and values as ar_integration_invoice tax_rules (FA/FB
    were left blank 2026-09-28 to 2026-10-07; before that per-row derived with
    GBR_Standard_Rated for 20% rows). Source columns D (Gross) and F (Net); the VAT amount
    is Gross - Net because the Womens tab header omits the "VAT" label in col E. Rows with
    Gross = 0 are already skipped upstream (RowIsSkippable), so the NET = 0 / GROSS = 0
    branch is kept only for parity.
  row_level_determination:
    input_columns: ["Gross", "Net"]
    rule: |-
      effective_net = ResolveAmount(source, Net_col)
      effective_gross = ResolveAmount(source, Gross_col)
      effective_vat = effective_gross - effective_net
      If effective_net > 0 And effective_vat = 0 Then
          tax_triple = ZERO_RATED_SET
      ElseIf effective_net > 0 And Abs((effective_vat / effective_net) - 0.2) < 0.01 Then
          tax_triple = STANDARD_RATED_20PC_SET
      ElseIf effective_net = 0 And effective_gross = 0 Then
          tax_triple = ZERO_RATED_SET
      Else
          tax_triple = STANDARD_RATED_20PC_SET (sane default)
      End If
  standard_rated_20pc:
    applicability: GBR_Domestic_Sale_of_Goods_and_Services
    code: GBR_Standard
    recoverability: Fully_Recoverable
  zero_rated:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Fully_Recoverable

accounting_string:
  driver: none
  note: >
    GBE still has no per-row COST CODE / accounting-string column, so the Mapping-MASTER
    hierarchy lookup and 6 of the 9 worktag slots (event, camp, FA Learning, commercial
    partner, grant, programme, project) stay blank; Finance codes pre-upload. As of
    2026-09-17, Revenue Category (EM), Cost Centre (FX) and Reporting Type (FY) are no
    longer part of that inert pipeline - they are BATCH CONSTANTS read from source columns
    N/L/M row 2 (see meta.note item 2 and mapping targets em/fx/fy above).

skip_rule:
  drop_when:
    - Date blank
    - Club blank
    - Gross == 0
    - Invoice Line Description (col G) has no "-FOOT" anchor token (Reference unparseable)
    - Workday Customer ID (col A) blank

mapping:
# EIB-level + line-level columns for one-row-one-invoice. House defaults: submit=Y,
# auto_complete=Y, currency=GBP, payment=Unpaid, document=Approved, invoice_type=Standard.
- target: b
  function: invoice_group_spreadsheet_key
  note: >
    Populated by AssignInvoiceLineGroup keyed by `Reference`. Repeated source references
    therefore share one Spreadsheet Key; a unique reference is the N=1 case.
- target: h
  default: "Y"
- target: i
  default: ""
- target: d
  default: ""
  optional: true
  note: >
    Customer Invoice Reference ID -- intentionally left blank on every row. In Submit
    Customer Invoice this field looks up an EXISTING Workday invoice, so a new ID here fails
    the load with an invalid Customer_Invoice_Reference_ID error. The composite invoice ID is
    written to G instead.
- target: g
  derivation: composite_reference_id
  output_format: "gbe_{variant}_{aj with hyphens removed}_{YYYYMMDD of br}_{b}"
  variant_token:
    ar_gbe_invoice_mens: mens
    ar_gbe_invoice_womens: womens
  examples:
    - "gbe_mens_C000102_20260317_1"     # Mens GBE row 1: C-000102, 2026-03-17, Spreadsheet Key 1
    - "gbe_mens_C000102_20260501_2"     # Mens GBE row 2: C-000102, 2026-05-01, Spreadsheet Key 2
    - "gbe_womens_C000300_20260427_1"   # Womens GBE row 1: C-000300, 2026-04-27, Spreadsheet Key 1
    - "gbe_womens_C000300_20260427_2"   # Womens GBE row 2: C-000300, 2026-04-27, Spreadsheet Key 2
  note: >
    Customer Invoice ID -- per requester instruction (2026-09-28): literal "gbe_",
    then the variant token ("mens" for AR Invoice GBE Mens / "womens" for AR Invoice GBE
    Womens), then the Customer written to `aj` with its hyphen removed (`C-000102` ->
    `C000102`), then the Invoice Date written to `br` as YYYYMMDD, then the Spreadsheet Key
    written to `b`, joined by "_". The hyphen is removed only in G; `aj` keeps the original
    Customer ID. Spreadsheet Key restarts at 1 on each tab, so the variant token keeps Mens
    and Womens IDs distinct; within a tab the Spreadsheet Key keeps two invoices for the same
    customer on the same date distinct. Should be written as text. The extracted Reference
    from col G (the part from "-FOOT" onward) remains the grouping key and is still written to
    the header Memo (DB).
- target: bo
  default: ""
  optional: true
  note: >
    Invoice Number -- left blank on every row per requester instruction (2026-09-28).
    Previously the extracted Reference (same value as G).
- target: j
  source_column: Company
  source_column_letter: K
  function: batch_constant_first_data_row
  fallback: THE FA GROUP - FA
  note: >
    DECIDED 2026-09-17: Company is now a BATCH CONSTANT from source col K - only row 2
    carries a value; it is read once and written to every output row. Supersedes the
    earlier fixed_company_code_via_mapping lookup via the internal mapping tab.
- target: ai
  default: GBP
- target: aj
  source_column: WORKDAY ID|Customer ID
  source_column_letter: A
  source_code: per_row_direct_passthrough
  on_blank: reject
  note: >
    DECIDED 2026-09-17: direct passthrough of the AR-supplied Workday Customer ID.
    Supersedes the earlier two-level club-name cascade lookup.
- target: fx
  source_column: Cost Centre
  source_column_letter: L
  function: batch_constant_first_data_row
  note: Cost Centre (FX) is a BATCH CONSTANT from source col L (row 2), added 2026-09-17.
- target: fy
  source_column: Reporting Type
  source_column_letter: M
  function: batch_constant_first_data_row
  note: Reporting Type (FY) is a BATCH CONSTANT from source col M (row 2), added 2026-09-17.
- target: em
  source_column: Revenue Category
  source_column_letter: N
  function: batch_constant_first_data_row
  note: Revenue Category (EM) is a BATCH CONSTANT from source col N (row 2), added 2026-09-17.
- target: br
  source_column: Date
  source_format: Excel date serial or dd/mm/yyyy
  target_format: YYYY-MM-DD
- target: ck
  default: Unpaid
- target: cl
  default: Approved
- target: cm
  default: ""
  optional: true
  note: >
    Amount Due -- left blank on every row per requester instruction (2026-10-07), same as
    ar_integration_invoice / ar_discipline_invoice. Previously source NET (col F).
- target: co
  default: Standard
- target: cq
  source_column: PO
  source_column_letter: I
  source_code: per_row_direct_passthrough
  on_blank: leave_empty
  optional: true
  note: >
    Customer PO Number -- source col I "PO" verbatim (trimmed), written as text so numeric
    POs keep leading zeros (2026-10-22). Blank cell or missing column -> CQ left empty.
- target: db
  source_column: Invoice Line Description
  source_column_letter: G
  function: split_on_anchor_token
  split_anchor_token: "-FOOT"
  split_part: after_anchor
  note: Header Memo (DB) = extracted GBE Reference for traceability.
- target: ds
  function: invoice_group_line_order
  note: >
    Populated by the same AssignInvoiceLineGroup call as target `b`, so repeated
    source references write a 1..N row id within the grouped invoice.
- target: dv
  function: invoice_group_line_order
  note: >
    Populated by the same AssignInvoiceLineGroup call as target `b`, so repeated
    source references write a 1..N line order within the grouped invoice.
- target: en
  derivation: player_dash_type
  source_columns: [Invoice Line Description, Invoice line part 2|Invoice Line Description 2]
  note: >
    Line Item Description = Player + " - " + Type. Player is the part of "Invoice Line
    Description" (col G) BEFORE the "-FOOT" split token (see fields.invoice_number); Type is
    col H verbatim (e.g. "Boubacar Kamara - Extension").
- target: fa
  derivation: per_row_tax_applicability
  rule: tax_rules.row_level_determination -> standard_rated_20pc.applicability or zero_rated.applicability
  note: >
    Tax Applicability FA = per-row based on the Net / (Gross - Net) ratio, mirroring
    ar_integration_invoice (requester instruction 2026-10-07). 20% rows ->
    GBR_Domestic_Sale_of_Goods_and_Services; 0% rows -> GBR_Outside_of_Scope. Left blank
    2026-09-28 to 2026-10-07; before that 20% rows were GBR_Standard_Rated.
- target: fb
  derivation: per_row_tax_code
  rule: tax_rules.row_level_determination -> standard_rated_20pc.code or zero_rated.code
  note: >
    Tax Code FB = per-row based on the Net / (Gross - Net) ratio, mirroring
    ar_integration_invoice (requester instruction 2026-10-07). 20% rows -> GBR_Standard;
    0% rows -> GBR_Zero_Rated. Left blank 2026-09-28 to 2026-10-07; before that 20% rows
    were GBR_Standard_Rated.
- target: fl
  source_column: Net
  source_column_letter: F
  note: >
    DECIDED 2026-09-17: Unit Cost FL = NET (col F), not GROSS. Workday adds VAT from the
    line Tax Code (FB).
- target: fo
  default: ""
  optional: true
  note: >
    Extended Amount -- left blank on every row per requester instruction (2026-10-07), same
    as ar_integration_invoice / ar_discipline_invoice. Previously source NET (col F).
- target: fp
  source_column: Date
  source_format: Excel date serial or dd/mm/yyyy
  target_format: YYYY-MM-DD
- target: fv
  derivation: player_dash_type
  source_columns: [Invoice Line Description, Invoice line part 2|Invoice Line Description 2]

unused_source_columns:
  # Columns present in the source that are NOT written to the EIB output.
  - VAT:   # NOT read. Header absent on Womens tab; FA/FB use VAT = Gross - Net instead (see tax_rules).
  # NOTE: Net (col F) is NO LONGER unused as of 2026-09-17 - it is written directly to
  # FL (see mapping target fl above); CM/FO are blank as of 2026-10-07.

open_questions:
  - id: gbe_customer_id_from_ar
    decision: >
      DECIDED 2026-09-07: the interim name-matching approach is now PRODUCTIONIZED as a
      SHARED helper (customer_name_resolution.two_level_l1_l2_sql_migration) with a
      mechanically-enforced SSO contract (shared_helper_registry.yaml + VBA in
      modFinanceCommon.bas). The engine now runs TWO precision-first levels:
        L1 = exact normalized match (legacy behavior),
        L2 = GP data-migration SQL transforms applied to source THEN normalized.
      This eliminates the bulk of the initial class of rejects (names containing
      "United FC" that the SQL migration had abbreviated to "UTD FC" in the extract).
      The INLINE COLUMN option remains preferred if AR ever delivers a column of
      pre-allocated Customer IDs — but the name-match path is no longer a stub.
    parked_pending_ar:
      - >-
        SUPERSEDED 2026-09-17: AR's "22. GBE - August 26.xlsx" now carries the inline
        Workday Customer ID column anticipated here (col A, "WORKDAY ID"/"Customer ID").
        parties.customer switched to source_code: per_row_direct_passthrough with no
        cascade fallback. The two-level name cascade is left wired in modFinanceCommon.bas
        for other transforms but is no longer called by ar_gbe_invoice.
    interim_behaviour: >
      SUPERSEDED 2026-09-17 - see parties.customer. (Historical: two-level name cascade,
      ambiguous or miss at L1/L2 -> reject.)
    owner: Finance (AR)
    status: superseded_direct_passthrough_live

  - id: gbe_reference_column_removed
    decision: >
      DECIDED 2026-09-17. The AR source file ("22. GBE - August 26.xlsx") no longer has
      separate "Reference" or "Player" columns; both are embedded in col G ("Invoice Line
      Description"), e.g. "Romain Jordan Faivre-FOOT01/22/S-2024-1669" (player name + "-" +
      the old Reference value). Col H ("Invoice line part 2" / "Invoice Line Description 2")
      is a clean 1:1 replacement for the old "Type" column (verified identical value set:
      Extension/Panel/Automatic/ESC (New)). VERIFIED the literal token "-FOOT" marks the
      Player/Reference boundary on ALL 584 data rows across both tabs (435 Mens + 149 Womens,
      100% match, zero rows with more than one "-FOOT" occurrence) - including rows where the
      player's own surname contains a hyphen (e.g. "Pauline Camille Peyraud-Magnin-FOOT01/
      ###/S-2024-0795" still splits correctly because the anchor is the literal substring
      "-FOOT", not "first/last dash"). Implemented as an inline split (InStr + Left$/Mid$) in
      modArGbeInvoiceCustInvoice.bas, PLAYER_REFERENCE_SPLIT_ANCHOR = "-FOOT" - mirrors the
      established pattern already used for ap_travel_places' SupplierID split (per_row_split /
      split_on_first_hyphen in ap_travel_places.yaml; no shared helper for either). A row
      whose col G lacks the "-FOOT" anchor is rejected (never guessed) - see skip_rule. Some
      rows also carry a stray literal "_x000D_" text artifact (a pre-existing AR export
      encoding glitch); CleanMemoToSingleLine now strips it as a text-hygiene fix.
    parked_pending_ar:
      - >-
        Some references contain a literal "###" placeholder instead of a number (e.g.
        "FOOT01/###/S-2024-0795", observed on 3 Mens + 7 Womens rows) - a pre-existing AR
        data-quality gap in the source, passed through verbatim (not fixed here). Confirm
        with AR whether these need correcting at source before upload.
    owner: Finance (AR)
    status: decided_split_on_anchor_token_live
