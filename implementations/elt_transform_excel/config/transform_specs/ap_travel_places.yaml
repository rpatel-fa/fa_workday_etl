# Transform spec - ap_travel_places
#
# Human decision record + authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors. Lives in
# config/transform_specs/ (NOT config/transforms/, which is the build-globbed runnable set).
#
# Operational facts - identity, EIB population type, template/source/output paths, and source
# layout (worksheet, header row, required headers) - live in the build profile
# config/transforms/ap_travel_places.yaml (the build-consumed source of truth). Not restated here.
#
# Source workbook: "FA Invoice listing 210926 to 270926 incl Event pivots.xlsx" (weekly; file name pattern
#   "FA Invoice listing DDMMYY to DDMMYY incl Event pivots.xlsx"; CHANGED 2026-10-01, previously the 010826-090826 week).
# Data sheet = "Travel Places upload vMR" (Finance-prepared supplier-invoice upload; the other
#   ~20 tabs are the agency's aged-debt / sales reporting views and are ignored).
# Header row 1, data rows 2..120 (119 rows in the 21.09-27.09 week; 18 columns A-R on the vMR tab).
#
# This is a FORK of ap_taxi. The vMR tab is 18 columns A-R: the 16-column A-P "Upload Format" shared with
# ap_taxi / ap_stationery, plus "Workday Supplier ID" (C) and "String Reformatted" (R). Three deltas only:
#   Delta 1 (worksheet)    : "Travel Places upload vMR"  (taxi = "Upload Format")
#   Delta 2 (header names) : col E "SL Date" (= InvoiceDate), col F "Date sent" (= ReceivedDate),
#                            col P "Description" (taxi = "Description/BOOKED BY").
#   Delta 3 (STRUCTURAL)   : the accounting/coding string is in col R "String Reformatted"
#                            (e.g. "1099-208102-CM152606-0000") -- the finance-cleaned coding
#                            column that supersedes col J "PONumber" (formulas + hardcoded fixes +
#                            "*XX" booker suffix; not derivable). So every worktag + Reporting Type
#                            keys off col R here. any columns after R are the finance user's OWN derived/test
#                            columns (Cost Centre/Spend Category/worktags) and are NOT read.
#
#   A  Template     (col A: GP template tag = "DINV" on all rows; not mapped)
#   B  SupplierID   (col B: "FA-TRA009" on all rows; split "{Company}-{CreditorID}" -> Company only)
#   C  Workday Supplier ID (col C: Workday Supplier ID e.g. "S-007201" -> EIB U DIRECT; ADDED 2026-10-01)
#   D  InvoiceNumber(col D on the vMR tab, CHANGED 2026-10-01: IV043470, IA701498, CM134541, ... -> EIB K + BG)
#   E  SL Date      (col E: per-row invoice timestamp = InvoiceDate)
#   F  Date sent    (col F: uniform 11/08/2026 = ReceivedDate)
#   G  Currency     (col G: GBP on all rows)
#   H  Tray         (col H: agency tray label e.g. "Hilton"; not mapped)
#   I  Createdby    (col I: e.g. "FA\NVargas"; not mapped)
#   J  PONumber     (col J: LEGACY coding string -- formulas + hardcoded fixes + "*XX" suffix; NO LONGER the key)
#   K  Itemcode     (col K: GP line-type code "VAL"; not mapped)
#   L  Account      (col L: BLANK on every row -- intentionally unused)
#   M  Net          (col M: line net; == Gross this feed since Tax=0)
#   N  Tax          (col N: 0 on every row)
#   O  Gross        (col O: line gross)
#   P  Description  (col P on the vMR tab, CHANGED 2026-10-01: event/booking description e.g. "FA Mens U16 Florence August 2026 EC")
#   Q  Taxcode      (col Q: "PZ" on every row -> rate_0 zero/outside-scope)
#   R  String Reformatted (col R: finance-cleaned coding string -- THE WORKTAG KEY as of 24.08.26)
#
# Derived-field rules (Upload -> EIB mapping):
#
#   Rule 1 - Company (EIB L): split SupplierID (B) on first "-", LEFT segment ("FA").
#            Resolves Workday company ref-id via Runner mapping sheet (entity=company).
#            Fallback "THE FA GROUP - FA". Uniform "FA" this feed; per-row keeps NFCL/WNSL working.
#   Rule 2 - Supplier (EIB U): CHANGED 2026-10-01 -- col C "Workday Supplier ID" DIRECT passthrough
#            (Trim only; no Supplier Spreadsheet lookup). Blank col C -> reject (supplier unresolved).
#            Previously: 2-part precedence on the SupplierID RIGHT segment (bare creditor "TRA009")
#            via the pipe-delimited Reference ID "TRA002-NFC|TRA009" -> S-007201 -- RETIRED.
#   Rule 3 - Invoice Number (EIB K): col D "InvoiceNumber" RAW DIRECT (19/19 distinct this week).
#   Rule 4 - Invoice Date (EIB u): col E "SL Date" per-row, coerced to YYYY-MM-DD at write.
#   Rule 5 - Receipt Date (EIB AG): CHANGED 2026-09-09. LEAVE BLANK (Empty).
#            Do NOT read source "Date sent" col F; do NOT fall back to InvoiceDate when
#            blank. AP confirmed "same for all of them" after Will's hand-edited Aug
#            Ambassador Taxi EIB has 14/14 AG=None. AG is non-mandatory when B
#            Spreadsheet Key multi-line grouping is in effect.
#   Rule 6 - Suppliers Invoice Number (EIB BG): col D "InvoiceNumber" DIRECT (= Rule 3; no separate GP voucher ref).
#   Rule 7 - Cost Code / accounting string (EIB worktags EW/GT/GV..HH): col R "String Reformatted",
#            then VBA-normalize separators (trim; collapse space/dash/dot/underscore runs to single "-").
#            Split on "-": Seg1=Cost Centre, Seg2=Spend Cat, Seg3=Project/CommPartner/Grant,
#            Seg4=Program. Lowest-hierarchy Mapping MASTER lookup (Core vs Prism = Core) per BO.
#            col R is the finance-CLEANED coding string (e.g. "1099-208102-CM152606-0000") -- it has
#            NO "*XX" booker suffix (that noise lives only on the legacy col J "PONumber"). Resolver
#            is segment-tolerant of irregular widths (e.g. Seg2 = 7 digits "1168-2018108-...").
#            any columns after R are the finance user's OWN derived/test worktag columns and are NOT read.
#   Rule 8 - Item Description (EIB EP): col P "Description" DIRECT, UCase(Trim()). (CHANGED 2026-10-01: col P.)
#   Rule 9 - Memo (EIB GQ): CHANGED 2026-10-01 -- mirrors ap_referees_v2: InvoiceNumber (D) + ' ' + raw
#            coding string (String Reformatted). SupplierID no longer in the Memo.
#   Rule 10 - Line Amount (EIB GE unit cost, GF extended): col M Net + col N Tax + col O Gross.
#             If col M blank/zero -> fall back to (Gross - Tax). BOTH GE and GF = net only.
#             CALC_TAX_DUE (FL) leaves Workday to re-derive VAT from the tax triple.
#             AP confirmed 2026-09-09 Unit Cost MUST equal Extended Amount across ALL AP transforms (same Stationery fix).
#   Rule 11 - Tax classification: per-row via col Q "Taxcode". This feed = 100% PZ -> rate_0
#             (Outside of Scope / Zero Rated / Nonrecoverable). P20 branch retained for future —
#             CHANGED 2026-09-09: P20 = GBR_Domestic_Purchase_Of_Goods_And_Services / GBR_Standard /
#             Fully_Recoverable (same Stationery Ambassador Taxi correction: Purchasing domain Purchase
#             ref-IDs, not generic Standard_Rated which is for AR/Customer domain).
#   Rule 12 - Currency (EIB T): col G DIRECT (GBP), fallback GBP.
#   Rule 13 - PO Number (EIB BH): LEFT EMPTY. col R is the accounting coding string (used for
#             worktags per Rule 7); the legacy col J "PONumber" is unclean and NOT a reliable Workday
#             PO reference -- so nothing is written to EIB BH. (Contrast ap_taxi, where col I is a
#             genuine PO ref and IS written.) Future: revert to a clean PONumber once the business
#             can populate it.
#   Rule 14 - Reporting Type (EIB GR): LEFT(Seg2, 1) of the Rule-7 col R code via
#             ResolveReportingTypeCode.
#
# Reuses the standard Supplier Invoice EIB field block (see docs/ADDING_A_TRANSFORM.md);
# house defaults inherited unchanged: I=Y, EK=1, FH=INVOICE/ADJUSTMENT_DATE, FL=CALC_TAX_DUE.

meta:
  key: ap_travel_places
  label: AP Travel Places
  requester: Finance (AP)
  date_confirmed: 2026-08-17
  exemplar_to_fork: ap_taxi
  note: >
    Fork of ap_taxi (taxi 16-column A-P Upload Format, extended to 18 columns A-R on the vMR tab). Sole structural delta: the
    accounting/coding string is in col R "String Reformatted" (finance-cleaned; supersedes col J "PONumber").
    Single Travel Places supplier this feed (FA-TRA009 -> S-007201). Kept as its own profile
    rather than folded into the generic ap_taxi to avoid a PONumber-vs-Account key-column branch
    and a "SL Date"/"Date sent" alias chain polluting the generic taxi config.

shared_helpers:
  supplier_resolution: direct_workday_id_passthrough
  company_resolution: per_row_split_from_supplier_id
  accounting_string_derivation: direct_column_separator_normalized
  worktag_hierarchy_lookup: standard_9pack_lowest_specificity
  row_net_resolution: effective_net_gross_tax_fallback
  row_trailer_detection: text_cols_and_amount_cols_parameterized
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  supplier:
    source_code: per_row_direct_passthrough
    source_column: Workday Supplier ID        # Upload col C, e.g. "S-007201"
    source_column_letter: C
    resolved_via: >
      CHANGED 2026-10-01: Workday Supplier ID read DIRECT from col C (no Supplier Spreadsheet
      lookup). Blank col C -> reject + unresolvedSupplierRows. The previous SupplierID-split
      2-part precedence ("TRA009-FA" then bare "TRA009" against Reference ID "TRA002-NFC|TRA009")
      is RETIRED; col B SupplierID is still read for Company (Rule 1) only.
    reject_if_unresolved: true
  company:
    source_code: per_row_split
    source_column: SupplierID                 # Rule 1 -- same col B, LEFT segment
    split_on_first_hyphen: true
    left_segment: Company
    resolved_via: mapping tab entity=company
    fallback: THE FA GROUP - FA
    note: Rule 1 -- LEFT segment is Company ("FA" on every row this feed).

fields:
  invoice_number:                             # EIB G
    source_column: InvoiceNumber              # Rule 3 = col D DIRECT
    note: >
      19/19 distinct this week (IV043470, IA701498, CM134541, ...). These are real per-invoice
      GP references, globally unique, so no batch-token prefix is needed (unlike CFA/Referees).
  invoice_date:                               # EIB u
    source_column: SL Date                    # Rule 4 = col E
    format: >
      MIXED SOURCE FORMATS within the same workbook — the shared helper
      source_date_normalization.excel_serial_and_dmy_text handles ALL of:
        (a) rows 1..393 = human-readable text stored as Variant/String,
            e.g. "14-Aug-26" (dd-mmm-yy, day+alpha month+2-digit year, with
            hyphen separator; unambiguous across locales);
        (b) rows 394+ = date values entered with a General cell format,
            stored as Variant/Double Excel 1900-system serial numbers,
            e.g. 46223.64707 (= 2026-07-22 ~15:32 BST). The fractional part
            is TIME-OF-DAY precision (0.64707 × 24 h ≈ 15.5 h) that the
            agency's system dump appends to the invoice-creation timestamp.
            BOTH the integer date (46223) AND the time fraction are present;
            the shared helper MUST truncate the fractional part before
            CDate via Fix(serial) — NEVER via CLng/Round, because a time
            >= 12:00 would round up to the next day via banker's rounding.
            General-formatted cells are subtype vbDouble (not vbDate), so
            IsDate() ALONE would miss them; the shared helper's numeric
            serial branch (branch 1) runs BEFORE any delimiter rewrite.
      Coerced to YYYY-MM-DD TEXT at VBA write time, with the target cell
      format forced to "@" (Text) so Excel cannot re-apply a locale-specific
      short-date mask on the consumer machine.
    format_fallbacks_note: >
      A third source form has been observed in production: pure numeric
      TEXT serials in CSV-cut intermediate files (e.g. the agency exports
      to CSV → someone pastes back into the "Travel Places upload vMR" sheet). The shared helper
      branch 1 text-serial scan (0..9 + single decimal separator only,
      range [1, 100000]) catches these without additional per-profile
      work. No transform-specific fallback is needed beyond selecting the
      shared helper.
    shared_helper_ref: source_date_normalization.excel_serial_and_dmy_text
  receipt_date:                               # EIB AG
    function: leave_blank                     # CHANGED 2026-09-09 per AP "same for all of them"
    note: >
      Rule 5 CHANGED 2026-09-09. NO source-col read; NO InvoiceDate fallback. Write Empty.
      Will's Aug Ambassador Taxi reference: 14/14 rows AG blank. Matches Stationery + Taxi.
  suppliers_invoice_number:                   # EIB BG
    source_column: InvoiceNumber              # Rule 6 = col D DIRECT (same source as InvoiceNumber)
  item_description:                           # EIB EP
    source_column: Description                # Rule 8 = col P (CHANGED 2026-10-01)
    post_process: UCase(Trim(value))
  memo:                                       # EIB GQ
    rule: InvoiceNumber + ' ' + CostCodeString   # Rule 9 -- CHANGED 2026-10-01: mirrors ap_referees_v2
    concat_with_space: [InvoiceNumber, CostCodeString]
  line_amount:                                # EIB ED net, EE gross
    source_column_net: Net                    # col M
    source_column_tax: Tax                    # col N (0 this feed)
    source_column_gross: Gross                # col O
    basis: net
    fallback_net_from_gross_minus_tax: true
  currency:
    source_column: Currency                   # Rule 12 = col G (GBP)
    fallback: GBP
  purchase_order_reference:                   # EIB AP
    source_column: null                       # Rule 13 -- LEFT EMPTY (col J is the coding string,
    on_blank: leave_empty                     #   not a Workday PO ref; consumed by worktags only)
  spend_category:                             # EIB DP = Seg2 of the col R "String Reformatted" code via Mapping MASTER
    derivation: per_row_lookup
    key_source_column: String Reformatted               # <-- DELTA vs taxi (taxi = Account col K)
    key_rule: segment 2 (Seg2), lowest-hierarchy match via Mapping MASTER
    # --- SHARED --- standard_9pack_lowest_specificity.shared_lookup_skeleton
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Spend Category
    specificity_standard: classic_lowest_specificity
    on_unresolved: reject_and_report
  cost_centre:                                # EIB EQ = Seg1 of the col R "String Reformatted" code via Mapping MASTER
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: segment 1 (Seg1), lowest-hierarchy match
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Cost Center
    specificity_standard: classic_lowest_specificity
    on_unresolved: reject_and_report
  event:                                      # EIB ER
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: Seg1/Seg3 matched against Events - Custom Org
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Events - Custom Org
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  camp:                                       # EIB ES
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: matched against Camps - Custom Org
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Camps - Custom Org
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  fa_learning:                                # EIB ET
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: matched against FA Learning - Custom Org
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: FA Learning - Custom Org
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  commercial_partner:                         # EIB EU
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: Seg3 matched against Commercial Partners - Custom Worktag
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Commercial Partners - Custom Worktag
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  grant:                                      # EIB EV
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: Seg3 matched against Grant
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Grant
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  program:                                    # EIB EW
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: Seg4 matched against Program - Delivered Org
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Program - Delivered Org
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok
  project:                                    # EIB EX
    derivation: per_row_lookup
    key_source_column: String Reformatted
    key_rule: Seg3 matched against Projects (Opex)
    use_shared_lookup: standard_9pack_lowest_specificity
    worktag_business_object_key: Projects (Opex)
    specificity_standard: classic_lowest_specificity
    on_unresolved: skip_ok

tax:
  driver_column: Taxcode                      # col Q, per-row STRING
  sets:
    - driver_value_match: { when_value_eq: PZ }
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
    - driver_value_match: { when_value_eq: P0 }
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
    - driver_value_match: { when_value_eq: P20 }
      applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable
      note: CHANGED 2026-09-09 — previously GBR_Standard_Rated / GBR_Standard_Rated / Recoverable_Allocate. AP confirmed same Stationery Ambassador Taxi Purchasing-domain ref-IDs for all AP supplier-invoice transforms.
  on_unknown_when_value: reject_and_report
  note: This feed is 100% PZ (Tax=0, Net==Gross on all 19 rows). P0/P20 retained for future batches; P20 values updated 2026-09-09.

skip_rule:
  # reject_when -> row goes to the REJECT FILE (a genuine data error the operator must fix).
  reject_when:
    - InvoiceNumber (col D) blank
    - SupplierID (col B) blank OR does not contain at least one "-"   # split guard
    - String Reformatted (col R) blank                               # no coding -> no worktags
    - SL Date (col E) blank                                           # EIB req'd field
    - Taxcode (col Q) blank                                           # can't classify tax triple
    - cost_centre unresolved
    - spend_category unresolved
    - supplier unresolved (col C "Workday Supplier ID" blank)   # CHANGED 2026-10-01: direct passthrough
  # silent_skip_when -> row is SILENTLY skipped: not written, NOT in the reject file; surfaced
  # only as an informational count so the run stays auditable (avoids false negatives).
  silent_skip_when:
    - fully-empty / trailer row (RowIsEmptyOrTrailer)
    - zero-value line: Net = 0 AND (Gross - Tax) = 0   # nothing to post -> benign, not an error
  # NOTES:
  #  * A NEGATIVE Net (credit note) is NOT zero-value -- it MUST survive and post (open_questions #1).
  #  * zero-value is evaluated AFTER reject_when, so a 0/0/0 row that ALSO has a blank required
  #    field is still rejected (the real error wins).
  #  * config flag: transforms/ap_travel_places.yaml transform_constants.zero_value_line_handling.

unused_source_columns:
  - Template   (col A: GP template tag "DINV")
  - Tray       (col H: agency tray label, e.g. "Hilton")
  - Createdby  (col I: Windows logon, e.g. "FA\NVargas")
  - Itemcode   (col K: GP line-type code "VAL")
  - Account    (col L: BLANK on every row -- coding lives in String Reformatted col R)
  - PONumber   (col J: legacy coding string -- formulas + hardcoded fixes; superseded by col R)
  - "any columns after R (Division Lookup / Seg1-4 / Cost Centre / Reporting Type / Ledger / Account Set / Revenue Category / Spend Category / worktag cols): finance user's OWN derived/test columns -- NOT read; we re-derive from col R via Mapping MASTER"

confirmed_decisions:
  - >-
    [CONFIRMED 2026-08-17 by Finance/user] CREDIT-NOTE ROWS: keep as-is. The 2 credit memos with
    NEGATIVE Net and a "CM" invoice prefix (CM134541 = -588.10, CM134542 = -1764.30) are posted
    on THIS same Supplier Invoice load as negative Extended Amount lines (all 19 rows load).
    skip_rule intentionally does NOT drop negative/zero Net for this transform.
  - >-
    [CONFIRMED 2026-08-17 by Finance/user] Taxcode "PZ" = GBR_Outside_of_Scope / GBR_Zero_Rated /
    Nonrecoverable_Allocate (the taxi/stationery rate_0 branch). This feed is 100% PZ.

open_questions:
  - >-
    [RECONCILE-TIME VERIFY, not blocking] Supplier (EIB U) is now col C "Workday Supplier ID"
    DIRECT (CHANGED 2026-10-01). Confirm at reconcile that col C is populated on every row with a
    valid Workday Supplier ID (expected S-007201 for FA-TRA009).
  - >-
    Worktag segment roles: Seg1=Cost Centre, Seg2=Spend Cat/Reporting-Type-source, Seg3=named
    codes (Commercial Partner / Grant / Project), Seg4=Program -- inherited from ap_taxi. Some
    PONumbers have irregular segment widths (e.g. "1168-2018108-..." Seg2=7 digits); the
    lowest-hierarchy Mapping MASTER match is segment-tolerant, but confirm the expected coding
    shape with Finance if any row rejects on unresolved Cost Centre / Spend Category.

mapping:
  # Standard Supplier Invoice EIB v46.2 columns (sheet = Submit Supplier Invoice):
  #   EIB data starts row 6; clear-range ends col EX.
  #   House defaults applied by runner (constants): f=Y, dd=1, dv=INVOICE/ADJUSTMENT_DATE,
  #   dz=CALC_TAX_DUE.
  "B":  { source: invoice_line_grouping (modInvoiceGrouping.AssignInvoiceLineGroup), rule: "Spreadsheet Key increments per NEW Invoice Number K; shared across a group's rows. Single-line invoices trivially get 1..N (CHANGED 2026-09-14 from per-row sequenceNumber)" }
  "I":  { source: "OUTPUT_SUBMIT constant", value: "Y" }
  "K":  { source: InvoiceNumber, rule: "Rule 3 (col D DIRECT)" }
  "R":  { source: company_resolved_reference_id, rule: "parties.company constant FA via mapping entity=company; fallback = THE FA GROUP - FA (same ResolveMappedCompany('FA') path as single-company batches)" }
  "T":  { source: Currency, rule: "Rule 12 (col G DIRECT; fallback = GBP)" }
  "U":  { source: "Workday Supplier ID", rule: "parties.supplier Rule 2 (CHANGED 2026-10-01: col C DIRECT passthrough, Trim only; no Supplier Spreadsheet lookup; blank -> reject)" }
  "AF":  { source: "SL Date", rule: "Rule 4 (col E, per-row; coerced to YYYY-MM-DD at write)" }
  "AG": { source: receipt_date (fields.receipt_date),
          rule: "Rule 5 (CHANGED 2026-09-09 — LEAVE BLANK / EMPTY per Will's hand-edited Aug EIB:
                 14/14 rows AG=None. Do NOT read from source Date sent; do NOT fall back to InvoiceDate.
                 AP confirmed \"same for all of them\"; matches Stationery + Taxi.)" }
  "BG": { source: InvoiceNumber, rule: "Rule 6 (col D DIRECT; same as K -- no separate GP voucher ref)" }
  # EIB "ap" (PO Number) intentionally NOT written -- Rule 13 (col J is the coding string, not a PO ref).
  # EM Line Order not explicitly written → default blank matches Will's Aug EIB (EM=None all rows;
  #    Workday derives from B Spreadsheet Key group + row position) — CHANGED 2026-09-09 documented.
  "EK": { source: invoice_line_grouping (line order),
          rule: "Row ID = 1..N within the Invoice Number group (mirror of EM). Single-line rows get 1
                 (CHANGED 2026-09-14 from hardcoded 1 -- now the same shared grouping as every transform)" }
  "EM": { source: invoice_line_grouping (line order),
          rule: "Line Order = 1..N within the Invoice Number group (mirror of EK). ADDED 2026-09-14" }
  "EP": { source: Description, rule: Rule 8 (col P; UCase(Trim(...))) }
  "FE": { source: per_row_tax.*.applicability, rule: Rule 11 via Taxcode switch (PZ/P0->GBR_Outside_of_Scope; P20->GBR_Domestic_Purchase_Of_Goods_And_Services — CHANGED 2026-09-09 P20 was Standard_Rated per AP) }
  "FF": { source: per_row_tax.*.code,          rule: Rule 11 via Taxcode switch (PZ/P0->GBR_Zero_Rated; P20->GBR_Standard — CHANGED 2026-09-09 P20 was Standard_Rated per AP) }
  "FH": { source: "HOUSE DEFAULT tax_point_date_type", value: "INVOICE/ADJUSTMENT_DATE" }
  "FK": { source: per_row_tax.*.recoverability, rule: Rule 11 via Taxcode switch (PZ/P0->Nonrecoverable_Allocate; P20->Fully_Recoverable — CHANGED 2026-09-09 P20 was Recoverable_Allocate per AP) }
  "FL": { source: "HOUSE DEFAULT tax_option", value: "CALC_TAX_DUE" }
  "GE": { source: "Net (fallback: Gross - Tax)", rule: Rule 10 — line Unit Cost; net amount only (no VAT). Same as GF — both columns MUST be identical per AP 2026-09-09. Cell NumberFormat = 0.00 (2026-10-01; display only, stored value not rounded). }
