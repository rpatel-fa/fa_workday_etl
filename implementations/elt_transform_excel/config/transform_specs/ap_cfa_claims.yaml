# Transform spec - ap_cfa_claims  (*** CFA CLAIMS ONLY - NOT CFA DISTRIBUTIONS ***)
#
# *** CRITICAL NAME CLARITY:
#     "CFA" is an ambiguous Finance shorthand. Two sibling transforms exist:
#       1. ap_cfa_distributions  <- Separate transform for the monthly FA Grant / EP
#          distributions workbook.  Folders: .../eib/ap/cfa_distributions/.
#       2. ap_cfa_claims         <- THIS transform.  Handles the CFA-Claims workbook.
#          Folders: .../eib/ap/cfa_claims/.  Labels: "CFA Claims".
#     Do not mix these up.  Grep for "cfa_claims" or "cfa_distributions" explicitly.
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors. Operational facts
# (identity, EIB population type, paths, source layout) live in the build profile
# config/transforms/ap_cfa_claims.yaml.
#
# =====================================================================================
# REWORK 2026-09-24 - PRE-RESOLVED SOURCE FORMAT (September 2026 onwards)
# =====================================================================================
# Finance changed the CFA Claims source file.  The previous format carried a single
# "Budget Code" accounting string (col E) that this transform dash-normalised and resolved
# against Mapping MASTER (lowest-hierarchy, Core vs Prism = Core) to derive Cost Centre,
# Spend Category, Reporting Type and the 7 optional worktags.
#
# The NEW file ("1.0 CFA Claims - Finance Approval - September 2026.xlsx", tab
# "1.0 CFA Claims - Finance Approv") has done that mapping IN-SOURCE.  Every coding element
# is now a discrete, pre-resolved column, and the invoice header fields are pre-computed:
#
#   Col A = Sheet Name / Claim Category   (per-row key; informational + memo)
#   B = County FA                         (claimant entity; informational, NOT legal entity)
#   C = County FA GP ID                   (legacy GP creditor code; trace + skip gate only)
#   D = Total Claim (GBP)                 (net line amount -> PurchasesAmount; positive)
#   E = Cost Centre                       *** PRE-RESOLVED Workday Cost Center ref id (mandatory)
#   F = Reporting Type                    *** PRE-RESOLVED reporting type (DISPLAY NAME, e.g.
#                                             "National Game Board (NGB)", "FA Investments" -
#                                             NOT a Mapping MASTER ref id; no WBO exists for it)
#   G = Revenue Category                  (AR concept; EMPTY on Claims; NOT written to Supplier EIB)
#   H = Spend Category                    *** PRE-RESOLVED Workday Spend Category ref id (mandatory)
#   I = Events - Custom Org               *** PRE-RESOLVED Event worktag (optional)
#   J = FA Learning - Custom Org          *** PRE-RESOLVED FA Learning worktag (optional)
#   K = Camps - Custom Org                *** PRE-RESOLVED Camp worktag (optional)
#   L = Program - Delivered Org           *** PRE-RESOLVED Program worktag (optional)
#   M = Grant                             *** PRE-RESOLVED Grant worktag (optional)
#   N = Commercial Partners - Custom Worktag  *** PRE-RESOLVED Commercial Partner worktag (optional)
#   O = Projects (Opex)                   *** PRE-RESOLVED Project worktag (optional)
#   P = Sales item                        (AR concept; EMPTY on Claims; NOT written)
#   Q = Head of Approval                  (informational; memo)
#   R = Processed By                      (informational; memo)
#   S = Processed Date                    (informational / trace; dates now come from AA)
#   T = Payment Run                       ("September"; informational)
#   U = Budget Code Naming                (Finance label; memo)
#   V = Supplier name                     (informational only)
#   W = Workday Supplier ID Lookup        *** AP/Finance-curated S-XXXXXX; DIRECT passthrough
#                                             to EIB Supplier (U).  Verified complete: col W is
#                                             populated for every row and matches the workbook's
#                                             "WD extract" tab (Reference ID D -> Supplier ID E)
#                                             wherever that subset overlaps.  Blank W -> skip+report.
#   Y = Invoice Number                    *** PRE-COMPUTED -> EIB Invoice Number (K) verbatim,
#                                             and BG (Suppliers Invoice Number) mirrors it.
#   Z = Invoice Description               *** PRE-COMPUTED -> EIB Item Description (EP).
#                                             (Source header carries a typo "Invoice Desctiption".)
#   AA = Invoice Date                     *** PRE-COMPUTED -> EIB Invoice Date (AF) + Receipt Date (AG).
#
# WHAT WAS RETIRED (do NOT re-introduce for the pre-resolved format):
#   * Budget Code (E in the old file) accounting string + NormalizeCostCodeSeparators.
#   * Mapping MASTER lowest-hierarchy worktag RESOLUTION
#     (ResolveLowestHierarchyLookupAcrossFinalCodeSegments / BuildBusinessObjectHierarchyLookup).
#   * ResolveReportingTypeFromFinalCode (Reporting Type now read from col F).
#   * batchIdToken derivation (CFAC + MMYY) and the per-group InvoiceNumber counter
#     ({Naming}_{PaymentRun}_{YYYY}_{n}) - Invoice Number is now pre-computed in col Y.
#
# WORKTAG PASS-THROUGH + REPORT (Finance decision 2026-09-24: "pass through + report"):
#   The pre-resolved worktag values (E, F, H, I, J, K, L, M, N, O) are written VERBATIM.  The
#   source is now the single source of truth for coding, so the worktag pipeline is INACTIVE
#   (no worktag_business_objects / derived_worktags in the profile): the .bas does NO Mapping
#   MASTER hierarchy lookup, references no WBO_* constants, and never calls
#   ResolveReportingTypeFromFinalCode.  Mandatory Cost Centre (E) and Spend Category (H) still
#   REJECT the row when the source cell is BLANK (a direct blank gate).
#
#   Existence of each pre-resolved value in Mapping MASTER (WORKDAY REF ID, Core vs Prism =
#   Core) is validated OUT OF BAND (at authoring / reconcile time), NOT at macro runtime.
#   Reporting Type (F) is a display name with no Mapping MASTER business object and is NOT
#   existence-checked.
#
#   Authoring-time validation witness (Mapping MASTER v42 08.09.26 Production, Sep-2026 file):
#     Cost Centre (E), Program (L), Grant (M) - all values present (Core).  Spend Category (H)
#     had 7 rows whose value is NOT in Mapping MASTER:
#       "Programme_Cost_Programme" (x4), "(Programme costs / Professional Fees" / "...)" (x3).
#     Per the "pass through + report" decision these are written verbatim and reported for
#     Finance to correct at source.

meta:
  key: ap_cfa_claims
  label: AP CFA Claims
  requester: Finance (AP)
  date_confirmed: 2026-09-24
  exemplar_to_fork: ap_cfa_distributions
  note: >
    REWORKED 2026-09-24 for the pre-resolved September-2026 source format.  Finance now
    deliver the Budget Code -> Workday hierarchy mapping done in-source: worktags are discrete
    pre-resolved columns (E..O) and Invoice Number / Description / Date are pre-computed
    (Y / Z / AA).  This transform reads them directly (pass-through) and no longer performs
    accounting-string normalisation, Mapping MASTER hierarchy resolution, batch-token
    derivation or the per-group invoice counter.  Supplier = col W "Workday Supplier ID Lookup"
    DIRECT passthrough; Company = constant FA.  Mapping MASTER is loaded only for a read-only
    worktag existence check (pass-through + report).
  open_questions: []

shared_helpers:
  supplier_resolution: direct_workday_id_passthrough
  company_resolution: fixed_literal
  accounting_string_derivation: none          # RETIRED 2026-09-24 - no accounting string in source
  worktag_hierarchy_lookup: none              # RETIRED 2026-09-24 - worktags pre-resolved; mapping used for existence check only
  row_net_resolution: direct_amount
  row_trailer_detection: text_cols_and_amount_cols_parameterized
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  supplier:
    source_code: per_row_direct_passthrough
    source_column: Workday Supplier ID Lookup
    source_column_letter: W
    resolved_via: >
      AP/Finance-curated Workday Supplier Reference (S-XXXXXX) in Claims col W (DIRECT
      PASSTHROUGH - no lookup).  Verified complete: col W is populated on every data row and,
      where the workbook's "WD extract" tab (Reference ID col D -> Supplier ID col E) covers a
      GP ID, col W equals that looked-up value; col W additionally covers GP IDs the WD extract
      subset omits, so it is the authoritative, fully-populated key.  blank W -> skip +
      unresolvedSupplierRows.
    reject_if_unresolved: true
  company:
    source_code: constant
    value: FA
    source_column_present: false
    resolved_via: >
      ResolveMappedCompany("FA") -> THE FA GROUP - FA.  The CFA Claims tab has no explicit
      legal-entity Company column (County FA B = claimant entity, not paying legal entity).

worktags_pre_resolved:
  # Pass-through mapping of pre-resolved source columns -> EIB worktag cells, plus the
  # Mapping MASTER business object each value is EXISTENCE-CHECKED against (Core vs Prism = Core).
  # mandatory = reject row when source cell BLANK.  existence_check = report (not reject) when
  # the non-blank value is not a known ref id for its business object.
  cost_centre:       {source_column: Cost Centre, source_column_letter: E, eib_column: GT, business_object: "Cost Center", mandatory: true,  existence_check: true}
  spend_category:    {source_column: Spend Category, source_column_letter: H, eib_column: EW, business_object: "Spend Category", mandatory: true, existence_check: true}
  reporting_type:    {source_column: Reporting Type, source_column_letter: F, eib_column: GR, business_object: null, mandatory: false, existence_check: false, note: "display name, no Mapping MASTER WBO; passed through verbatim"}
  event:             {source_column: Events - Custom Org, source_column_letter: I, eib_column: GV, business_object: "Events - Custom Org", mandatory: false, existence_check: true}
  fa_learning:       {source_column: FA Learning - Custom Org, source_column_letter: J, eib_column: GZ, business_object: "FA Learning - Custom Org", mandatory: false, existence_check: true}
  camp:              {source_column: Camps - Custom Org, source_column_letter: K, eib_column: GX, business_object: "Camps - Custom Org", mandatory: false, existence_check: true}
  program:           {source_column: Program - Delivered Org, source_column_letter: L, eib_column: HF, business_object: "Program - Delivered Org", mandatory: false, existence_check: true}
  grant:             {source_column: Grant, source_column_letter: M, eib_column: HD, business_object: "Grant", mandatory: false, existence_check: true}
  commercial_partner: {source_column: Commercial Partners - Custom Worktag, source_column_letter: N, eib_column: HB, business_object: "Commercial Partners - Custom Worktag", mandatory: false, existence_check: true}
  project:           {source_column: Projects (Opex), source_column_letter: O, eib_column: HH, business_object: "Projects (Opex)", mandatory: false, existence_check: true, note: "existence checked against both Projects (Opex) and Projects (Capex)"}

derived_fields:
  invoice_number_k:
    function: direct_source_column
    source_column: Invoice Number
    source_column_letter: Y
    note: "EIB Invoice Number (K) = col Y verbatim (pre-computed by Finance, e.g. 182_SEP_CFA_TCCDISABILITY)."
  suppliers_invoice_number_bg:
    function: mirror_invoice_number_value_from_target_column_k
    copy_of_derived_field: invoice_number_k
    cross_column_guarantee: "K == BG for every non-skipped row (same string instance written to both). CFA Workday validates cross-column consistency and rejects diverged pairs."
  item_description_ep:
    function: direct_source_column
    source_column: Invoice Description
    source_column_letter: Z
    note: "Source header carries a typo (Invoice Desctiption); matched via pipe-alias."
  invoice_date_af:
    source_column: Invoice Date
    source_column_letter: AA
    normalize_source_date: true
  receipt_date_ag:
    source_column: Invoice Date
    source_column_letter: AA
    normalize_source_date: true
  memo_gq:
    function: join_pipe_gpid_sheetname_budgetname_processedby
    template: "{colC} | {colA} | {colU} | by {colR}"
    note: "County FA GP ID (C) | Sheet Name (A) | Budget Code Naming (U) | by Processed By (R)."

skip_rule:
  drop_when:
    #  ---- TRAILING ADMIN / SUM ROWS (implicit, FIRST check) ----
    - condition: "ALL FOUR blank: B (County FA) AND E (Cost Centre) AND Q (Head of Approval) AND W (Workday Supplier ID Lookup)"
      disposition: skip_silently_not_counted_as_reject
      rationale: Trailing admin / summary footer rows Finance append below the last claim line
    #  ---- NORMAL DATA INTEGRITY GATES (counted as reject rows + reported) ----
    - col A (Sheet Name / Claim Category) is blank
    - col C (County FA GP ID - retained gate for data integrity - NOT used for resolution) is blank
    - col D (Total Claim GBP / PurchasesAmount) is blank, 0, or negative
    - col S (Processed Date) is blank    # trace/integrity gate (dates written from AA)
    - col U (Budget Code Naming / label) is blank
    - col W (Workday Supplier ID Lookup) is blank
    - col Y (Invoice Number, pre-computed) is blank
    - col AA (Invoice Date, pre-computed) is blank
    - cost_centre (col E) is blank      # mandatory worktag - source is SOT
    - spend_category (col H) is blank   # mandatory worktag - source is SOT
  retain_for_trace_but_no_longer_lookup:
    - col C (County FA GP ID): retained for skip-gate integrity + trace; not used for resolution
  on_drop: reject_row_and_report
  on_trailer_admin_skip: ignore_silently

eib_population:
  population_type: Supplier Invoice
  template_version: v46.2
  template_path_reference: target_eib

mapping:
  # Standard AP Supplier Invoice EIB column mapping (Submit_Supplier_Invoice_v46.2).
  - target: B
    function: invoice_line_grouping
    note: >
      Spreadsheet Key via modInvoiceGrouping.AssignInvoiceLineGroup - increments per NEW Invoice
      Number (K). Col Y is per-row-unique here, so every row is its own group and B is 1,2,3...
  - target: I
    function: fixed_literal_Y
    constant: "Y"
    note: "Submit = Y house default"
  - target: K
    function: direct_source_column
    source_column: Invoice Number
    note: "Invoice Number (EIB K) = col Y verbatim (pre-computed). See derived_fields.invoice_number_k."
  - target: R
    function: mapped_company_constant_fa
    source_column: "(absent; constant 'FA')"
    note: "Company = THE FA GROUP - FA via ResolveMappedCompany(FA) - see parties.company."
  - target: T
    function: fixed_literal_GBP
    note: "Currency = GBP default; CFA Claims source has no currency column (UK domestic only)."
  - target: U
    source_column: Workday Supplier ID Lookup
    note: "Supplier (DIRECT PASSTHROUGH from col W, AP-curated). No Supplier Spreadsheet lookup."
  - target: AF
    source_column: Invoice Date
    normalize_source_date: true
    note: "InvoiceDate = col AA (pre-computed; 01/09/2026 in the Sep file)."
  - target: AG
    source_column: Invoice Date
    normalize_source_date: true
    note: "ReceiptDate = col AA (= InvoiceDate; no separate goods-receipt concept for CFA Claims)."
  - target: BG
    function: mirror_invoice_number_value_from_target_column_k
    copy_of_derived_field: invoice_number_k
    source_columns:
      - "<IDENTICAL-VALUE to target K / Invoice Number on the same row (same string instance written to K and BG)>"
    note: >
      Suppliers Invoice Number = 1:1 mirror of Invoice Number (target K). CFA Workday validates
      cross-column consistency between the two invoice-number fields and rejects diverged pairs.
  - target: EK
    function: invoice_line_grouping
    note: "Row ID = 1..N within the Invoice Number group (mirror of EM); per-row-unique K so this is 1."
  - target: EM
    function: invoice_line_grouping
    note: "Line Order = 1..N within the Invoice Number group (mirror of EK)."
  - target: EP
    function: direct_source_column
    source_column: Invoice Description
    note: "Item Description (EIB EP) = col Z verbatim (pre-computed)."
  - target: EW
    source_column: Spend Category
    worktag: Spend Category
    passthrough: true
    existence_check: true
    note: "PRE-RESOLVED Spend Category ref id (col H) written verbatim; mandatory (blank -> reject); existence-checked + reported."
  - target: FE
    function: tax_always_outside_of_scope
    source_column: "(absent; CFA Claims carry no tax)"
    note: "Tax Applicability = Outside_of_Scope CONSTANT (zero-rated branch)."
  - target: FF
    function: tax_always_zero_rated
    source_column: "(absent)"
    note: "Tax (VAT) Code = Zero_Rated CONSTANT."
  - target: FH
    function: fixed_literal_INVOICE_ADJUSTMENT_DATE
    constant: "INVOICE/ADJUSTMENT_DATE"
    note: "Tax Point Date Type = Invoice/Adjustment Date house default."
  - target: FK
    function: tax_always_nonrecoverable
    source_column: "(absent)"
    note: "Tax Recoverability = Nonrecoverable_Allocate CONSTANT."
  - target: FL
    function: fixed_literal_CALC_TAX_DUE
    constant: "CALC_TAX_DUE"
    note: "Tax Option = Calculate Tax Due house default (harmless on zero-rated lines)."
  - target: GE
    source_column: Total Claim (GBP)
    note: "PurchasesAmount (net line) = col D verbatim. Decimals allowed."
  - target: GF
    source_column: Total Claim (GBP)
    note: "Line Amount = col D verbatim (1:1 with PurchasesAmount on single-line invoices)."
  - target: GQ
    function: join_pipe_gpid_sheetname_budgetname_processedby
    note: 'Memo = "{C GP ID} | {A Sheet Name} | {U Budget Code Naming} | by {R Processed By}".'
  - target: GR
    source_column: Reporting Type
    passthrough: true
    existence_check: false
    note: "PRE-RESOLVED Reporting Type (col F) written verbatim (display name; no Mapping MASTER WBO)."
  - target: GT
    source_column: Cost Centre
    worktag: Cost Centre
    passthrough: true
    existence_check: true
    note: "PRE-RESOLVED Cost Centre ref id (col E) written verbatim; mandatory (blank -> reject); existence-checked + reported."
  - target: GV
    source_column: Events - Custom Org
    worktag: Event
    passthrough: true
    optional: true
    existence_check: true
  - target: GX
    source_column: Camps - Custom Org
    worktag: Camp
    passthrough: true
    optional: true
    existence_check: true
  - target: GZ
    source_column: FA Learning - Custom Org
    worktag: FA Learning
    passthrough: true
    optional: true
    existence_check: true
  - target: HB
    source_column: Commercial Partners - Custom Worktag
    worktag: Commercial Partner
    passthrough: true
    optional: true
    existence_check: true
  - target: HD
    source_column: Grant
    worktag: Grant
    passthrough: true
    optional: true
    existence_check: true
  - target: HF
    source_column: Program - Delivered Org
    worktag: Program
    passthrough: true
    optional: true
    existence_check: true
  - target: HH
    source_column: Projects (Opex)
    worktag: Project
    passthrough: true
    optional: true
    existence_check: true
