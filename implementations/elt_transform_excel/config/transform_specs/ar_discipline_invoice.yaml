# Transform spec - ar_discipline_invoice
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors.
#
# Operational facts — identity, EIB population type, template/source/output paths, and source
# layout (header row, required headers) — live in the build profile
# config/transforms/ar_discipline_invoice.yaml (the build-consumed source of truth). Not restated here.

meta:
  key: ar_discipline_invoice
  label: AR Discipline Invoice
  requester: Finance (AR)
  exemplar_to_fork: ar_invoice

shared_helpers:
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  customer: {source_column: WORKDAY ID, resolved_via: none, note: "Source column B already carries the Workday Customer ID (e.g. C-000190) -- written straight to AJ, no reference-extract lookup."}
  company: {fixed: THE FA GROUP - FA}

notes: >
  Customer Invoice EIB Submit_Customer_Invoice_v46.1 — company FA, Currency GBP fixed
  (source extract has neither column). Customer Invoice Type is Standard.
  ALL target columns remapped
  from the pre-v46 layout; see eib_population_defaults.yaml for the canonical registry.
  Reworked for the new AR source file layout (`3. CFA Discipline Invoicing -Rolling.xlsx`,
  sheet `Rolling`): one row per customer per month, no `Document Number` / invoice-number
  column. EIB Customer Invoice Reference ID (D) is generated as
  cfa_discipline_{WORKDAY ID, hyphen removed}_{invoice date yyyyMMdd}_{Spreadsheet Key};
  Invoice Number (BO), Line Tax Applicability (FA),
  Line Tax Code (FB) and Memo (DB) are left blank. Spreadsheet Key plus line order are grouped by source `WORKDAY ID`, which is
  already unique per row on this sheet. Company (J), Cost Centre (FX), Reporting Type (FY),
  and Revenue Category (EM) are read once from the sheet's first data row (row 2, source
  columns M/N/O/P — populated on row 2 only, blank on every later row) and broadcast to
  every output row.

fields:
  invoice_number:
    default: ""
    note: No source invoice-number column on the new source layout. Invoice Number (BO) is left blank; Customer Invoice Reference ID (D) is generated (see `mapping.d` / `mapping.bo`).
  invoice_date:     {source_column: Date, source_column_letter: A, note: "Source column A (dd.mm.yy text) -- see mapping.br landmine note: column F is also headered 'DATE'."}
  amount_due:       {source_column: NET, basis: net}
  line_amount:      {source_column: NET, basis: net}
  memo:
    default: ""
    note: No source narrative column mapped for Memo on the new source layout. Left blank (see `mapping.db`).
  spreadsheet_key_group_id:
    function: per_source_invoice_number_group_sequential_id
    group_key_source_column: WORKDAY ID
    id_start: 1
    id_assignment_order: source_file_row_order
    note: >
      Spreadsheet Key B is assigned once per distinct `WORKDAY ID` in first-seen row order.
      WORKDAY ID is already unique per row on this sheet, so this is always the N=1 case
      (one line per header).
  line_order_within_group:
    function: per_source_invoice_number_group_1based_reset_counter
    group_key_source_column: WORKDAY ID
    counter_start: 1
    reset_on_new_group: true
    counter_assignment_order: source_file_row_order_within_group
    note: >
      The emitted line-order field is driven from the same grouped `WORKDAY ID` key.

accounting_string:
  driver: none
  note: >
    Discipline fines extract has no accounting-string driver; Revenue Category EM
    and worktags FX..GF are blank. Discipline Standard Customer Invoice Type handles
    any required statutory defaults downstream in Workday.

mapping:
- target: b
  function: invoice_group_spreadsheet_key
  note: >
    Populated by AssignInvoiceLineGroup keyed by source `WORKDAY ID`. The source sheet is
    one row per customer per month with no repeat-invoice case, so every group is the N=1
    case.
- target: c
  default: "Y"
  note: >
    Add Only flag -- fixed "Y" for an insert-only EIB (never update existing), matching
    every other active AR Customer Invoice profile's house default.
- target: d
  derivation: composite_reference_id
  output_format: "cfa_discipline_{WORKDAY ID with hyphens removed}_{yyyyMMdd of br}_{b}"
  example: "cfa_discipline_C000190_20260918_1"
  note: >
    Customer Invoice Reference ID -- per requester instruction (2026-09-28): the fixed
    prefix `cfa_discipline_`, then the source `WORKDAY ID` with its hyphen removed
    (`C-000190` -> `C000190`), then the Invoice Date written to `br` as yyyyMMdd, then the
    Spreadsheet Key written to `b`, each joined by `_`. The hyphen is removed only in D;
    `aj` (Customer) keeps the original WORKDAY ID. Written as text so Excel keeps it as-is.
    Unique within a run because `b` is unique per invoice; a re-run of the same source in
    the same row order yields the same IDs. Previously
    `{WORKDAY ID with hyphens removed}{YYYYMMDD of br}` (e.g. `C00019020250918`), before that
    `{co}-{WORKDAY ID}-{YYYYMMDD}`, then blank.
- target: h
  default: "Y"
- target: i
  default: ""
  optional: true
  note: >
    Locked in Workday -- left blank per requester instruction (2026-09-18). Other active AR
    Customer Invoice profiles set "Y" here (ar_bulk_invoice / ar_integration_invoice /
    ar_multi_line_invoice); ar_gbe_invoice and ar_manual_invoice also leave it blank.
- target: bo
  default: ""
  optional: true
  note: >
    Invoice Number -- left blank on every row per requester instruction (2026-09-28).
    Previously mirrored `d`.
- target: j
  source_column: Company
  note: >
    Source column M ("Company") on the Rolling sheet is populated on the first data row
    (row 2) only; every later row is blank. Read once and broadcast that value to EIB
    Company (J) on every output row (same first-data-row-broadcast idiom used for BO on
    ar_multi_line_invoice).
- target: ai
  default: GBP
- target: aj
  source_column: WORKDAY ID
  note: >
    Source column B already carries the Workday Customer ID (e.g. `C-000190`) -- written
    directly, no Customer Spreadsheet lookup (unlike the pre-rework `Customer Number`
    column, which needed one). Rows with a blank WORKDAY ID are skipped upstream of this
    write (see the .bas RowIsSkippable check).
- target: br
  source_column: Date
  source_column_letter: A
  source_format: dd.mm.yy
  target_format: YYYY-MM-DD
  note: >
    Invoice Date -- source column A ("Date", dd.mm.yy text e.g. `18.09.25` -> `2025-09-18`),
    per requester instruction (2026-09-18). Previously read column F. LANDMINE: the source
    sheet has two columns headered "Date"/"DATE" -- column A (this one) and column F (a
    Date-typed invoice-month cell, now unused). Header lookups are case-insensitive, so the
    `.bas` reads column A positionally (`ColumnIndex("A")`) rather than by header text.
- target: ck
  default: Unpaid
- target: cl
  default: Approved
- target: cm
  source_column: NET
  target_format: "0.00"
  note: Amount Due. Displayed with 2 decimal places (cell number format only -- the stored value is not rounded), per requester instruction (2026-09-18). Same for `fl` and `fo`.
- target: co
  default: Standard
- target: cy
  default: ""
  optional: true
  note: >
    Include Customer Worktags -- left blank per requester instruction (2026-09-18): the
    interaction between CY=Y (customer default-worktag inheritance) and the explicit
    FX/FY/EM values this transform writes per row (broadcast from the source sheet's
    first data row) is not verifiable from this codebase alone; leaving CY blank avoids
    any risk of Workday overriding those explicit values. Matches ar_bulk_invoice /
    ar_gbe_invoice / ar_manual_invoice / ar_multi_line_invoice, none of which set CY
    either.
- target: ds
  function: invoice_group_line_order
  note: >
    Row ID* (line-level) -- Required in the target template. Populated by the same
    AssignInvoiceLineGroup call as target `b`/`dv`; always `1` on this sheet since
    `WORKDAY ID` is unique per row (N=1 case). Same value as `dv`, matching the
    ar_bulk_invoice / ar_gbe_invoice / ar_integration_invoice / ar_manual_invoice /
    ar_multi_line_invoice convention.
- target: dv
  function: invoice_group_line_order
  note: >
    Populated by the same AssignInvoiceLineGroup call as target `b`; always `1` on this
    sheet since `WORKDAY ID` is unique per row (N=1 case).
- target: fa
  default: ""
  optional: true
  note: >
    Line Tax Applicability -- left blank on every row per requester instruction
    (2026-09-28), same as ar_manual_invoice. Was fixed GBR_Standard_Rated (the shared
    `TAX_APPLICABILITY_STANDARD` in modFinanceCommon.bas).
- target: fb
  default: ""
  optional: true
  note: >
    Line Tax Code -- left blank on every row per requester instruction (2026-09-28), same
    as ar_manual_invoice. Was fixed GBR_Standard_Rated (the shared `TAX_CODE_STANDARD` in
    modFinanceCommon.bas).
- target: fp
  mirrors: br
  note: >
    Transaction Date. Source column A ("Date", dd.mm.yy text), same as `br` (Invoice Date),
    per requester instruction (2026-09-18). Implemented as a mirror of `br`, so both columns
    carry the same value and format and always move together; the `.bas` writes one
    normalised date to BR and FP.
- target: em
  source_column: Revenue Category
  note: >
    Source column P ("Revenue Category") on the Rolling sheet is populated on the first
    data row (row 2) only; every later row is blank. Read once and broadcast that value to
    EIB Revenue Category (EM) on every output row (same first-data-row-broadcast idiom used
    for BO on ar_multi_line_invoice).
- target: en
  source_column: DESCRIPTION
  note: Line Item Description. Source column D (e.g. "CFA DISCIPLINE").
- target: fv
  mirrors: en
  note: >
    Line Memo. Mirrors `en` (Line Item Description) -- same value, matching
    ar_gbe_invoice, which writes the same line-description string to both EN and FV.
- target: fh
  source_column: QTY
  note: >
    Quantity. Source column G ("QTY"), value 1 on every row on this sheet. Matches the
    ar_bulk_invoice / ar_integration_invoice / ar_multi_line_invoice convention of reading
    a real source quantity column (discipline has one, unlike ar_manual_invoice which
    fixes FH=1 only because its source has no quantity column at all).
- target: fl
  source_column: NET
  target_format: "0.00"
- target: fo
  source_column: NET
  target_format: "0.00"
- target: fx
  source_column: Cost Centre
  note: >
    Source column N ("Cost Centre") on the Rolling sheet is populated on the first data
    row (row 2) only; every later row is blank. Read once and broadcast that value to EIB
    Cost Centre (FX) on every output row (same first-data-row-broadcast idiom used for BO
    on ar_multi_line_invoice).
- target: fy
  source_column: Reporting Type
  note: >
    Source column O ("Reporting Type") on the Rolling sheet is populated on the first
    data row (row 2) only; every later row is blank. Read once and broadcast that value to
    EIB Reporting Type (FY) on every output row (same first-data-row-broadcast idiom used
    for BO on ar_multi_line_invoice).
- target: db
  default: ""
  optional: true
  note: No source narrative column mapped for Memo on the new source layout. Left blank.
