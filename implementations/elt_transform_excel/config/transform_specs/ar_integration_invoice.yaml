# Transform spec - ar_integration_invoice
#
# Human decision record + the authoritative target-column mapping.
# The mapping: section is the source of truth the .bas module mirrors.
#
# Operational facts live in config/transforms/ar_integration_invoice.yaml.
# Not restated here.

meta:
  key: ar_integration_invoice
  label: AR Integration Invoice
  requester: Finance (AR - NFC Learning Integration tab)
  date_confirmed: 2026-09-03
  exemplar_to_fork: ar_bulk_invoice
  archetype_note: >
    Fork structure from ar_bulk_invoice (one source row = one single-line Customer
    Invoice) but REPLACE the entire account-string / COST CODE / Final Code /
    Mapping-MASTER pipeline with a direct Course-Name to Code lists sheet lookup.
    NO final code derivation. NO Mapping MASTER worktag lookups. NO seg2 Reporting
    Type char-map. Everything comes from the source workbook's "Code lists" secondary tab.

shared_helpers:
  source_date_normalization: excel_serial_and_dmy_text
  invoice_line_grouping: per_invoice_number

parties:
  customer:
    source_column: WORKDAY ID
    resolved_via: none
    note: >
      2026-09-22 amendment (Combined 30-34 workbook): Customer AJ is resolved
      DIRECTLY from the new Integration col C ("WORKDAY ID") - Finance now
      pre-resolves the Workday customer reference per row. This REPLACES the
      previous Customer Spreadsheet extract lookup (Integration col B
      "Customer ID" -> Reference ID -> Customer ID exact match), which was
      producing "CUSTOMER ID not found in customer extract" rejects because
      the extract lookup and this source's Customer ID values no longer line
      up. Customer ID (col B) is still read (skip/grouping/reject-message use
      only) but no longer drives AJ. A blank WORKDAY ID on a source row that
      wasn't already skipped (see skip_rule) = unresolved customer = row
      rejected, same as before, just keyed off a different column.
  company:
    derivation: course_lookup_priority_with_fallback
    primary:
      lookup_file: Source Data
      lookup_sheet: Code lists
      lookup_key: source_column(Course Name) -> 'Code lists'!Course
      return_column: Company
    fallback_value: THE FA GROUP - NFC
    resolved_via: source_lookup_sheet (not mapping tab)
    note: >
      Company comes FIRST from 'Code lists'!C (Company) column matched on Course Name.
      If Code lists row company is blank or the Course lookup fails, fall back to
      uniform company "THE FA GROUP - NFC" (not FA - this is NFC). No mapping-tab
      entity lookup is used for this profile.

notes: >
  AR Integration Invoice - NFC Learning system. As of the 2026-09-22 "Combined
  30-34" source workbook rework, source workbook has TWO relevant tabs:
    (1) "Integration" - the invoice line data. TWO-ROW HEADER: row 1 = field
        names (cols A..M) plus "Required Fields"/"Optional Fields" group labels
        (cols N.. / R..); row 2 = the real sub-headers for the fields grouped
        under those two labels (Ledger, Cost Centre, Reporting Type, Revenue
        Category | Event, FA Learning Course, Camp, Programme, Grant,
        Commercial Partner, Project, Sales Item). DATA STARTS ON ROW 3.
        One source row = one Workday Customer Invoice with a single line.
        Cost Centre (col O), Reporting Type (col P), and Revenue Category
        (col Q) are read DIRECTLY per row from this sheet -> EIB FX / FY / EM.
        Reporting Type drops its leading "<number>: " prefix (see target fy).
    (2) "Code lists" - as of the "Combined 30-34" workbook this is now a plain
        3-column dropdown reference list (Cost Centres / Reporting Type /
        Revenue Category, no Course key column) used for Excel data-validation
        only. It NO LONGER supports the old Course-Name -> full-hierarchy
        lookup this transform originally relied on. The VBA lookup is coded
        to fail soft against a Code lists tab shaped like this (rather than crash).
        Company still attempts this lookup and falls back to company_fallback
        when it (always) misses. FA Learning Course (target gc) is read
        DIRECTLY from Integration col S, same pattern as Cost Centre/
        Reporting Type/Revenue Category. Camp, Event, Commercial Partner,
        Grant, and Programme (targets fz/ga/gb/gd/ge) are, per 2026-09-22
        Finance instruction, no longer read from Code lists at all and are
        intentionally always blank -- not "pending a fix."
  There is NO COST CODE column, NO Final Code 4-6-8-4 segmentation, and NO
  Mapping MASTER lowest-hierarchy lookup.
  An unresolved Course Name (no match in Code lists) writes the Code lists tab-sourced
  worktags as BLANK (AR archetype rule: silent_blank, not row rejection) and
  increments a flag counter shown in the run results. Invoice Number (BO) is
  left blank on every row (DECIDED 2026-09-29). Line Tax Applicability (FA) and
  Line Tax Code (FB) are derived per row from the source Net/VAT ratio (see
  tax_rules) -- restored 2026-10-06 after being left blank from 2026-09-29.
  2026-10-06 amendment: Unit Cost (FL) comes from the source Net column (col I)
  again (reverting the 2026-09-30 switch to Gross), and Quantity (FH) from the
  source Quantity column (col H), capped at 1. Workday adds VAT from the line Tax
  Code (FB). Amount Due (CM) and line Extended Amount (FO) are left blank on
  every row.
  Shared invoice-line grouping is keyed by the derived invoice identifier that
  the build profile computes (not written to any output column). That makes the
  shared helper contract explicit in YAML even though the identifier itself is
  assembled from PO / customer / date fallback logic in
  config/transforms/ar_integration_invoice.yaml.
  Customer Invoice ID (G) is
  integration_{Customer without hyphen}_{Invoice Date YYYYMMDD}_{Spreadsheet Key}
  and Customer Invoice Reference ID (D) is left blank (DECIDED 2026-09-30; see
  mapping targets `d` and `g`).

fields:
  invoice_number:
    derivation: from_build_profile_invoice_identifier
    build_profile_reference: transform_constants.invoice_identifier
    note: >
      Canonical emitted invoice identifier. The build-profile `invoice_identifier`
      block computes the exact value once per non-skipped source row; that string is
      used as the grouping key for the shared invoice-line helper. It is not written
      to any output column: as of 2026-09-30 D and BO are blank and G holds the
      composite integration_... ID (see mapping target `g`).
  spreadsheet_key_group_id:
    function: per_source_invoice_number_group_sequential_id
    group_key_field: invoice_number
    id_start: 1
    id_assignment_order: source_file_row_order
    note: >
      Spreadsheet Key B is assigned once per distinct derived invoice identifier in
      first-seen row order.
  line_row_id_within_group:
    function: per_source_invoice_number_group_1based_reset_counter
    group_key_field: invoice_number
    counter_start: 1
    reset_on_new_group: true
    counter_assignment_order: source_file_row_order_within_group
    note: >
      Target DS is the grouped row id emitted from the shared invoice-line helper.
  line_order_within_group:
    function: per_source_invoice_number_group_1based_reset_counter
    group_key_field: invoice_number
    counter_start: 1
    reset_on_new_group: true
    counter_assignment_order: source_file_row_order_within_group
    note: >
      Target DV is the grouped line order emitted from the shared invoice-line helper.

source_lookup_sheets:
  course_hierarchy:
    sheet_name: Code lists
    workbook: Source Data
    header_row: 1
    data_start_row: 2
    lookup_join:
      from_source_column: Course Name
      to_lookup_column: Course
      match: case_insensitive_exact
      on_unresolved: flag_and_blank_worktags
    semantic_columns:
      # 2026-09-22 (Combined 30-34 workbook): the Code lists tab no longer has a "Course"
      # column, so this lookup can never resolve. Company is the ONLY target still
      # wired to attempt it (fails soft -> company_fallback). Cost Centre / Reporting
      # Type / Revenue Category / FA Learning Course now come DIRECTLY from the
      # Integration sheet's own row 2 (see mapping targets fx/fy/em/gc below). Camp /
      # Event / Commercial Partner / Grant / Programme are intentionally always blank
      # (see mapping targets fz/ga/gb/gd/ge below) - this list below is legacy/kept
      # for history, not a live pipeline for those seven.
      - {source_col: "Company",            eib_role: "company_code_display",   eib_target: "J",  note: "Written to EIB col J (Company*). Fallback = THE FA GROUP - NFC if blank. Still attempted (always misses on Combined 30-34)."}
      - {source_col: "Cost centre",        eib_role: "cost_centre_ref",       eib_target: "FX", note: "SUPERSEDED - FX now reads Integration col O directly (target fx)."}
      - {source_col: "Reporting Type",     eib_role: "reporting_type_ref",    eib_target: "FY", note: "SUPERSEDED - FY now reads Integration col P directly (target fy)."}
      - {source_col: "FA Learning courses",eib_role: "fa_learning_course_ref",eib_target: "GC", note: "SUPERSEDED - GC now reads Integration col S directly (target gc)."}
      - {source_col: "Camp",               eib_role: "camp_ref",              eib_target: "FZ", note: "SUPERSEDED - FZ is intentionally always blank (target fz)."}
      - {source_col: "Commerical Partners",eib_role: "commercial_partner_ref",eib_target: "GB", note: "SUPERSEDED - GB is intentionally always blank (target gb)."}
      - {source_col: "Events",             eib_role: "event_ref",             eib_target: "GA", note: "SUPERSEDED - GA is intentionally always blank (target ga)."}
      - {source_col: "Grant",              eib_role: "grant_ref",             eib_target: "GD", note: "SUPERSEDED - GD is intentionally always blank (target gd)."}
      - {source_col: "Program",            eib_role: "programme_ref",         eib_target: "GE", note: "SUPERSEDED - GE is intentionally always blank (target ge)."}
      - {source_col: "Revenue Cat",        eib_role: "revenue_category_ref",  eib_target: "EM", note: "SUPERSEDED - EM now reads Integration col Q directly (target em)."}
    ignored_columns:
      - "Ledger account"
      - "Spent Cat"
      - "old code"
      - "BP"

worktag_business_objects:
  revenue_category: "Revenue Category"
  cost_centre: "Cost Center"
  event: "Events - Custom Org"
  camp: "Camps - Custom Org"
  fa_learning: "FA Learning - Custom Org"
  commercial_partner: "Commercial Partners - Custom Worktag"
  grant: "Grant"
  program: "Program - Delivered Org"
  project_opex: "Projects (Opex)"
  project_capex: "Projects (Capex)"
  sales_item: "Sales Item"

eib_house_defaults:
  submit_flag: "Y"
  auto_complete: "Y"
  default_currency: GBP
  payment_status: Unpaid
  document_status: Approved
  invoice_type: Standard
  company_fallback: THE FA GROUP - NFC
  mapping_sheet_name: MAPPING MASTER
  note_mapping_sheet_unused: >
    The Mapping MASTER workbook and mapping_sheet_name are registered in the shell
    config for archetype parity ONLY. ar_integration_invoice never opens or reads
    Mapping MASTER at runtime. 2026-09-22: worktag resolution no longer comes from
    the Code lists tab either, except for Company's (always-missing) fallback attempt -
    Cost Centre/Reporting Type/Revenue Category/FA Learning Course are read directly
    off the Integration sheet's own row 2; Camp/Event/Commercial Partner/Grant/
    Programme are intentionally always blank.

course_based_hierarchy:
  driver: Course Name
  lookup: source_lookup_sheets.course_hierarchy
  resolution: direct_verbatim_write_to_eib_columns
  note: >
    NON-CANONICAL. This transform uses a direct Course-Name -> Code lists tab verbatim
    write rather than the canonical account-string -> Final-Code-segment ->
    Mapping-MASTER lowest-hierarchy pipeline. Decision rationale: the source data
    has no cost-code column and Finance have already curated the complete worktag
    assignments per course directly in the source workbook's secondary tab. This
    avoids the cost/error of transcribing the mapping into Mapping MASTER with a
    synthetic old-code for every course.
  business_objects_covered:
    # 2026-09-22 (Combined 30-34 workbook): only Company still goes through this
    # Code lists lookup (and always falls back, since Code lists has no Course column anymore).
    - Company (J) - from 'Code lists'!C + fallback NFC (Code lists lookup always misses; always fallback)
  business_objects_superseded_2026_09_22:
    - Revenue Category (EM) - now read directly from Integration col Q (target em)
    - Cost Centre (FX) - now read directly from Integration col O (target fx)
    - Reporting Type (FY) - now read directly from Integration col P (target fy)
    - FA Learning Course (GC) - now read directly from Integration col S (target gc)
    - Camp (FZ) - intentionally always blank (target fz)
    - Event (GA) - intentionally always blank (target ga)
    - Commercial Partner (GB) - intentionally always blank (target gb)
    - Grant (GD) - intentionally always blank (target gd)
    - Programme (GE) - intentionally always blank (target ge)
  business_objects_not_in_codes_tab:
    - Sales Item (EJ) - left blank (no source column)
    - Project (BN / GF) - left blank (Code lists has no Project column; silent blank rule)
    - Line Tax (FA / FB) - per-row VAT rate triple (separate rule)

tax_rules:
  note: >
    Restored 2026-10-06 (FA/FB were left blank 2026-09-29 to 2026-10-06). The
    Net / Vat / Gross columns are also read for amounts (Net) and the zero-value
    skip rule (Net + Vat + Gross all 0).
  row_level_determination:
    input_columns: ["Net £", "Vat £", "Gross Price £"]
    input_column_aliases:
      "Net £": ["Net PS", "Net"]
      "Vat £": ["VAT £", "VAT PS", "VAT", "Vat PS", "Vat"]
      "Gross Price £": ["Gross Price PS", "Gross Price"]
    alias_note: >
      The primary Integration template uses the literal pound-sign header "Net £".
      Year tabs (21-22 Raised .. 26-27 season) carry the headers "Net" / "Vat" /
      "Gross Price" (no suffix).  The internal "Net PS" name is a legacy semantic
      alias from the AP archetype fork and must NEVER be used as a required header.
      VBA resolves headers with a FindOptionalColumnIndexInRow fallback chain that
      tries (1) primary £-suffix, (2) PS alias for back-compat, (3) bare name for
      year-tab ingestion.
    rule: |-
      effective_net = ResolveAmount(source, Net_col)
      effective_vat = ResolveAmount(source, Vat_col)
      effective_gross = ResolveAmount(source, Gross_Price_col)
      If effective_net > 0 And effective_vat = 0 Then
          tax_triple = ZERO_RATED_SET
      ElseIf effective_net > 0 And Abs((effective_vat / effective_net) - 0.2) < 0.01 Then
          tax_triple = STANDARD_RATED_20PC_SET
      ElseIf effective_net = 0 And effective_gross = 0 Then
          tax_triple = ZERO_RATED_SET
      Else
          tax_triple = STANDARD_RATED_20PC_SET (sane default; flag in run results)
      End If
  standard_rated_20pc:
    applicability: GBR_Domestic_Sale_of_Goods_and_Services
    code: GBR_Standard
    recoverability: Fully_Recoverable
  zero_rated:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Fully_Recoverable

skip_rule:
  drop_when:
    - Customer ID blank on source row (pre-check, before WORKDAY ID lookup). An Excel
      #N/A error value reads as blank, so it is dropped too.
    - >-
      WORKDAY ID blank on a source row that passed the pre-check above =
      unresolved customer = row rejected (2026-09-22: replaces the old
      Customer Spreadsheet extract-lookup rejection)
    - Date blank (invoice date required)
    - Gross Price \u00A3 = 0 and Net \u00A3 = 0 and Vat \u00A3 = 0 (zero-value row)
    - Course Name blank (cannot resolve any worktags; still warn then write blanks per
      archetype, do NOT drop - but count as a flagged row)
  warn_only:
    - >-
      Course Name has no matching row in Code lists tab (flag counter; as of
      2026-09-22 this only affects Company, which falls back to
      company_fallback - all other former Code lists tab worktags are either
      read directly from the Integration sheet or intentionally always blank)
    - Any Code lists tab Company value is blank for a matched Course Name (silent blank, falls back)

mapping:
# --- EIB scaffolding columns ---
- target: b
  function: invoice_group_spreadsheet_key
  note: >
    Populated by AssignInvoiceLineGroup keyed by the derived invoice identifier from
    `transform_constants.invoice_identifier`. Repeated derived identifiers therefore
    share one Spreadsheet Key; a unique identifier is the N=1 case.

- target: c
  default: "Y"
  note: Add Only C = "Y" for insert-only EIB (never update).

- target: h
  default: "Y"
  note: Submit H = "Y" per eib_house_defaults.

- target: i
  note: >
    Locked in Workday I is left BLANK for this profile (2026-09-22 amendment,
    matches ar_discipline_invoice). Do NOT write the eib_house_defaults "Y".

# --- Header identifiers ---
- target: d
  default: ""
  optional: true
  note: >
    Customer Invoice (Customer_Invoice_Reference_ID) -- left blank on every row
    (DECIDED 2026-09-30). In Submit Customer Invoice this column is a lookup of an
    EXISTING Workday invoice (update path); a new ID here fails the load with an
    invalid Customer_Invoice_Reference_ID error. New invoices take their ID from G.
    Previously held the composite integration_... ID (2026-09-29) and before that
    the invoice_identifier (same value as G / BO).

- target: g
  derivation: composite_reference_id
  output_format: "integration_{aj with hyphens removed}_{YYYYMMDD of br}_{b}"
  examples:
    - "integration_C000190_20260918_1"   # C-000190, 2026-09-18, Spreadsheet Key 1
    - "integration_C000190_20260918_2"   # same customer + date, next row, Spreadsheet Key 2
  note: >
    Customer Invoice ID (DECIDED 2026-09-30, moved from D): literal "integration_",
    then the Customer written to `aj` with its hyphen removed (`C-000190` ->
    `C000190`), then the Invoice Date written to `br` as YYYYMMDD, then the
    Spreadsheet Key written to `b`, joined by "_". The hyphen is removed only in G;
    `aj` keeps the original Customer ID. Written as text. This is the ID Workday
    assigns to the new invoice; because Customer Invoice IDs must be unique,
    re-loading the same file is rejected instead of creating duplicates.
    The Spreadsheet Key is assigned first by grouping on the build profile's
    `transform_constants.invoice_identifier` (see fields.invoice_number), then G is
    built. That identifier is no longer written to any output column (not D, G, or
    BO). Build-profile authoring intent for the identifier is unchanged:
      - Canonical implementation pattern = modApCfaClaimsSupplierInvoice Rule 8
        (per-group reset counter using a plain VBA Collection; NO Scripting.Dictionary
        — Mac-safe no-ActiveX rule).
      - Helper stubs required in the module: CollectionKeyExists /
        CollectionSetItemLong / CollectionGetItemLong (mirror the CFA Claims module
        bottom helpers exactly).

- target: bo
  default: ""
  optional: true
  note: >
    Invoice Number -- left blank on every row per requester instruction (2026-09-29).
    Previously held the invoice_identifier (same value as D / G).

# --- Header fields ---
- target: j
  derivation: course_lookup_with_fallback
  lookup:
    file: Source Data
    sheet_name: Code lists
    lookup_input: source_column(Course Name)
    match_column: Course
    return_column: Company
    on_unresolved: use_fallback
  fallback_value: THE FA GROUP - NFC
  note: >
    Company J = 'Code lists'!Company (col C) matched on Course Name. If Code lists row has
    blank Company, or Course Name not in Code lists, fall back to uniform
    "THE FA GROUP - NFC". NOT looked up via mapping tab entity=company because
    the Code lists value is already the Workday company display name/reference.

- target: ai
  default: GBP
  note: Currency AI = GBP uniform per eib_house_defaults.

- target: aj
  source_column: WORKDAY ID
  on_fail: reject_row
  note: >
    Customer AJ = source "WORKDAY ID" (col C), used verbatim. 2026-09-22
    amendment (Combined 30-34 workbook): replaces the previous Customer
    Spreadsheet extract lookup (Customer ID col B -> Reference ID -> Customer
    ID), which was the source of the "CUSTOMER ID not found in customer
    extract" rejects. A blank WORKDAY ID = unresolved customer = row rejected.

- target: ak
  note: >
    Sold To Customer AK is left blank per 2026-09-22 instruction. Workday's
    own EIB template marks AK "Optional" (only Customer AJ is marked
    "Required"/has the asterisk); previously mirrored AJ.

- target: br
  source_column: Date
  source_format: shared_helper:source_date_normalization.excel_serial_and_dmy_text
  target_format: YYYY-MM-DD
  note: >
    Invoice Date BR = source "Date" (col A). Mixed formats expected across year
    tabs (some rows = Excel date serial Variant/Double, some = text like DD/MM/YYYY).
    Use the canonical NormalizeSourceDate helper.

- target: ck
  default: Unpaid
  note: Payment Status CK = Unpaid per house default.

- target: cl
  default: Approved
  note: Document Status CL = Approved per house default.

- target: cm
  default: ""
  optional: true
  note: >
    Amount Due -- left blank on every row per requester instruction (2026-10-06).
    Previously source "Net £" (col I) (Gross 2026-09-30 to 2026-10-06).

- target: co
  default: Standard
  note: Customer Invoice Type CO = Standard per house default.

- target: cq
  source_column: PO Number
  optional: true
  note: >
    Customer PO Number CQ = source "PO Number " (col K, trailing space in header).
    Left blank if the cell is blank.

- target: cy
  default: "Y"
  note: Include Customer Worktags CY = "Y" (inherit Workday customer-level defaults).

- target: db
  derivation: concat_header_memo
  fields:
    - source_column: Organisation Name
    - source_column: Course Name
    - source_column: "Description|Course Code"
  separator: " | "
  note: >
    Header Memo DB = "Organisation Name | Course Name | Description" (2026-09-22:
    source header renamed Course Code -> Description on the "Combined 30-34"
    workbook; alias kept for older year-tab files that still say Course Code).
    Gives Finance a searchable per-invoice narrative in Workday.

# --- Line scaffolding ---
- target: ds
  function: invoice_group_line_order
  note: >
    Populated by the same AssignInvoiceLineGroup call as target `b`, so repeated
    derived invoice identifiers write a 1..N row id within the grouped invoice.

- target: du
  note: >
    Customer Invoice Line Reference ID DU is left blank per 2026-09-22
    instruction. Previously derived as `LINE-{spreadsheet_key}-{line_order}`.

- target: dv
  function: invoice_group_line_order
  note: >
    Populated by the same AssignInvoiceLineGroup call as target `b`, so repeated
    derived invoice identifiers write a 1..N line order within the grouped invoice.

# --- Line fields ---
- target: em
  source_column: Revenue Category
  optional: true
  note: >
    Revenue Category EM = Integration col Q ("Revenue Category", the row-2
    sub-header under the "Required Fields" group). 2026-09-22 amendment
    (Combined 30-34 workbook): read DIRECTLY per row, no longer looked up
    via the Code lists tab (that tab no longer carries a Course-keyed hierarchy;
    see transform-level note).

- target: en
  derivation: concat_line_description
  fields:
    - source_column: Course Name
    - source_column: "Description|Course Code"
  separator: " - "
  note: >
    Line Item Description EN = Course Name + " - " + Description (2026-09-22:
    source header renamed Course Code -> Description; alias kept for older
    year-tab files).

- target: fa
  derivation: per_row_tax_applicability
  rule: tax_rules.row_level_determination -> standard_rated_20pc.applicability or zero_rated.applicability
  note: >
    Tax Applicability FA = per-row based on source Net/VAT ratio. 20% rows ->
    GBR_Domestic_Sale_of_Goods_and_Services; 0% rows -> GBR_Outside_of_Scope.
    Restored 2026-10-06 (left blank 2026-09-29 to 2026-10-06).

- target: fb
  derivation: per_row_tax_code
  rule: tax_rules.row_level_determination -> standard_rated_20pc.code or zero_rated.code
  note: >
    Tax Code FB = per-row based on source Net/VAT ratio. 20% rows -> GBR_Standard;
    0% rows -> GBR_Zero_Rated. Restored 2026-10-06 (left blank 2026-09-29 to
    2026-10-06).

- target: fh
  source_column: Quantity
  note: >
    Quantity FH = source "Quantity" (col H) (confirmed 2026-09-30; earlier note
    said col G, which is Course Date). Capped at 1 per requester instruction
    (2026-09-30): a source Quantity above 1 is written as 1, because Unit Cost FL
    carries the full row Net (not divided by Quantity) and FH x FL must equal the
    row total. Blank, text (e.g. "Bespoke") or <= 0 defaults to 1.

- target: fi
  note: Unit of Measure FI is left blank per 2026-09-22 instruction (previously defaulted to "Each").

- target: fl
  source_column: "Net £"
  source_column_aliases: ["Net PS", "Net"]
  number_format: "0.00"
  note: >
    Unit Cost FL = source "Net £" (col I), restored 2026-10-06 together with the
    line tax (FA/FB; Gross 2026-09-30 to 2026-10-06). The full row amount, NOT
    divided by Quantity; Quantity (FH) is capped at 1 (see target `fh`) so
    FH x FL = the row Net. Year-tab variants use header "Net" (no £); resolved via
    FindOptionalColumnIndexInRow fallback. Cell NumberFormat = "0.00" (display
    only, stored value stays unrounded).

- target: fo
  default: ""
  optional: true
  note: >
    Extended Amount -- left blank on every row per requester instruction
    (2026-10-06). Previously source "Net £" (col I) (Gross 2026-09-30 to
    2026-10-06).

- target: fp
  derivation: mirror_br
  source_target: br
  note: >
    Transaction Date FP mirrors Invoice Date BR (both = source "Date", col A).
    2026-09-22 correction (Combined 30-34 workbook): previously mapped from
    "Order Date"/"Course Date" (col G); Finance clarified FP should mirror the
    header Date instead, matching the ar_discipline_invoice BR/FP convention.

- target: fv
  source_column: "Email Address- can these be copied in|Email Address"
  optional: true
  note: >
    Line Memo FV = source "Email Address" column (col M on the "Combined 30-34"
