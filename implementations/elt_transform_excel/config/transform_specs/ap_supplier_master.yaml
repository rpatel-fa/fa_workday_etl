- target: HV
  eib_field: "Branch ID"
  source: "Branch ID"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: HX
  eib_field: "Bank Account Number"
  source: "Bank Account Number"
  rule: "as typed (text, keeps leading zeros); required"
  written_on: row 1
- target: HY
  eib_field: "Check Digit"
  source: "Check Digit"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: HZ
  eib_field: "Bank Account Name"
  source: "Bank Account Name"
  rule: "as typed; required"
  written_on: row 1
- target: IA
  eib_field: "Roll Number"
  source: "Roll Number"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: IB
  eib_field: "IBAN"
  source: "IBAN"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: IC
  eib_field: "SWIFT Bank Identification Code"
  source: "SWIFT/BIC"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: MH
  eib_field: "Status Data+ Row ID*"
