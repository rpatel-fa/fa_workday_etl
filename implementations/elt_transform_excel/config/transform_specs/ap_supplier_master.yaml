- target: MQ
  eib_field: "Use Supplier Reference as Default Supplier Payment Memo"
  source: "Use Supplier Reference as Default Supplier Payment Memo"
  rule: "Yes -> Y, No -> N; blank -> not written; anything else -> reject"
  written_on: row 1
- target: MT
  eib_field: "Currency"
  source: "Default Currency"
  rule: "as typed; ref_supplier_currency default_allowed must be Yes; blank -> reject. Accepted Currencies is not written"
  written_on: row 1
