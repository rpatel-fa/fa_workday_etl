# Transform spec - ap_supplier_master
#
# Human decision record + the authoritative target-column mapping (see docs/ADDING_A_TRANSFORM.md).
# The mapping: section is the source of truth the .bas module mirrors (modApSupplierMaster).
# Operational facts (paths, source layout, required headers, column-letter map) live in the build
# profile config/transforms/ap_supplier_master.yaml. Sibling of ar_customer_master (read that first).
#
# Status: code-complete, pending manual Excel import + verify (not run in Excel yet).

meta:
  key: ap_supplier_master
  label: AP Supplier Master
  requester: Finance (AP)
  source_template: config/ingest_specs/ap_supplier.yaml
  target_eib: Master Suppliers.xlsx, sheet "Submit Supplier", data from row 6

shared_helpers:
  entity_row_block: item_index_block

decisions:
  - id: single_value_per_area_address_lines_spill
    date: 2026-10-12
    by: Operator
    quote: >-
      "only address - i thought we said we only support 1 address 1 email 1 phone number 1 bank
      account details and you have stated that for addresses - it means spilling to multiple lines
      since an address is multipe address lines"
    rule: >
      One address, one email, one phone, one bank account, one supplier group (the automatic
      band), one payment type. The EIB output is ONE row per supplier EXCEPT the address lines:
      each non-blank Address Line 1/2/3 goes on its own EIB row, as in the 3+ Master Suppliers
      sample rows 6-7. Row k carries B (same Spreadsheet Key), DD (address Row ID = 1, repeated),
      DM (= k), DO (ADDRESS_LINE_k) and DP (the line text). Numbering is contiguous (blank lines
      skipped, same as ar_customer_master; the sample gives no evidence for a gap). Every other
      field is written on row 1 only. Written through modEntityBlockWriter.
    supersedes: the earlier flat_row_no_nested_multivalue / numbered-slot / ';'-list wording of
      config/ingest_specs/ap_supplier.yaml and the sample's multi-row Use For
      (SHIPPING / REMIT / PROCUREMENT), extra group and extra payment type rows.
    consequence: >
      The 3+ sample's rows 8-9 and 12-13 and the SHIPPING / REMIT / PROCUREMENT Use For values are
      NOT reproduced. Use For is BILLING on the address, phone and email. If no address line is
      typed the supplier is rejected ("Missing required field: Address Line 1"): the writer writes
      nothing for an empty block, so the transform must not drop the supplier silently.
  - id: ids_typed_by_ap
    date: 2026-10-12
    by: Operator
    quote: >-
      "we wont entertain auto generating the workday id for the custoer/suplier - they have to
      present them"
    rule: >
      Supplier ID (H) is required and typed by AP; Reference ID (I) is copied as typed. Nothing is
      generated. A missing Supplier ID rejects the supplier.
  - id: single_valued_choices
    date: 2026-10-12
    by: Operator
    rule: >
      Use For = BILLING on address (EJ), phone (FK) and email (FZ); Type* BUSINESS; Public and
      Primary Y; every Row ID 1. Supplier Group (AV) = the automatic alphabetical band only
      (ref_supplier_group auto_band reference_id); Additional Supplier Group removed from the
      template. Payment Types Accepted+ (CT) = the Default Payment Type's reference_id, single
      value; Additional Payment Type Accepted 1/2 removed. One email (no ';' list), one phone
      (Phone 2/3 removed; Phone 1 -> Phone, Phone 1 Device Type -> Phone Device Type), one
      settlement account.
  - id: supplier_status_case
    date: 2026-10-12
    by: Operator
    rule: >
      The 3+ sample writes Status* = ACTIVE while ref_supplier_status.reference_id (tenant range) is
      "Active". The 3+ sample is the authority for the output ("we have to support what 3+ have
      done"), so MI is the resolved reference_id in UPPER CASE (Active -> ACTIVE; an unknown status
      rejects). Only ACTIVE is evidenced; Hold / Inactive become HOLD / INACTIVE, unverified.
    consequence: >
      The ACTIVE vs Active discrepancy is NOT resolved: first Workday upload must confirm which
      form the tenant accepts (docs/TODO.md).
  - id: tax_id_group
    date: 2026-10-12
    by: Operator
    rule: >
      Tax ID group populated when a Tax ID is typed. Tax ID Type* (AD) takes the tenant Tax_ID_Type
      reference ID from config/ingest_lookups/ref_supplier_country_tax_id_type.json (key
      '<ISO2>|<type>', tenant CountryTaxTable). The 4 TIN fallback rows (AX, BL, MF, PM) have no
      tenant reference ID: a blank reference_id rejects the supplier (no fallback). When no Tax ID
      is typed the group stays empty and the supplier is NOT rejected. AE and AF are fixed Y
      constants.
  - id: not_written
    date: 2026-10-12
    by: Operator
    rule: >
      Not loaded (documented, as in ar_customer_master): Accepted Currencies (no Master target is
      evidenced; MT carries only the Default Currency), and the Address Public / Address Primary /
      Phone Public / Email Public / Email Use For input columns (constants are used instead).
      These columns stay on the input template (as ar_customer does) but their values are ignored.
      Primary Tax ID / Transaction Tax ID input columns are likewise ignored (AE/AF fixed Y).
      Phone ID (FO) is not written: the sample leaves it blank.
  - id: bank_account_required
    date: 2026-10-12
    by: Implementation (follows the input template)
    rule: >
      The template marks Bank Country Code, Bank Currency, Bank Account Type, Bank Name, Bank
      Account Name and Bank Account Number required, so the transform requires them: a supplier
      missing any is rejected. Sort Code, IBAN, SWIFT, Roll Number, Check Digit and Branch ID are
      optional and written as text when typed.
  - id: no_fallbacks
    date: 2026-10-12
    by: Operator
    rule: >
      A missing required value or a missing Workday reference ID rejects the WHOLE supplier: one
      AppendRejectRow, nothing written for it.
  - id: v1_hand_off
    date: 2026-10-12
    by: Operator
    rule: >
      v1 to get this out; another developer refines later with AR/AP. Keep simple, document clearly
      (docs/RUNBOOK.md, docs/TODO.md).

assumptions:
  - Spreadsheet Key is 1..N over the processed suppliers of the run; every Row ID is 1 except DM = k.
  - Address ID is <Supplier ID>_MAIN_1; email ID <Supplier ID>_EM1_1.
  - The phone code is stored as +44 in ref_country and written without the '+'.
  - Bank country and currency are written as typed (ISO2 / ISO 4217 code), as in the 3+ sample.

# Columns the transform does NOT write through ColumnIndex("XX") literals are kept OUT of the
# mapping: block (the spec<->code gate in build_runner.py compares mapping: targets with the .bas
# ColumnIndex literals). B, DM, DO and DP are written by modEntityBlockWriter (letters passed as
# strings; pinned in config/transforms/ap_supplier_master.yaml supplier_master_eib_columns).
writer_columns:
- column: B
  eib_field: "Spreadsheet Key*"
  source: "writer (EntityBlockFlush)"
  rule: "1..N across the run (rowsProcessed); same key on every block row of the supplier"
  written_on: every block row
- column: DM
  eib_field: "Address Line Data Row ID*"
  source: "writer item"
  rule: "k = 1.. contiguous over the NON-BLANK Address Line 1/2/3"
  written_on: every address row
- column: DO
  eib_field: "Address line Type"
  source: "writer item"
  rule: "ADDRESS_LINE_k"
  written_on: every address row
- column: DP
  eib_field: "Address Line Data"
  source: "writer item"
  rule: "the line text (Address Line 1/2/3), blank lines skipped"
  written_on: every address row

mapping:
- target: C
  eib_field: "Add Only"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: H
  eib_field: "Supplier ID"
  source: "Supplier ID"
  rule: "as typed (text); required, never generated"
  written_on: row 1
- target: I
  eib_field: "Supplier Reference ID"
  source: "Reference ID"
  rule: "as typed (text); blank allowed"
  written_on: row 1
- target: K
  eib_field: "Supplier Name"
  source: "Supplier Name"
  rule: "as typed"
  written_on: row 1
- target: Q
  eib_field: "Approval Status"
  source: "constant"
  rule: "APPROVED"
  written_on: row 1
- target: R
  eib_field: "Submit"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: AA
  eib_field: "Tax ID Data+ Row ID**"
  source: "Tax ID"
  rule: "1 only when a Tax ID is typed; group left empty (no reject) when no Tax ID is typed"
  written_on: row 1
- target: AC
  eib_field: "Tax ID Text"
  source: "Tax ID"
  rule: "as typed (text)"
  written_on: row 1
- target: AD
  eib_field: "Tax ID Type*"
  source: "Tax ID Type + Tax ID Country Code"
  rule: "ref_supplier_country_tax_id_type.reference_id keyed '<ISO2>|<type>'; blank/missing -> reject (only when a Tax ID is typed)"
  written_on: row 1
- target: AE
  eib_field: "Transaction Tax ID"
  source: "constant"
  rule: "Y (as ar_customer_master; not user input)"
  written_on: row 1 when Tax ID typed
- target: AF
  eib_field: "Primary Tax ID"
  source: "constant"
  rule: "Y (as AE)"
  written_on: row 1 when Tax ID typed
- target: AP
  eib_field: "Tax Status Data+ Row ID**"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: AR
  eib_field: "Tax Status Country*"
  source: "Tax Status Country Code"
  rule: "as typed ISO2 (must exist in ref_country)"
  written_on: row 1
- target: AS
  eib_field: "Transaction Tax Status"
  source: "Transaction Tax Status"
  rule: "ref_supplier_transaction_tax_status.reference_id; blank -> reject"
  written_on: row 1
- target: AU
  eib_field: "Supplier Category"
  source: "Supplier Category"
  rule: "ref_supplier_category.reference_id; blank -> reject"
  written_on: row 1
- target: AV
  eib_field: "Supplier Group+"
  source: "Supplier Name (first char)"
  rule: "automatic band from ref_supplier_group (assignment auto_band, is_fallback row otherwise); the only group"
  written_on: row 1
- target: BW
  eib_field: "Purchase Order Issue Option"
  source: "Purchase Order Issue Option"
  rule: "ref_po_issue_option.reference_id; optional, but a typed value with no reference_id -> reject"
  written_on: row 1
- target: BZ
  eib_field: "Default PO Issue Email Row ID**"
  source: "constant"
  rule: "1, only when Email typed"
  written_on: row 1
- target: CC
  eib_field: "Default PO Issue Email Address"
  source: "Email Address"
  rule: "= the one email (as typed)"
  written_on: row 1
- target: CR
  eib_field: "Payment Terms"
  source: "Payment Terms"
  rule: "ref_payment_term.reference_id; blank -> reject"
  written_on: row 1
- target: CT
  eib_field: "Payment Types Accepted+"
  source: "Default Payment Type"
  rule: "ref_payment_type.reference_id of the Default Payment Type, single value (the Additional Payment Type Accepted columns are removed)"
  written_on: row 1
- target: CU
  eib_field: "Default Payment Type"
  source: "Default Payment Type"
  rule: "ref_payment_type.reference_id; blank -> reject"
  written_on: row 1
- target: CZ
  eib_field: "Business Entity Name"
  source: "Supplier Name"
  rule: "= Supplier Name"
  written_on: row 1
- target: DD
  eib_field: "Address Data+ Row ID*"
  source: "constant"
  rule: "1; written by the transform on row 1 and repeated by the writer (EntityBlockAddAncestor) on every address-line row k>1"
  written_on: every address row
- target: DF
  eib_field: "Address Format Type"
  source: "constant"
  rule: "BASIC"
  written_on: row 1
- target: DJ
  eib_field: "Address Effective Date"
  source: "constant"
  rule: "1900-01-01 (written as text)"
  written_on: row 1
- target: DK
  eib_field: "Address Country"
  source: "Address Country Code"
  rule: "as typed ISO2"
  written_on: row 1
- target: DQ
  eib_field: "Municipality"
  source: "City"
  rule: "as typed (required)"
  written_on: row 1
- target: DS
  eib_field: "ISO 3166 1 Alpha 2 Code"
  source: "Address Country Code"
  rule: "as typed ISO2"
  written_on: row 1
- target: DX
  eib_field: "Country Region"
  source: "Region"
  rule: "ref_country_region.reference_id keyed '<ISO2>|<region>'; only when Region typed; blank id -> reject"
  written_on: row 1
- target: DY
  eib_field: "Country Region Descriptor"
  source: "Region"
  rule: "as typed"
  written_on: row 1
- target: ED
  eib_field: "Postal Code"
  source: "Postcode"
  rule: "as typed (text)"
  written_on: row 1
- target: EE
  eib_field: "Address Usage Row ID*"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: EF
  eib_field: "Address Public"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: EG
  eib_field: "Address Type Row ID**"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: EH
  eib_field: "Address Primary"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: EI
  eib_field: "Address Type*"
  source: "constant"
  rule: "BUSINESS"
  written_on: row 1
- target: EJ
  eib_field: "Address Use For+"
  source: "constant"
  rule: "BILLING only (SHIPPING / REMIT rows of the 3+ sample are dropped by the one-address rule)"
  written_on: row 1
- target: EP
  eib_field: "Address ID"
  source: "Supplier ID"
  rule: "<Supplier ID>_MAIN_1"
  written_on: row 1
- target: EQ
  eib_field: "Phone Data+ Row ID*"
  source: "constant"
  rule: "1, only when Phone typed"
  written_on: row 1
- target: FA
  eib_field: "Phone Country ISO Code"
  source: "Phone Country Code"
  rule: "ref_country.iso3; blank -> reject"
  written_on: row 1
- target: FB
  eib_field: "International Phone Code"
  source: "Phone Country Code"
  rule: "ref_country.phone_code with '+' removed"
  written_on: row 1
- target: FC
  eib_field: "Phone Number"
  source: "Phone"
  rule: "as typed (text)"
  written_on: row 1
- target: FE
  eib_field: "Phone Device Type"
  source: "Phone Device Type"
  rule: "ref_phone_device.reference_id (Landline/Mobile); blank -> reject, no label fallback"
  written_on: row 1
- target: FF
  eib_field: "Phone Usage Row ID*"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: FG
  eib_field: "Phone Public"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: FH
  eib_field: "Phone Type Row ID**"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: FI
  eib_field: "Phone Primary"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: FJ
  eib_field: "Phone Type*"
  source: "constant"
  rule: "BUSINESS"
  written_on: row 1
- target: FK
  eib_field: "Phone Use For+"
  source: "constant"
  rule: "BILLING only"
  written_on: row 1
- target: FP
  eib_field: "Email Data+ Row ID*"
  source: "constant"
  rule: "1, only when Email typed"
  written_on: row 1
- target: FS
  eib_field: "Email Address"
  source: "Email Address"
  rule: "as typed; a ';' (more than one address) -> reject"
  written_on: row 1
- target: FU
  eib_field: "Email Usage Row ID*"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: FV
  eib_field: "Email Public"
  source: "constant"
  rule: "Y (the Email Public input column is not loaded)"
  written_on: row 1
- target: FW
  eib_field: "Email Type Row ID**"
  source: "constant"
  rule: "1"
  written_on: row 1
- target: FX
  eib_field: "Email Primary"
  source: "constant"
  rule: "Y"
  written_on: row 1
- target: FY
  eib_field: "Email Type*"
  source: "constant"
  rule: "BUSINESS"
  written_on: row 1
- target: FZ
  eib_field: "Email Use For+"
  source: "constant"
  rule: "BILLING only (the Email Use For input column is not loaded; the sample's SHIPPING value is not reproduced)"
  written_on: row 1
- target: GD
  eib_field: "Email ID"
  source: "Supplier ID"
  rule: "<Supplier ID>_EM1_1"
  written_on: row 1
- target: HM
  eib_field: "Settlement Account Data+ Row ID**"
  source: "constant"
  rule: "1"
