version: 1

transform:
  key: ar_discipline_invoice
  label: AR Discipline Invoice
  source_type: AR Discipline Invoice
  eib_population_type: Customer Invoice
  description: >
    Discipline (fines/payments) invoice extracts transformed into the same Workday
    Customer Invoice EIB workbook used by AR Invoice. Company and Currency are fixed
    (FA / GBP) since the source extract has neither column. Currency is a fixed default;
    Company, Cost Centre, Reporting Type, and Revenue Category are read once from the
    source sheet's first data row and broadcast to every output row (see
    config/transform_specs/ar_discipline_invoice.yaml notes:). The field mapping in
    vba_src/transforms/modArDisciplineCustInvoice.bas mirrors the mapping: section in
    config/transform_specs/ar_discipline_invoice.yaml, the same pattern AR Invoice uses.

runtime:
  step_list_macro: RunArDisciplineInvoiceCustomerInvoice

source_layout:
  worksheet_resolution: named
  worksheet_name: Rolling
  header_row: 1
  data_start_row: 2
  header_detection: literal_row
  required_headers:
    - WORKDAY ID
    - Date
    - NET
    - DESCRIPTION
    - QTY
    - Company
    - Cost Centre
    - Reporting Type
    - Revenue Category

transform_constants:
  fixed_company_code: FA
  fixed_currency: GBP
  fixed_invoice_type: Standard
  # EIB column D (Customer Invoice Reference ID) = WORKDAY ID with hyphens removed +
  # invoice date YYYYMMDD, no separator (e.g. C-000190, 18.09.25 -> C00019020250918).
  # BO (Invoice Number), FA (Line Tax Applicability) and FB (Line Tax Code) are left
  # blank on every row -- no tax block (uniform_tax / per_row_tax) is declared here.
  # See mapping.d/.bo/.fa/.fb in the spec.
  company_fallback: THE FA GROUP - FA
  # No COST CODE or accounting-string driver in the discipline extract, and no
  # Mapping-Master hierarchy lookup is used -- Revenue Category / Cost Centre /
  # Reporting Type are read directly from the source sheet's first-data-row
  # broadcast columns (M/N/O/P) instead (see mapping.j/.fx/.fy/.em in the spec).
  # worktag_business_objects / derived_worktags are deliberately NOT declared
  # here: declaring either activates build_runner.py's account-string mapping
  # pipeline validation, which does not apply to this transform.
  unmapped_handling: silent_blank
  mapping_sheet: MAPPING MASTER
  customer_invoice_eib_columns:
    revenue_category: EM
    billable_project_header: BN
    billable_project_line: BN
    sales_item: EJ
    worktags_plus_order:
      sales_item: EJ
      cost_centre: FX
      reporting_type: FY
      camp: FZ
      event: GA
      commercial_partner: GB
      fa_learning: GC
      grant: GD
      program: GE

shell_defaults:
  source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/discipline/source/3. CFA Discipline Invoicing -Rolling.xlsx
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/FA Submit Customer Invoice.xlsx
  output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/discipline/target/FA_Submit_Customer_Invoice_ar_discipline_invoice_output.xlsx
  # source_layout defaults — override here to change which sheet/rows the transform uses at build time
  source_worksheet_resolution: named
  source_worksheet_name: Rolling
  source_header_row: 1
  source_data_start_row: 2
  # customer_spreadsheet / supplier_spreadsheet / mapping_spreadsheet / mapping_sheet are
  # inherited from config/reference_paths.yaml. Override here only if this transform must use
  # a different reference file.
