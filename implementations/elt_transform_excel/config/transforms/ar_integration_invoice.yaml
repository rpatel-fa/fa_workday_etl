version: 1

transform:
  key: ar_integration_invoice
  label: AR Integration Invoice
  source_type: AR Integration Invoice
  eib_population_type: Customer Invoice
  start_row: 6
  description: >
    National Football Centre (NFC) Learning Integration tab invoices transformed into
    the Workday Customer Invoice EIB workbook v46.1. One source row = one single-line
    Workday Customer Invoice (mirrors ar_bulk_invoice archetype).
    2026-09-22 (Combined 30-34 workbook) REWORK: the Integration tab now carries a
    two-row header (row 1 = field names / "Required Fields" / "Optional Fields"
    group labels; row 2 = the actual sub-headers under those two groups), and data
    starts on ROW 3, not row 2. Revenue Category (Integration col Q), Cost Centre
    (col O), and Reporting Type (col P) are now read DIRECTLY per row from that
    group (no lookup) and written to EIB EM / FX / FY respectively. Customer
    AJ is now read DIRECTLY from the new Integration col C ("WORKDAY ID"),
    replacing the old Customer ID (col B) -> Customer Spreadsheet extract
    lookup, which was rejecting rows with "CUSTOMER ID not found in customer
    extract" once the source's Customer ID values stopped lining up with the
    extract.
    Company still goes through the legacy Course-Name -> "Codes" tab hierarchy
    lookup, which the Combined 30-34 workbook's Codes tab NO LONGER SUPPORTS
    (it's now a plain 3-column dropdown reference list with no "Course" key
    column) -- that lookup is coded to fail soft rather than crash the run,
    so Company always falls back to company_fallback ("THE FA GROUP - NFC").
    FA Learning Course (GC) is read DIRECTLY from Integration col S, same
    pattern as Revenue Category/Cost Centre/Reporting Type. Camp, Event,
    Commercial Partner, Grant, and Programme are, per 2026-09-22 Finance
    instruction, no longer read from Codes at all and are intentionally
    always blank. Project and Sales Item have never had a source column and
    stay blank too.
    Tax is determined per-row from the source Net/VAT split: rows with zero VAT use
    the domestic-out-of-scope zero-rated set; rows with positive VAT use the
    domestic 20% standard-rated set.

runtime:
  step_list_macro: RunArIntegrationCustomerInvoice

source_layout:
  worksheet_name: Integration
  worksheet_resolution: named
  header_row: 1
  data_start_row: 3
  header_detection: literal_row
  required_headers:
    - Date
    - Customer ID
    - WORKDAY ID
    - Organisation Name
    - Course Name
    - "Description|Course Code"
    - Quantity
    - "Net \u00A3"
    - "Vat \u00A3"
    - "Gross Price \u00A3"
    - PO Number

transform_constants:
  fixed_currency: GBP
  fixed_invoice_type: Standard
  company_fallback: THE FA GROUP - NFC
  mapping_sheet: MAPPING MASTER

  invoice_identifier:
    derivation: per_group_reset_counter
    primary_group_driver: source_column("PO Number")
    primary_group_key_format: "PO::{value}"
    counter_scope: per_unique_group
    counter_reset: when_group_key_changes
    counter_start: 1
    primary_output_format: "{value}-{N}"
    primary_example: "PO0015650-1, PO0015650-2, ... PO0015650-32 for the 32 AFC Bournemouth Talent ID rows"
    fallback_1_when_primary_blank:
      group_driver: composite(source_column("Customer ID"), source_column("Date"))
      group_key_format: "CUST::{customer}::{date}"
      output_format: "{customer}-NOPO-{N}"
      example: "60005120-NOPO-1 (Customer ID, no PO, grouped by Customer + Invoice Date)"
    fallback_2_when_all_blank:
      output_format: "AR-INT-{spreadsheet_key}"
      note: >
        Defensive catch-all — should never fire because the IntegrationRowIsSkippable
        rule already rejects rows where both Customer ID and Date are blank.
    writes_to_eib_columns: [D, G, BO]
    evaluation: once_per_non_skipped_source_row
    note: >
      SINGLE SOURCE OF TRUTH for how columns D (Customer Invoice Reference ID),
      G (Customer Invoice ID), and BO (Invoice Number) receive their values.
      The counter is evaluated exactly ONCE per non-skipped Integration source row
      (before any per-column writes) so D, G, and BO all receive the exact same
      string instance (no independent counter increments, no separator drift).
      Pattern is identical in structure to modApCfaClaimsSupplierInvoice Rule 8
      (per-group reset counter using VBA Collection as a keyed Long store — NO
      Scripting.Dictionary so it runs on both Mac and PC Excel).  If Finance
      later adds a dedicated Invoice N0 source column, BO can be independently
      overridden via optional_override_source_column in the transform_spec.

  source_lookups:
    course_hierarchy:
      worksheet_name: Codes
      header_row: 1
      data_start_row: 2
      lookup_key_source_column: Course Name
      lookup_key_lookup_column: Course
      description: >
        LEGACY, MOSTLY DEFUNCT as of 2026-09-22 (Combined 30-34 workbook):
        this was originally a direct course-to-hierarchy lookup authored by
        Finance on the source workbook's "Codes" tab, matching each row's
        Course Name (Integration col E) case-insensitively against Codes!A
        and writing the matched row's Company/Cost centre/Reporting Type/
        FA Learning courses/Camp/Commerical Partners/Events/Grant/Program/
        Revenue Cat verbatim into the EIB. The Combined 30-34 workbook's
        Codes tab no longer has a "Course" column at all (it's now a plain
        3-column dropdown reference list), so this lookup can never resolve
        against it. Company (target J) is the ONLY field still wired to
        attempt this lookup; it fails soft and always falls back to
        company_fallback. Cost Centre / Reporting Type / Revenue Category /
        FA Learning Course are now read DIRECTLY per row from the Integration
        sheet's own row-2 sub-headers (cols O / P / Q / S) instead - see
        transform_specs targets fx/fy/em/gc. Camp / Event / Commercial
        Partner / Grant / Programme are, per Finance instruction, no longer
        derived from anywhere and are intentionally always blank - see
        transform_specs targets fz/ga/gb/gd/ge.
      return_columns:
        company: Company

  worktag_resolution:
    driver: Course Name
    resolution: course_name_direct_from_source_lookup_sheet
    lookup_ref: course_hierarchy
    note: >
      NON-CANONICAL RESOLUTION PIPELINE for this profile only, and now LARGELY
      SUPERSEDED as of 2026-09-22 (see source_lookups.course_hierarchy above):
      Company is the only field still attempting this Codes-lookup pipeline
      (fails soft, falls back to company_fallback). Cost Centre / Reporting
      Type / Revenue Category / FA Learning Course are read directly off the
      Integration sheet's own row 2. Camp / Event / Commercial Partner /
      Grant / Programme are intentionally always blank. There is NO
      account-string derivation and NO Mapping MASTER lowest-hierarchy scan.
      The Mapping MASTER file is NOT opened at runtime for this transform (it
      is still registered in the shell config for archetype parity but the
      macro skips it).

  worktag_business_objects:
    revenue_category: "Revenue Category"
    cost_centre: "Cost Center"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    programme: "Program - Delivered Org"
    project: "Projects (Opex)"
    sales_item: "Sales Item"
  derived_worktags:
    reporting_type:
      derivation: "2026-09-22: read directly from Integration col P (row-2 sub-header 'Reporting Type'), not via Codes tab or Final Code seg2."
  unmapped_handling: silent_blank

  tax_triple_per_row:
    source_net_column: "Net \u00A3"
    source_vat_column: "Vat \u00A3"
    source_gross_column: "Gross Price \u00A3"
    header_aliases_net: ["Net PS", "Net"]
    header_aliases_vat: ["VAT PS", "VAT \u00A3", "VAT", "Vat PS", "Vat"]
    header_aliases_gross: ["Gross Price PS", "Gross Price"]
    alias_resolution_order: primary_required_header_first_then_aliases_by_year_tab_variant
    standard_rated:
      applicability: GBR_Domestic_Sale_of_Goods_and_Services
      code: GBR_200_VAT
      recoverability: Fully_Recoverable
    zero_rated:
      applicability: GBR_Domestic_Outside_the_Scope
      code: GBR_000_No_VAT
      recoverability: Fully_Recoverable

  customer_invoice_eib_columns:
    customer_invoice_ref_id: D
    customer_invoice_id: G
    invoice_number: BO
    spreadsheet_key: B
    add_only: C
    header_comment: E
    submit: H
    locked_in_workday: I
    company: J
    row_id_header_1: K
    row_id_header_2: L
    row_id_header_3: M
    currency: AI
    customer: AJ
    sold_to_customer: AK
    billable_project_header: BN
    invoice_date: BR
    payment_status: CK
    document_status: CL
    amount_due: CM
    customer_invoice_type: CO
    header_tax_code: CP
    customer_po_number: CQ
    include_customer_worktags: CY
    header_worktags_plus: CZ
    header_memo: DB
    row_id_line: DS
    line_reference: DU
    line_order: DV
    sales_item: EJ
    revenue_category: EM
    line_item_description: EN
    line_tax_applicability: FA
    line_tax_code: FB
    line_quantity: FH
    line_unit_of_measure: FI
    line_unit_cost: FL
    line_extended_amount: FO
    line_transaction_date: FP
    line_from_date: FQ
    line_to_date: FR
    deferred_revenue: FS
    line_memo: FV
    billable_project_line: GF
    cost_centre: FX
    reporting_type: FY
    camp: FZ
    event: GA
    commercial_partner: GB
    fa_learning_course: GC
    grant: GD
    programme: GE
    project_line_worktag: GF
    worktags_plus_order:
      sales_item: EJ
      reporting_type: FY
      event: GA
      camp: FZ
      fa_learning: GC
      commercial_partner: GB
      grant: GD
      programme: GE
      cost_centre: FX

