version: 1

transform:
  key: ar_integration_invoice
  label: AR Integration Invoice
  source_type: AR Integration Invoice
  eib_population_type: Customer Invoice
  start_row: 6
  description: >
    National Football Centre (NFC) Learning Integration tab invoices transformed into
    the Workday Customer Invoice EIB workbook v46.1. One source row = one single-line
    Workday Customer Invoice (mirrors ar_bulk_invoice archetype).
    2026-09-22 (Combined 30-34 workbook) REWORK: the Integration tab now carries a
    two-row header (row 1 = field names / "Required Fields" / "Optional Fields"
    group labels; row 2 = the actual sub-headers under those two groups), and data
    starts on ROW 3, not row 2. Revenue Category (Integration col Q), Cost Centre
    (col O), and Reporting Type (col P) are now read DIRECTLY per row from that
    group (no lookup) and written to EIB EM / FX / FY respectively. For FY the
    leading "<number>: " prefix in col P is removed so only the text is written
    (e.g. "1: FA Operations" -> "FA Operations"). Customer
    AJ is now read DIRECTLY from the new Integration col C ("WORKDAY ID"),
    replacing the old Customer ID (col B) -> Customer Spreadsheet extract
    lookup, which was rejecting rows with "CUSTOMER ID not found in customer
    extract" once the source's Customer ID values stopped lining up with the
    extract.
    Company still goes through the legacy Course-Name -> "Code lists" tab hierarchy
    lookup, which the Combined 30-34 workbook's Code lists tab NO LONGER SUPPORTS
    (it's now a plain 3-column dropdown reference list with no "Course" key
    column) -- that lookup is coded to fail soft rather than crash the run,
    so Company always falls back to company_fallback ("THE FA GROUP - NFC").
    FA Learning Course (GC) is read DIRECTLY from Integration col S, same
    pattern as Revenue Category/Cost Centre/Reporting Type. Camp, Event,
    Commercial Partner, Grant, and Programme are, per 2026-09-22 Finance
    instruction, no longer read from Code lists at all and are intentionally
    always blank. Project and Sales Item have never had a source column and
    stay blank too.
    Invoice Number (BO) is left blank on every row. Line Tax Applicability (FA)
    and Line Tax Code (FB) are determined per row from the source Net/VAT split
    (restored 2026-10-06; blank 2026-09-29 to 2026-10-06): rows with zero VAT use
    the domestic-out-of-scope zero-rated set; rows with positive VAT use the
    domestic 20% standard-rated set. See tax_triple_per_row.
    Amounts (2026-10-06): Amount Due (CM), Unit Cost (FL) and line Extended
    Amount (FO) = source "Net" (col I); Workday adds VAT from the line Tax Code
    (FB), so the invoice total comes out at Gross (Gross 2026-09-30 to 2026-10-06);
    Quantity (FH) = source "Quantity" (col H), capped at 1 (a source value above
    1 is written as 1); blank, text or <= 0 defaults to 1.
    Customer Invoice ID (G) is
    integration_{Customer without hyphen}_{Invoice Date YYYYMMDD}_{Spreadsheet Key};
    Customer Invoice Reference ID (D) is left blank on every row (2026-09-30: D looks
    up an EXISTING Workday invoice, so a new ID there fails the load).

runtime:
  step_list_macro: RunArIntegrationCustomerInvoice

source_layout:
  worksheet_name: Integration
  worksheet_resolution: named
  header_row: 1
  data_start_row: 3
  header_detection: literal_row
  required_headers:
    - Date
    - Customer ID
    - WORKDAY ID
    - Organisation Name
    - Course Name
    - "Description|Course Code"
    - Quantity
    - "Net \u00A3"
    - "Vat \u00A3"
    - "Gross Price \u00A3"
    - PO Number

transform_constants:
  fixed_currency: GBP
  fixed_invoice_type: Standard
  company_fallback: THE FA GROUP - NFC
  mapping_sheet: MAPPING MASTER
  # EIB column G (Customer Invoice ID) =
  # integration_<Customer>_<Invoice Date>_<Spreadsheet Key> (DECIDED 2026-09-30, moved from D):
  #   - Customer     = the AJ value (Integration col C "WORKDAY ID") with hyphens removed;
  #                    AJ itself keeps the original Customer ID (hyphens intact).
  #   - Invoice Date = the BR value formatted YYYYMMDD.
  #   - Spreadsheet Key = B, assigned AFTER grouping on the invoice_identifier below
  #                    (group on the source-derived identifier, take B, then build G).
  #   - G is written as text (NumberFormat "@").
  # e.g. C-000190, 18.09.26, key 1 -> integration_C000190_20260918_1.
  # EIB column D (Customer Invoice Reference ID) is left blank on every row: in Submit
  # Customer Invoice it looks up an EXISTING Workday invoice, so a new ID there fails the
  # load with an invalid Customer_Invoice_Reference_ID error.
  # The invoice_identifier below is no longer written to any column; it only drives the
  # Spreadsheet Key / line grouping. BO (Invoice Number) is left blank.

  invoice_identifier:
    derivation: per_group_reset_counter
    primary_group_driver: source_column("PO Number")
    primary_group_key_format: "PO::{value}"
    counter_scope: per_unique_group
    counter_reset: when_group_key_changes
    counter_start: 1
    primary_output_format: "{value}-{N}"
    primary_example: "PO0015650-1, PO0015650-2, ... PO0015650-32 for the 32 AFC Bournemouth Talent ID rows"
    fallback_1_when_primary_blank:
      group_driver: composite(source_column("Customer ID"), source_column("Date"))
      group_key_format: "CUST::{customer}::{date}"
      output_format: "{customer}-NOPO-{N}"
      example: "60005120-NOPO-1 (Customer ID, no PO, grouped by Customer + Invoice Date)"
    fallback_2_when_all_blank:
      output_format: "AR-INT-{row_sequence}"
      note: >
        Defensive catch-all — should never fire because the IntegrationRowIsSkippable
        rule already rejects rows where Customer ID or Date is blank. {row_sequence}
        is the 1-based count of rows written so far (not the Spreadsheet Key).
    writes_to_eib_columns: []
    evaluation: once_per_non_skipped_source_row
    note: >
      SINGLE SOURCE OF TRUTH for the grouping key for Spreadsheet Key (B) / line
      order. It is not written to any EIB column: G (Customer Invoice ID) holds the
      composite integration_... ID and D (Customer Invoice Reference ID) is blank
      (see the column G / D comment above), and BO (Invoice Number) is left blank on
      every row.
      The counter is evaluated exactly ONCE per non-skipped Integration source row
      (before any per-column writes), so there are no independent counter
      increments and no separator drift.
      Pattern is identical in structure to modApCfaClaimsSupplierInvoice Rule 8
      (per-group reset counter using VBA Collection as a keyed Long store — NO
      Scripting.Dictionary so it runs on both Mac and PC Excel).

  source_lookups:
    course_hierarchy:
      worksheet_name: Code lists
      header_row: 1
      data_start_row: 2
      lookup_key_source_column: Course Name
      lookup_key_lookup_column: Course
      description: >
        LEGACY, MOSTLY DEFUNCT as of 2026-09-22 (Combined 30-34 workbook):
        this was originally a direct course-to-hierarchy lookup authored by
        Finance on the source workbook's "Code lists" tab, matching each row's
        Course Name (Integration col E) case-insensitively against 'Code lists'!A
        and writing the matched row's Company/Cost centre/Reporting Type/
        FA Learning courses/Camp/Commerical Partners/Events/Grant/Program/
        Revenue Cat verbatim into the EIB. The Combined 30-34 workbook's
        Code lists tab no longer has a "Course" column at all (it's now a plain
        3-column dropdown reference list), so this lookup can never resolve
        against it. Company (target J) is the ONLY field still wired to
        attempt this lookup; it fails soft and always falls back to
        company_fallback. Cost Centre / Reporting Type / Revenue Category /
        FA Learning Course are now read DIRECTLY per row from the Integration
        sheet's own row-2 sub-headers (cols O / P / Q / S) instead - see
        transform_specs targets fx/fy/em/gc. Camp / Event / Commercial
        Partner / Grant / Programme are, per Finance instruction, no longer
        derived from anywhere and are intentionally always blank - see
        transform_specs targets fz/ga/gb/gd/ge.
      return_columns:
        company: Company

  worktag_resolution:
    driver: Course Name
    resolution: course_name_direct_from_source_lookup_sheet
    lookup_ref: course_hierarchy
    note: >
      NON-CANONICAL RESOLUTION PIPELINE for this profile only, and now LARGELY
      SUPERSEDED as of 2026-09-22 (see source_lookups.course_hierarchy above):
      Company is the only field still attempting this Code lists lookup pipeline
      (fails soft, falls back to company_fallback). Cost Centre / Reporting
      Type / Revenue Category / FA Learning Course are read directly off the
      Integration sheet's own row 2. Camp / Event / Commercial Partner /
      Grant / Programme are intentionally always blank. There is NO
      account-string derivation and NO Mapping MASTER lowest-hierarchy scan.
      The Mapping MASTER file is NOT opened at runtime for this transform (it
      is still registered in the shell config for archetype parity but the
      macro skips it).

  worktag_business_objects:
    revenue_category: "Revenue Category"
    cost_centre: "Cost Center"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    programme: "Program - Delivered Org"
    project: "Projects (Opex)"
    sales_item: "Sales Item"
  derived_worktags:
    reporting_type:
      derivation: "2026-09-22: read directly from Integration col P (row-2 sub-header 'Reporting Type'), not via Code lists tab or Final Code seg2."
      source_column: P
      target_column: FY
      value_cleanup: strip_leading_number_colon_space
      value_cleanup_rule: >
        Col P carries a number, a ":" and a space before the Reporting Type text
        (for a one-digit number the text starts at the 4th character). When the
        part before the first ":" is all digits, remove it and the ":", trim the
        leading space(s), and write only the remaining text to FY. Otherwise (no
        ":", or a non-numeric prefix) the value is written unchanged (trimmed); a
        blank P leaves FY blank.
      examples:
        - "1: FA Operations -> FA Operations"
        - "4: FA Investments -> FA Investments"
        - "5: National Game Board (NGB) -> National Game Board (NGB)"
        - "6: Professional Game Board (PGB) -> Professional Game Board (PGB)"
        - "FA Operations -> FA Operations (no prefix, unchanged)"
  unmapped_handling: silent_blank

  # FA (Line Tax Applicability) / FB (Line Tax Code): per-row tax triple from the source
  # Net/VAT split, restored 2026-10-06 (left blank 2026-09-29 to 2026-10-06).
  # BO (Invoice Number) stays blank on every row.
  tax_triple_per_row:
    source_net_column: "Net £"
    source_vat_column: "Vat £"
    source_gross_column: "Gross Price £"
    header_aliases_net: ["Net PS", "Net"]
    header_aliases_vat: ["VAT PS", "VAT £", "VAT", "Vat PS", "Vat"]
    header_aliases_gross: ["Gross Price PS", "Gross Price"]
    alias_resolution_order: primary_required_header_first_then_aliases_by_year_tab_variant
    standard_rated:
      applicability: GBR_Domestic_Sale_of_Goods_and_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable
    zero_rated:
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Fully_Recoverable

  customer_invoice_eib_columns:
    # --- HEADER identifier columns (D blank; G composite ID; BO blank) ---
    # G = integration_{AJ without hyphens}_{BR as YYYYMMDD}_{B}, e.g.
    # integration_C000190_20260918_1. AJ keeps the original Customer ID. See the
    # column G / D comment under transform_constants.
    customer_invoice_ref_id: D        # intentionally left blank on every row
    customer_invoice_id: G
    invoice_number: BO                # intentionally left blank on every row
    spreadsheet_key: B
    add_only: C
    header_comment: E
    submit: H
    locked_in_workday: I
    company: J
    row_id_header_1: K
    row_id_header_2: L
    row_id_header_3: M
    currency: AI
    customer: AJ
    sold_to_customer: AK
    billable_project_header: BN
    invoice_date: BR
    payment_status: CK
    document_status: CL
    amount_due: CM                    # source "Net" (col I), 2026-10-06
    customer_invoice_type: CO
    header_tax_code: CP
    customer_po_number: CQ
    include_customer_worktags: CY
    header_worktags_plus: CZ
    header_memo: DB
    row_id_line: DS
    line_reference: DU
    line_order: DV
    sales_item: EJ
    revenue_category: EM
    line_item_description: EN
    line_tax_applicability: FA        # per-row tax triple (tax_triple_per_row)
    line_tax_code: FB                 # per-row tax triple (tax_triple_per_row)
    line_quantity: FH                 # source "Quantity" (col H), capped at 1
    line_unit_of_measure: FI
    line_unit_cost: FL                # source "Net" (col I), 2026-10-06
    line_extended_amount: FO          # source "Net" (col I), 2026-10-06
    line_transaction_date: FP
    line_from_date: FQ
    line_to_date: FR
    deferred_revenue: FS
    line_memo: FV
    billable_project_line: GF
    cost_centre: FX
    reporting_type: FY
    camp: FZ
    event: GA
    commercial_partner: GB
    fa_learning_course: GC
    grant: GD
    programme: GE
    project_line_worktag: GF
    worktags_plus_order:
      sales_item: EJ
      reporting_type: FY
      event: GA
      camp: FZ
      fa_learning: GC
      commercial_partner: GB
      grant: GD
      programme: GE
      cost_centre: FX

shell_defaults:
  source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/integration/source/Combined 30-34 Invoice Integration 17.09.26.xlsx
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/FA Submit Customer Invoice.xlsx
  output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/integration/target/FA Submit Customer Invoice_ar_integration_invoice_output.xlsx
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 3
