  source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/integration/source/Invoice Integration 07.08.2026.xlsx
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Customer_Invoice_v46.1.xlsx
  output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/integration/target/Submit_Customer_Invoice_v46.1_ar_integration_invoice_output.xlsx
