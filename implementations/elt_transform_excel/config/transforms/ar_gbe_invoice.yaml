version: 1

transform:
  key: ar_gbe_invoice
  label: AR Invoice GBE
  source_type: AR Invoice GBE
  eib_population_type: Customer Invoice
  start_row: 6
  description: >
    Governing Body Endorsement (GBE) player-registration invoice extract transformed into the
    Workday Customer Invoice EIB workbook v46.1. ONE transform, TWO variant sources: the same
    workbook holds two tabs ("Mens GBE" and "Womens GBE") with an IDENTICAL column layout;
    each tab is run as a separate Runner dropdown selection (AR Invoice GBE Mens / AR Invoice
    GBE Womens) via shell_defaults.variants + a per-variant source_worksheet_name override -
    the same one-transform-many-sources pattern used by ap_stationery. One source row = one
    invoice LINE; lines are grouped into one multi-line Workday Customer Invoice per Workday
    Customer ID + Invoice Date (2026-10-23): rows sharing a Customer (AJ) and Invoice Date
    (BR) share one Spreadsheet Key (B), and Row ID (DS) / Line Order (DV) run 1..N within it.
    Header fields CQ / DB come from the group's first row. AR now delivers a ready-made Workday Customer ID
    per row (source col A "WORKDAY ID" / "Customer ID" depending on tab): the customer (AJ)
    is a DIRECT PASSTHROUGH of that column - the earlier two-level club-name cascade match is
    no longer used for this transform (superseded 2026-09-17; the shared cascade helper
    remains available in modFinanceCommon.bas for other transforms). Company (J), Cost Centre
    (FX), Reporting Type (FY) and Revenue Category (EM) are now supplied by AR as BATCH
    CONSTANTS in source columns K/L/M/N: only the first data row (row 2) carries a value: that
    single value is read once and applied to every output row. The remaining worktag slots
    (event, camp, FA Learning, commercial partner, grant, programme, project) stay blank - GBE
    still has no per-row COST CODE column for the Mapping-MASTER hierarchy lookup. Amounts
    originally mirrored ar_multi_line / ar_bulk's GROSS-into-amounts convention; DECIDED
    2026-09-17: Amount Due (CM), Unit Cost (FL) and Extended Amount (FO) all came from
    NET (col F) instead of GROSS; as of 2026-10-07 CM and FO are left blank on every row (as
    ar_integration_invoice / ar_discipline_invoice) and only FL carries NET. Invoice Number (BO) is left blank on every row. Line Tax
    Applicability (FA) and Line Tax Code (FB) are set per row from the Net / (Gross - Net)
    split, same rule and values as ar_integration_invoice (2026-10-07). Customer PO Number (CQ)
    is a per-row direct passthrough of source col I "PO" (blank when the cell or column is
    absent) (2026-10-22). Customer Invoice ID (G) is
    gbe_{mens|womens}_{Customer without hyphen}_{Invoice Date YYYYMMDD}_{Spreadsheet Key};
    Customer Invoice Reference ID (D) is left blank on every row (D looks up an EXISTING
    Workday invoice, so a new ID there fails the load - mirrors ar_integration_invoice).
    Player and Reference are no longer separate source columns - both are embedded in one
    free-text "Invoice Line Description" cell (e.g. "Romain Jordan Faivre-FOOT01/22/S-2024-1669")
    and are split at runtime on the literal "-FOOT" anchor token (verified against all 584 rows
    of the 2026-09-17 AR file, including hyphenated surnames); Type comes from the adjacent
    "Invoice line part 2" / "Invoice Line Description 2" column. See
    config/transform_specs/ar_gbe_invoice.yaml for the full decision record and per-column
    mapping.

runtime:
  step_list_macro: RunArGbeInvoiceCustomerInvoice

source_layout:
  # Named-worksheet resolution: each Runner variant overrides worksheet_name to its tab.
  # The base worksheet_name below is the Mens tab (the manifest default variant); it is
  # only used if a build ever references the base binding directly.
  worksheet_resolution: named
  worksheet_name: Mens GBE
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  required_headers:
    - Date
    - Club|Customer Name
    - Invoice Line Description
    - Invoice line part 2|Invoice Line Description 2
    - Gross
    - Net
    - WORKDAY ID|Customer ID
    - Company
    - Cost Centre
    - Reporting Type
    - Revenue Category

transform_constants:
  fixed_company_code: FA
  fixed_currency: GBP
  fixed_invoice_type: Standard
  # BO (Invoice Number) is left blank on every row. FA (Line Tax Applicability) and FB
  # (Line Tax Code) are set per row -- see tax_triple_per_row below and mapping.fa/.fb in
  # the spec.
  company_fallback: THE FA GROUP - FA
  # FA / FB per-row tax triple (2026-10-07), mirroring ar_integration_invoice: rows with
  # NET > 0 and VAT = 0 (or NET = GROSS = 0) use the zero-rated set; every other row uses
  # the standard-rated set. VAT = GROSS - NET because the Womens tab header omits the "VAT"
  # label. The .bas holds these values as profile-local Private Consts -- keep both in step.
  tax_triple_per_row:
    source_net_column: Net
    source_gross_column: Gross
    vat_derivation: Gross - Net
    standard_rated:
      applicability: GBR_Domestic_Sale_of_Goods_and_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable
    zero_rated:
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Fully_Recoverable
  # DECIDED 2026-09-17: AR now delivers a ready-made Workday Customer ID per row (source col A,
  # header "WORKDAY ID" on the Mens tab / "Customer ID" on the Womens tab). Customer resolution
  # is a DIRECT PASSTHROUGH of that column - no lookup, no name matching. This supersedes the
  # earlier two-level club-name cascade (customer_name_resolution.two_level_l1_l2_sql_migration
  # in shared_helper_registry.yaml); that shared helper is untouched and still available to
  # other transforms, it is simply no longer called by ar_gbe_invoice.
  customer_resolution:
    mode: direct_passthrough
    source_column: WORKDAY ID|Customer ID
    source_column_letter: A
    on_blank: reject
  # Multi-line grouping (2026-10-23): the invoice-line grouping key is the Customer ID above
  # plus the normalised Invoice Date ("{Customer ID}|{YYYY-MM-DD}"). B = one Spreadsheet Key
  # per distinct Customer + Date pair (first-seen order); DS and DV = 1..N within that key,
  # restarting at 1 for each new key. BR (and so G) is uniform within a group by construction;
  # header CQ / DB come from the group's first row. Output keeps source row order (no re-sort).
  invoice_line_grouping:
    group_key: [WORKDAY ID|Customer ID, Date]
    group_key_format: "{Customer ID}|{Date as YYYY-MM-DD}"
    spreadsheet_key: B
    row_id_line: DS
    line_order: DV
    header_values_from: first_row_of_group
    header_columns: [CQ, DB]
  # Company (J), Cost Centre (FX), Reporting Type (FY) and Revenue Category (EM) are now
  # supplied by AR as BATCH CONSTANTS: only the first data row (row 2) of source columns
  # K/L/M/N carries a value; that single value is read once per run and applied to every
  # output row. The remaining worktag slots (event, camp, FA Learning, commercial partner,
  # grant, programme, project) stay blank - GBE still has no per-row COST CODE column, so the
  # Mapping-MASTER hierarchy lookup for those slots remains inert (costCodeColumn resolves to
  # 0 -> the .bas guards skip every lookup for them).
  # Customer PO Number (CQ) = per-row direct passthrough of source col I "PO" (2026-10-22).
  # Optional: not in required_headers, so a tab without the column still runs; a blank cell
  # or missing column leaves CQ empty (not mandatory for Submit Customer Invoice).
  customer_po_number:
    source_column: PO
    source_column_letter: I
    target: CQ
    mode: direct_passthrough
    on_blank: leave_empty
  batch_constant_columns:
    company: {source_column: Company, source_column_letter: K, target: J, fallback: THE FA GROUP - FA}
    cost_centre: {source_column: Cost Centre, source_column_letter: L, target: FX}
    reporting_type: {source_column: Reporting Type, source_column_letter: M, target: FY}
    revenue_category: {source_column: Revenue Category, source_column_letter: N, target: EM}
  unmapped_handling: silent_blank
  mapping_sheet: MAPPING MASTER
  worktag_business_objects:
    revenue_category: "Revenue Category"
    cost_centre: "Cost Center"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    programme: "Program - Delivered Org"
    project: "Projects (Opex)"
    sales_item: "Sales Item"
  # derived_worktags.reporting_type is MANDATORY whenever worktag_business_objects is
  # declared (build-time hygiene rule), so the .bas keeps the formal
  # ResolveReportingTypeFromFinalCode() call - it is a no-op (costCodeColumn is always 0,
  # so it always resolves "") since GBE still has no per-row COST CODE. The ACTUAL Reporting
  # Type (FY) value is the BATCH CONSTANT from source col M (see batch_constant_columns
  # above), applied AFTER that no-op call.
  derived_worktags:
    reporting_type:
      derivation: >-
        formal ResolveReportingTypeFromFinalCode() call is a no-op (no per-row COST CODE);
        the FY value actually written is the batch constant from source col M row 2, see
        batch_constant_columns.reporting_type
  customer_invoice_eib_columns:
    # --- HEADER identifier columns (D blank; G composite ID; BO blank) ---
    # G = gbe_{mens|womens}_{AJ without hyphens}_{BR as YYYYMMDD}_{B}, e.g.
    # gbe_mens_C000102_20260317_1, written as text. AJ keeps the original Customer ID. The
    # mens/womens token comes from the variant profile_key (ar_gbe_invoice_mens /
    # ar_gbe_invoice_womens). G previously held the GBE Reference (the "-FOOT" part of
    # Invoice Line Description); that Reference is still written to Header Memo (DB).
    # D is left blank on every row: in Submit Customer Invoice it looks up an EXISTING
    # Workday invoice, so a new ID there fails the load with an invalid
    # Customer_Invoice_Reference_ID error (mirrors ar_integration_invoice).
    customer_invoice_ref_id: D        # intentionally left blank on every row
    customer_invoice_id: G
    invoice_number: BO                # intentionally left blank on every row
    # --- HEADER fields (Submit Customer Invoice v46.1) ---
    spreadsheet_key: B
    add_only: C
    header_comment: E
    submit: H
    locked_in_workday: I
    company: J
    row_id_header_1: K
    row_id_header_2: L
    row_id_header_3: M
    currency: AI
    customer: AJ
    sold_to_customer: AK
    billable_project_header: BN
    invoice_date: BR
    payment_status: CK
    document_status: CL
    amount_due: CM                    # intentionally left blank on every row (2026-10-07)
    customer_invoice_type: CO
    header_tax_code: CP
    customer_po_number: CQ            # source col I "PO", per row (see customer_po_number above)
    include_customer_worktags: CY
    header_worktags_plus: CZ
    header_memo: DB
    # --- LINE identifier and Row ID ---
    row_id_line: DS
    line_reference: DU
    line_order: DV
    # --- LINE fields ---
    sales_item: EJ
    revenue_category: EM
    line_item_description: EN
    line_tax_applicability: FA        # per row, see tax_triple_per_row
    line_tax_code: FB                 # per row, see tax_triple_per_row
    line_quantity: FH
    line_unit_of_measure: FI
    line_unit_cost: FL
    line_extended_amount: FO          # intentionally left blank on every row (2026-10-07)
    line_transaction_date: FP
    line_from_date: FQ
    line_to_date: FR
    deferred_revenue: FS
    line_memo: FV
    billable_project_line: GF
    # --- Accounting-string / Worktag hierarchy FX..GF (9 slots, shared with AP) ---
    cost_centre: FX
    reporting_type: FY
    camp: FZ
    event: GA
    commercial_partner: GB
    fa_learning_course: GC
    grant: GD
    programme: GE
    project_line_worktag: GF
    # --- 9-pack write order for the account-string worktags (order of Array() in .bas) ---
    worktags_plus_order:
      sales_item: EJ
      reporting_type: FY
      event: GA
      camp: FZ
      fa_learning: GC
      commercial_partner: GB
      grant: GD
      programme: GE
      cost_centre: FX
  final_code_derivation:
    strip_chars: [" "]
    segment_lengths: [4, 6, 8, 4]
    output_joiner: "-"
    seg2_first_char_map:
      # Inert for GBE (no COST CODE driver). Retained for archetype parity with
      # ar_bulk_invoice / ar_multi_line_invoice.
    on_unmapped_seg2_char: SilentBlankUnlessOverridden
    error_token: ""

shell_defaults:
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/FA Submit Customer Invoice.xlsx
  # Source layout defaults shared by both GBE tab variants below.
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  # customer_spreadsheet / mapping_spreadsheet / mapping_sheet inherited from
  # config/reference_paths.yaml.
  #
  # ONE DROPDOWN ROW PER VARIANT. Both variants share the SAME step-list macro
  # (RunArGbeInvoiceCustomerInvoice), the SAME source_layout schema (headers row 1,
  # data row 2, identical column set), and the SAME source workbook FILE. The only
  # per-variant differences are: (1) profile_key / profile_label in the dropdown,
  # (2) source_worksheet_name (the tab), (3) output_file_path.
  variants:
    - profile_key: ar_gbe_invoice_mens
      profile_label: AR Invoice GBE Mens
      source_worksheet_name: Mens GBE
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/gbe/source/22. GBE - August 26.xlsx
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/gbe/target/FA_Submit_Customer_Invoice_ar_gbe_invoice_mens_output.xlsx
    - profile_key: ar_gbe_invoice_womens
      profile_label: AR Invoice GBE Womens
      source_worksheet_name: Womens GBE
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/gbe/source/22. GBE - August 26.xlsx
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ar/gbe/target/FA_Submit_Customer_Invoice_ar_gbe_invoice_womens_output.xlsx
