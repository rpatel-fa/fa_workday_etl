version: 1

transform:
  key: ap_prize_funds
  label: AP Prize Funds
  source_type: AP Prize Funds
  eib_population_type: Supplier Invoice
  description: >
    Emirates FA Cup Prize Fund workbook (e.g. "Copy of Copy of FA Cup 1ST RND PROPER (1) (3).xlsx")
    transformed into the Workday Supplier Invoice EIB. Sources the Finance AP-prepared INTEGRATION
    tab (they use it for Workday/GP load directly). 80 rows = 40 Winners @ 47,750 + 40 Losers
    @ 15,800 = 2,542,000 total. Integration has NO Company column (constant FA enforced in .bas).
    DocNo is identical across all 80 rows = batch ref "FAC1STRNDP2526", so InvoiceNumber G uses
    {BatchID}-{CreditorID} (NVFAC1STRNDP2526-{club}) and SuppliersInvoiceNumber AU uses
    {DocNo}-{CreditorID}. 11 integration headers A-K. Source workbook's "PurchasesAmount" header
    carries a trailing space in the cell — NormalizeToken trims symmetrically on both the source
    scan and the required_headers comparison, so the bare name in required_headers below is correct.
    Tax = 0 POS everywhere, uniform Outside of Scope treatment.
    See config/transform_specs/ap_prize_funds.yaml for the full decision record.

runtime:
  step_list_macro: RunApPrizeFundSupplierInvoice

source_layout:
  worksheet_name: INTEGRATION
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  required_headers:
    - BatchID
    - CreditorID
    - DocumentType
    # NOTE: intentionally misspelled with a 'c' — matches the Finance GP
    # export's "Decscription" header exactly. See transform_specs decision record.
    - Decscription
    - InvoiceDate
    - ReceiptDate
    - DocNo
    - DistributionReferenceCode
    - PurchasesAmount
    - TaxAmount
    - TaxDetailID

transform_constants:
  fixed_company_code: FA
  batch_id_token: NVFAC1STRNDP2526
  uniform_tax:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  company_fallback: THE FA GROUP - FA
  mapping_sheet: MAPPING MASTER
  worktag_business_objects:
    cost_centre: "Cost Center"
    spend_category: "Spend Category"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    program: "Program - Delivered Org"
    project: "Projects (Opex)"
  derived_worktags:
    reporting_type:
      derivation: LEFT(accounting_element_2, 1) mapped via ResolveReportingTypeCode
  unmapped_handling: reject_mandatory_worktags
  supplier_eib_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH
shell_defaults:
  source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/prize_funds/source/Copy of Copy of FA Cup 1ST RND PROPER (1) (3).xlsx
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/prize_funds/target/Submit_Supplier_Invoice_ap_prize_funds_output.xlsx
  # source_layout defaults — override here to change which sheet/rows the transform uses at build time
  source_worksheet_name: INTEGRATION
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  # supplier_spreadsheet / mapping_spreadsheet / mapping_sheet inherited from
  # config/reference_paths.yaml. Override here only if this transform needs different refs.
