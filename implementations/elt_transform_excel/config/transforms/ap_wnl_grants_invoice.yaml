version: 1

transform:
  key: ap_wnl_grants_invoice
  label: AP WNL Grants Invoice
  source_type: AP WNL Grants Invoice
  eib_population_type: Supplier Invoice
  description: >
    WNL Ad Hoc Grants Integration export from GP (e.g. "Ad hoc grants - FA WNL 25-26 Season
    - End of DEC 25.xlsx") transformed into the Workday Supplier Invoice EIB. Source is the
    canonical GP "integration" tab (lowercase in this exemplar) that Finance WNL team
    prepares after aggregating per-grant working rows. Schema is byte-identical to
    ap_prize_funds and ap_commercial_invoice: 11 cols A-K, same "Decscription" typo, same
    whitespace-wrapped PurchasesAmount header. CreditorID is the GP creditor code (direct
    Supplier Spreadsheet Reference ID lookup, company-FA precedence).
    DistributionReferenceCode column drives accounting-string worktag mapping (all 63 rows
    of the exemplar post to the same WNL grants GL code 1097-408006-00000000-G055, but the
    pipeline works per-row for generality).
    See config/transform_specs/ap_wnl_grants_invoice.yaml for the decision record.

runtime:
  step_list_macro: RunApWnlGrnInv

source_layout:
  worksheet_name: integration
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  required_headers:
    - BatchID
    - CreditorID
    - DocumentType
    # Intentionally misspelled with a 'c' — matches the GP export exactly.
    - Decscription
    - InvoiceDate
    - ReceiptDate
    - DocNo
    - DistributionReferenceCode
    # PurchasesAmount header on the Integration export carries leading+trailing spaces;
    # NormalizeToken trims on both the source scan and required-headers comparison.
    - PurchasesAmount
    - TaxAmount
    - TaxDetailID

transform_constants:
  fixed_company_code: FA
  batch_id_token: WNLGRNTS DEC 25
  uniform_tax:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  company_fallback: THE FA GROUP - FA
  mapping_sheet: MAPPING MASTER
  worktag_business_objects:
    cost_centre: "Cost Center"
    spend_category: "Spend Category"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    program: "Program - Delivered Org"
    project: "Projects (Opex)"
  derived_worktags:
    reporting_type:
      derivation: LEFT(accounting_element_2, 1) mapped via ResolveReportingTypeCode
  unmapped_handling: reject_mandatory_worktags
  supplier_eib_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH

shell_defaults:
  source_worksheet_name: integration
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  variants:
    - profile_key: ap_wnl_grants_invoice
      profile_label: AP WNL Grants Invoice
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/wnl_grants/source/Ad hoc grants - FA WNL 25-26 Season - End of DEC 25.xlsx
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/wnl_grants/target/Submit_Supplier_Invoice_ap_wnl_grants_invoice_output.xlsx
    # Future WNL batches (e.g. WNLGRNTS MAR26 etc.) can be added as additional variants
    # here with the new source data path while keeping all the same layout/mapping constants.
