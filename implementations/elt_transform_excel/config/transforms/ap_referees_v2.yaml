version: 1

transform:
  key: ap_referees_v2
  label: AP Referees V2 (Sheet1 tab)
  source_type: AP Referees V2
  eib_population_type: Supplier Invoice
  description: >
    Referee match-expense workbook ("referee expense sep 26.xlsx") transformed into the Workday
    Supplier Invoice EIB — V2 pipeline that ELIMINATES the Finance pre-step of building the
    Integration tab from the Master/Analysis workbook.  Sources the "Sheet1"
    tab directly (September 2026 refresh: 23 cols A..W, header row 1; replaces the August 2026
    "analysis" tab).  Sheet1 is the Finance-approved extract: it has NO HH Final Approval /
    PE Approval / Category / approver columns, so every row is treated as approved.  The 12
    Integration-tab fields required by the EIB are DERIVED in-VBA from the Sheet1 columns:
      Company          = constant FA (no explicit Company col on Analysis; Cost Code confirms FA-only)
      BatchID token    = REFS{MM}{YY}ME from MAX(Submission Date) (col 2/B)
      DocumentType     = constant INVOICE
      Description (DI) = UPPER(TRIM(Details of Invoice col 6/F) -- raw submitted text; no more
                         separate "JY Details" cleaned column in August 2026 refresh)
      InvoiceDate (U)  = per-row Invoice Date col 4/D
      ReceiptDate (AG) = batch MAX(Submission Date col 2/B) = latest claim form-submission date
      DocNo (AU)       = INV number col 1/A (NOV17056 etc. -- 1:1 unique, same as v1)
      InvoiceNumber (G)= {batch_token}-{INV number} (per-invoice uniqueness -- matches v1 Rule 8)
      DistributionRef  = Cost Code col 11/K (4-6-8-4 format -- was col L 12 on the August 2026
                         analysis tab)
      PurchasesAmount  = Invoice Total col 7/G (previously col I 9; net; TaxAmount hardcoded 0,
                         TaxDetailID=POS); EIB GE/GF cells formatted "0.00"
                         (2 decimal places, display only - stored value not rounded)
      Memo (EO)        = INV number + " " + Cost Code (voucher + accounting string traceability)
      Supplier (U)     = DIRECT passthrough of "Workday ID" col 18/R (was "NEW WORKDAY ID"
                         col 21/U in August 2026; AP/Finance curate the Workday S-XXXXXX
                         reference directly in the source file; the
                         old Creditor-ID -> Supplier Spreadsheet lookup is RETIRED.
                         VENDOR ID col H 8 is OPTIONAL (trace only; blank or absent does not
                         reject the row) and is NOT used for resolution.
                         Rows whose VENDOR ID = "#NO MATCH" are now accepted so long as
                         Workday ID is populated (September 2026 file has 22 such rows).
                         "GP ID to Supplier ID" col 23/W is NOT used.
    Skip gates present in September 2026 V2:
      - HH Final Approval gate RETIRED (column absent from Sheet1; file is pre-approved)
      - Workday ID blank -> rejected (AP has not yet allocated a Supplier ref; handled
        manually as New Supplier onboarding just like old "#NO MATCH" rows)
      - INV number blank / Details of Invoice blank /
        Invoice Date blank / Submission Date blank / Cost Code blank / Invoice Total <= 0
        -> rejected (malformed claim line)
    The secondary bank-detail columns (Account num match / SC MATCH) are intentionally NOT used
    as pass gates; only the AP-curated Workday ID column is authoritative for Supplier.
    9-worktag resolution from Cost Code is identical to v1 (lowest-hierarchy MAPPING MASTER).
    Tax treatment is uniform Outside of Scope / Zero Rated / Nonrecoverable (same as v1;
    Analysis tab has no tax columns -> TaxAmount and TaxDetailID are VBA constants 0 / POS).
    See config/transform_specs/ap_referees_v2.yaml for the full decision record.

runtime:
  step_list_macro: RunApRefereeV2SupplierInvoice

source_layout:
  worksheet_name: "Sheet1"
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  required_headers:
    - INV number
    - Submission Date
    - Invoice Date
    - Details of Invoice
    - Invoice Total
    - Cost Code
    - WORKDAY ID|NEW WORKDAY ID|WORKDAY SUPPLIER ID|NEW WORKDAY SUPPLIER ID
  optional_headers:
    - VENDOR ID
    - Reference Number
    - Full Name (As it appears on your bank account)|Full Name|Full Name As it appears on your bank account
    - Address
    - Postcode
    - Telephone No
    - Email Address
    - Bank Name
    - Sort Code|SortCode
    - Account Number
    - Finance Processed Date
    - Account num match
    - SC MATCH
    - GP ID to Supplier ID

transform_constants:
  fixed_company_code: FA
  batch_id_derivation: REFS + MM(MAX Submission Date) + YY(MAX Submission Date) + ME
  uniform_tax:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  fixed_tax_amount: 0
  fixed_tax_detail_id: POS
  company_fallback: THE FA GROUP - FA
  document_type_constant: INVOICE
  supplier_resolution:
    source_column: Workday ID
    lookup_method: direct_passthrough
    note: >
      AP/Finance team curate the Workday S-XXXXXX supplier reference directly in
      the source file as "Workday ID" col R 18 on Sheet1 (was "NEW WORKDAY ID" col U 21
      on the August 2026 analysis tab; both header names are accepted).  Written to EIB
      col U.  The old Creditor-ID -> Supplier Spreadsheet lookup is RETIRED.  VENDOR ID
      col H 8 and "GP ID to Supplier ID" col W 23 are NOT used for Supplier resolution.
      Rows whose VENDOR ID = "#NO MATCH" are accepted so long as Workday ID is populated
      (September 2026 file has 22 such rows).
    mandatory: true
  mapping_sheet: MAPPING MASTER
  worktag_business_objects:
    cost_centre: "Cost Center"
    spend_category: "Spend Category"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    program: "Program - Delivered Org"
    project: "Projects (Opex)"
  derived_worktags:
    reporting_type:
      derivation: LEFT(accounting_element_2, 1) mapped via ResolveReportingTypeCode
  unmapped_handling: reject_mandatory_worktags
  supplier_eib_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH
shell_defaults:
  source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/referees/source/referee expense sep 26.xlsx
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/referees/target/Submit_Supplier_Invoice_ap_referees_v2_output.xlsx
  source_worksheet_name: "Sheet1"
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
