version: 1

transform:
  key: ap_taxi_v2
  label: AP Taxi v2
  source_type: AP Taxi Workday_Upload
  eib_population_type: Supplier Invoice
  description: >
    v2 of the GENERIC taxi / private-hire supplier-invoice transform. Reads the
    Finance-prepared "Workday_Upload" tab (columns A-T) and writes the Workday Supplier
    Invoice EIB. Runs ALONGSIDE v1 (ap_taxi, "Upload Format" tab); v1 is unchanged.
    The core mapping mirrors ap_stationery_v2: the Workday_Upload header row A-T is
    identical (FIRST CLASS SEP 26 "NEW MAPPING_v2" workbook checked 2026-10-19).
    ONE config covers ALL taxi suppliers that drop a workbook with this Workday_Upload
    tab; currently FIRST CLASS. No per-supplier or per-company config is needed.

    WHAT CHANGED vs v1 (mirrors ap_stationery_v2):
      (1) SupplierID (A) already holds the Workday Supplier ID (e.g. S-001234). No
          "{Company}-{CreditorID}" split and no Reference ID lookup. The value is written
          straight to EIB U after confirming it exists in the Supplier extract's
          "Supplier ID" column; unknown IDs reject the row.
      (2) Company (E) already holds the Workday company (e.g. "THE FA GROUP - FA") and is
          written straight to EIB R. No derivation from SupplierID, no company fallback.
      (3) All 10 worktags (Spend Category, Reporting Type, Cost Centre, Event, Camp,
          FA Learning Course, Commercial Partner, Grant, Programme, Project) are read
          DIRECTLY from their own source columns K-T (already Workday reference IDs,
          filled in the source workbook by its "Fill Worktags" button). There is NO
          "Account" cost-code column and NO Mapping MASTER lookup at runtime.
      (4) Invoice Number (K) MIRRORS Suppliers Invoice Number (BG) = source InvoiceNumber (B),
          written as TEXT on every row (cell format "@").
      (5) Unit Cost (GE) is left BLANK; Extended Amount (GF) = Net (F), displayed to 2
          decimal places (cell format "0.00"; stored value not rounded).
      (6) Memo (GQ) = Supplier (U) + '_' + Suppliers Invoice Number (BG); no cost code.
      (7) Line description (EP) from Description (I) (v1 header was "Description/BOOKED BY").
      (8) The v1 Upload Format-only headers (Template, ReceivedDate, Tray, CreatedBy,
          PONumber, ItemCode, Account) are not in Workday_Upload and are not read.

    UNCHANGED from v1:
      * Multi-line grouping by InvoiceNumber: shared Spreadsheet Key (B); Line Order (EM)
        and Row ID (EK) = per-group 1..N counter.
      * Header consistency guard: Company / Supplier / Currency / InvoiceDate must be
        identical on every row of the same InvoiceNumber, else build error before EIB write.
      * Receipt Date (AG) and Control Amount Total (AS) left BLANK.
      * Per-row tax from TaxCode (J): P20 -> GBR_Domestic_Purchase_Of_Goods_And_Services /
        GBR_Standard / Fully_Recoverable; P0/PZ -> zero-rated triple.
      * Currency (T) from Currency (D).

    See config/transform_specs/ap_taxi_v2.yaml for the decision record and per-column
    mapping (module vba_src/transforms/modApTaxiV2SupInv.bas), and
    config/transforms/ap_taxi.yaml and config/transform_specs/ap_taxi.yaml for the v1
    decision record (multi-line grouping, AP 2026-09-09 tax/structure changes).

runtime:
  step_list_macro: RunApTaxiV2SupplierInvoice

source_layout:
  worksheet_name: Workday_Upload
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  # Workday_Upload columns A-T: same header row as ap_stationery_v2 (FIRST CLASS, 2026-10-19).
  required_headers:
    - SupplierID            # A
    - InvoiceNumber         # B
    - InvoiceDate           # C
    - Currency              # D
    - Company               # E
    - Net                   # F
    - Tax                   # G
    - Gross                 # H
    - Description           # I
    - TaxCode               # J
    - Spend Category        # K  (mandatory worktag)
    - Reporting Type        # L  (mandatory worktag)
    - Cost Centre           # M  (mandatory worktag)
  # Optional worktag columns: the header must be present (the .bas requires the column), but
  # cells are legitimately blank on many/most rows, so they are NOT subject to the non-blank
  # data check (same convention as ap_cfa_claims / ap_stationery_v2).
  optional_headers:
    - Event                 # N
    - Camp                  # O
    - FA Learning Course    # P
    - Commercial Partner    # Q
    - Grant                 # R
    - Programme             # S
    - Project               # T

transform_constants:
  # Source column -> EIB field bindings (same key convention as ap_stationery_v2).
  source_columns:
    supplier_id: SupplierID                 # A -> U
    invoice_number: InvoiceNumber           # B -> BG, and mirrored to K
    invoice_date: InvoiceDate               # C -> AF
    currency: Currency                      # D -> T
    company: Company                        # E -> R
    net_amount: Net                         # F -> GF
    tax_amount: Tax                         # G
    gross_amount: Gross                     # H
    line_description: Description           # I -> EP
    tax_code: TaxCode                       # J -> per_row_tax driver

  # Supplier: the source already carries the Workday Supplier ID. Write it to U as-is,
  # after an existence check against the Supplier extract (case-insensitive). No split,
  # no Reference ID precedence.
  supplier_resolution:
    mode: direct_workday_id_with_extract_check   # shared_helper_registry variant
    source_column: SupplierID
    target_eib_column: U
    validated_via: Supplier Spreadsheet
    validation_column: Supplier ID
    on_not_found: reject_row

  # Company: the source already carries the Workday company (e.g. THE FA GROUP - FA).
  # Written to R as-is.
  company_resolution:
    mode: per_row_direct_source_column           # shared_helper_registry variant
    source_column: Company
    target_eib_column: R
    on_blank: reject_row

  # Invoice number: K mirrors BG; both = source InvoiceNumber (B) raw, written as text.
  invoice_number:
    source_column: InvoiceNumber
    suppliers_invoice_number_eib_column: BG
    invoice_number_eib_column: K
    k_mirrors_bg: true
    number_format: "@"                      # text on every row for K and BG

  # Amounts: Extended Amount (GF) = Net; Unit Cost (GE) left blank.
  line_amounts:
    extended_amount:
      source_column: Net
      target_eib_column: GF
      number_format: "0.00"                 # display 2 decimal places; value not rounded
    unit_cost:
      target_eib_column: GE
      value: blank

  # Memo (GQ): Supplier (U) + '_' + Suppliers Invoice Number (BG), e.g. "S-001234_1SE28308".
  # No cost code (v2 source has none).
  memo_derivation:
    strategy: concat_underscore_join
    separator: "_"
    source_steps:
      supplier_id:
        source_column: SupplierID           # value written to U
      suppliers_invoice_number:
        source_column: InvoiceNumber        # value written to BG
    concat_order:
      - supplier_id
      - suppliers_invoice_number
    target_eib_column: GQ

  # Per-row tax classification driven by TaxCode (J). Unchanged from v1.
  per_row_tax:
    driver_column: TaxCode
    rate_0:
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
    rate_20:
      applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable

  company_fallback: ""                      # no fallback: Company comes from the source row
  mapping_sheet: MAPPING MASTER             # schema parity only; NOT opened at runtime (see worktag_resolution)

  # Worktags: read verbatim from their own source columns. No accounting string, no
  # Mapping MASTER lowest-hierarchy scan, no ResolveReportingTypeCode.
  worktag_resolution:
    resolution: direct_from_source_columns
    source_columns:
      spend_category: Spend Category       # K
      reporting_type: Reporting Type       # L
      cost_centre: Cost Centre             # M
      event: Event                         # N
      camp: Camp                           # O
      fa_learning: FA Learning Course      # P
      commercial_partner: Commercial Partner  # Q
      grant: Grant                         # R
      program: Programme                   # S
      project: Project                     # T
    mandatory:                             # blank -> reject row; the other 7 may be blank
      - spend_category
      - reporting_type
      - cost_centre
    reject_values:                         # source-workbook "unresolved" marker -> reject row
      - NOT_FOUND
    note: >
      Source values are already Workday reference IDs and Reporting Type display values.
      Optional worktags may be blank. The worktag pipeline is INACTIVE (same model as
      ap_cfa_claims / ap_stationery_v2): no worktag_business_objects / derived_worktags,
      so no Mapping MASTER lookup and no ResolveReportingTypeCode at runtime. The source
      workbook's Fill Worktags macro writes NOT_FOUND where a cost code did not map; such
      rows are rejected.
  # Standard 9-pack worktag column letters for v46.2 Supplier Invoice EIB (+ Reporting Type).
  worktag_target_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH

shell_defaults:
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  # source_layout defaults — SHARED across ALL taxi supplier variants below
  # (Workday_Upload tab, row 1 headers, row 2 data start). If a future supplier uses a
  # different tab name, override source_worksheet_name PER VARIANT like ar_gbe_invoice
  # does per tab.
  source_worksheet_name: Workday_Upload
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  # customer_spreadsheet / supplier_spreadsheet / mapping_spreadsheet / mapping_sheet are
  # inherited from config/reference_paths.yaml.
  #
  # Paths use the repo's authored root (/Users/Rakesh.Patel/Documents/__data); the Windows
  # build profile in config/root_path_substitutions.yaml rewrites it to
  # C:\Users\Chika.Etheridge\Documents\workday_finance\data.
  #
  # Per-supplier folder convention (matches stationery Supplier/{Company?}/source + target pattern):
  #   taxi/{supplier}/source/  <- user places the Workday_Upload .xlsm here
  #   taxi/{supplier}/target/  <- Runner writes EIB output here
  #
  # ONE DROPDOWN ROW PER SUPPLIER VARIANT. All variants below share the SAME VBA
  # step-list macro (RunApTaxiV2SupplierInvoice), the SAME source_layout schema
  # (Workday_Upload tab, headers row 1 / data row 2, 20 columns A–T), the SAME
  # transform_constants. The only per-variant differences are:
  # (1) profile_key / profile_label shown in the Runner dropdown,
  # (2) source_data path to the supplier's Workday_Upload workbook,
  # (3) output_file_path target.
  #
  # WHEN ADDING A NEW TAXI SUPPLIER:
  #   (a) create taxi/{NEW_SUPPLIER}/source/ and taxi/{NEW_SUPPLIER}/target/
  #       folders, drop the Workday_Upload workbook in source/,
  #   (b) copy the ap_taxi_v2_first_class block below, rename profile_key to
  #       ap_taxi_v2_{supplier_slug} (lowercase, underscores), update label and
  #       both file paths,
  #   (c) if the new supplier's template uses a different tab name than
  #       "Workday_Upload", add source_worksheet_name: {their tab name} to the
  #       variant block (like ar_gbe_invoice per-variant tab overrides),
  #   (d) re-run create_runner_shell.py --overwrite then build_runner.py,
  #       or hand-edit the config sheet row — VBA is generic.
  variants:
    - profile_key: ap_taxi_v2_first_class
      profile_label: AP Taxi v2 First Class
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/first_class/source/FIRST CLASS - Full Format -SEP 26 Template_FA_V2_NEW MAPPING_v2.xlsm
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/first_class/target/Submit_Supplier_Invoice_ap_taxi_v2_first_class_output.xlsx
    # ------------------------------------------------------------------
    # Future taxi supplier template — uncomment and populate paths.
    # Add a new block per supplier. The base profile_key "ap_taxi_v2" is
    # deliberately not used as a binding (it describes the archetype, not
    # a concrete supplier run).
    # ------------------------------------------------------------------
    # - profile_key: ap_taxi_v2_addison_lee
    #   profile_label: AP Taxi v2 Addison Lee
    #   source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/addison_lee/source/<ADDISON LEE WORKDAY_UPLOAD>.xlsm
    #   output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/addison_lee/target/Submit_Supplier_Invoice_ap_taxi_v2_addison_lee_output.xlsx
    # - profile_key: ap_taxi_v2_uber_for_business
    #   profile_label: AP Taxi v2 Uber For Business
    #   source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/uber_for_business/source/<U4B WORKDAY_UPLOAD>.xlsm
    #   output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/taxi/uber_for_business/target/Submit_Supplier_Invoice_ap_taxi_v2_uber_for_business_output.xlsx
