version: 1

transform:
  key: ap_gfsp
  label: AP GFSP
  source_type: AP GFSP Workday Upload
  eib_population_type: Supplier Invoice
  description: >
    GFSP supplier-invoice transform. Reads the Finance-prepared "Workday Upload" tab
    (columns A-T) and writes the Workday Supplier Invoice EIB. The logic MIRRORS
    ap_stationery_v2 exactly (user instruction 2026-10-21); only names and paths differ.
    There is no GFSP v1: "v1" below refers to ap_stationery, the transform that
    ap_stationery_v2 replaced, and is kept so the two configs stay diff-comparable.

    WHAT CHANGED vs v1 (inherited from ap_stationery_v2, user instruction 2026-10-15):
      (1) SupplierID (A) already holds the Workday Supplier ID (e.g. S-002170). No
          "{Company}-{CreditorID}" split and no Reference ID lookup. The value is written
          straight to EIB U after confirming it exists in the Supplier extract's
          "Supplier ID" column; unknown IDs reject the row.
      (2) Company (E) already holds the Workday company (e.g. "THE FA GROUP - FA") and is
          written straight to EIB R. No derivation from SupplierID.
      (3) All 10 worktags (Spend Category, Reporting Type, Cost Centre, Event, Camp,
          FA Learning Course, Commercial Partner, Grant, Programme, Project) are read
          DIRECTLY from their own source columns K-T (already Workday reference IDs,
          filled in the source workbook by its "Fill Worktags" button). There is NO cost-code
          column and NO Mapping MASTER lookup at runtime.
      (4) Invoice Number (K) MIRRORS Suppliers Invoice Number (BG) = source InvoiceNumber (B).
          The v1 composite (CreditorID-YYMM-RawInvNum) is dropped. K and BG are written as
          TEXT on every row (cell format "@"), so numeric and alphanumeric invoice numbers
          are stored the same way regardless of the template's per-row cell formats.
      (5) Unit Cost (GE) is left BLANK; Extended Amount (GF) = Net (F), displayed to 2
          decimal places (cell format "0.00"; stored value not rounded).
      (6) Memo (GQ) = Supplier (U) + '_' + Suppliers Invoice Number (BG); no cost code.

    GFSP-ONLY DEVIATION from ap_stationery_v2 (user instruction 2026-10-21):
      (7) Duplicate invoice-number suffix. GFSP source files carry ONE InvoiceNumber for
          every row (e.g. "GFSP FUNDING OCT26" on all 220 rows of October 2026, across 188
          suppliers). Rows are counted per (SupplierID, InvoiceNumber) pair:
            * pair occurs once      -> InvoiceNumber used as-is
            * pair occurs N > 1     -> "_1".."_N" appended in source row order, e.g.
                                       S-009319: GFSP FUNDING OCT26_1, _2, _3
          The resulting value is THE invoice number everywhere: K, BG, Memo (GQ) and the
          grouping key below.
      (8) Grouping key = (SupplierID, resulting InvoiceNumber). Because of (7) every key
          is unique, so every GFSP row becomes its OWN single-line invoice (Line Order EM
          and Row ID EK = 1). This keeps the header consistency guard from failing on a
          shared InvoiceNumber across different suppliers.

    UNCHANGED from v1:
      * Spreadsheet Key (B) shared per grouping key; Line Order (EM) and Row ID (EK) =
        per-group 1..N counter (always 1 for GFSP, see (8)).
      * Header consistency guard: Company / Supplier / Currency / InvoiceDate must be
        identical on every row of the same grouping key, else build error before EIB write.
      * Receipt Date (AG) and Control Amount Total (AS) left BLANK.
      * Per-row tax from TaxCode (J): P20 -> GBR_Domestic_Purchase_Of_Goods_And_Services /
        GBR_Standard / Fully_Recoverable; P0/PZ -> zero-rated triple.
      * Currency (T) from Currency (D); line description (EP) from Description (I).

    SCOPE: ONE config covers ALL GFSP supplier workbooks with this Workday Upload layout.
    Company is taken per row from the source (e.g. "THE FA GROUP - FA",
    "THE FA GROUP - WNSL"); a row coded to the wrong company is caught by Workday, not here.

    Decision record and per-column mapping: config/transform_specs/ap_stationery_v2.yaml
    (no GFSP-specific spec yet). Module: vba_src/transforms/modApGfspSupInv.bas
    (to be created as a name-only copy of modApStationeryV2SupInv.bas).

runtime:
  step_list_macro: RunApGfspSupplierInvoice

source_layout:
  worksheet_name: Workday Upload          # GFSP tab has a SPACE (stationery v2: Workday_Upload)
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  # Columns A-T: header row identical to ap_stationery_v2 (verified 2026-10-21 against
  # BGFSP Payments_October2026.xlsx, 220 data rows).
  required_headers:
    - SupplierID            # A
    - InvoiceNumber         # B
    - InvoiceDate           # C
    - Currency              # D
    - Company               # E
    - Net                   # F
    - Tax                   # G
    - Gross                 # H
    - Description           # I
    - TaxCode               # J
    - Spend Category        # K  (mandatory worktag)
    - Reporting Type        # L  (mandatory worktag)
    - Cost Centre           # M  (mandatory worktag)
  # Optional worktag columns: the header must be present (the .bas requires the column), but
  # cells are legitimately blank on many/most rows, so they are NOT subject to the non-blank
  # data check (same convention as ap_cfa_claims).
  optional_headers:
    - Event                 # N
    - Camp                  # O
    - FA Learning Course    # P
    - Commercial Partner    # Q
    - Grant                 # R
    - Programme             # S
    - Project               # T

transform_constants:
  # Source column -> EIB field bindings (same key convention as ap_stationery_addisonlee_wnsl).
  source_columns:
    supplier_id: SupplierID                 # A -> U
    invoice_number: InvoiceNumber           # B -> BG, and mirrored to K
    invoice_date: InvoiceDate               # C -> AF
    currency: Currency                      # D -> T
    company: Company                        # E -> R
    net_amount: Net                         # F -> GF
    tax_amount: Tax                         # G
    gross_amount: Gross                     # H
    line_description: Description           # I -> EP
    tax_code: TaxCode                       # J -> per_row_tax driver

  # Supplier: the source already carries the Workday Supplier ID. Write it to U as-is,
  # after an existence check against the Supplier extract (case-insensitive). No split,
  # no Reference ID precedence.
  supplier_resolution:
    mode: direct_workday_id_with_extract_check   # shared_helper_registry variant
    source_column: SupplierID
    target_eib_column: U
    validated_via: Supplier Spreadsheet
    validation_column: Supplier ID
    on_not_found: reject_row

  # Company: the source already carries the Workday company (e.g. THE FA GROUP - FA,
  # THE FA GROUP - WNSL). Written to R as-is; no company is excluded.
  company_resolution:
    mode: per_row_direct_source_column           # shared_helper_registry variant
    source_column: Company
    target_eib_column: R
    on_blank: reject_row

  # Invoice number: K mirrors BG; both = source InvoiceNumber (B) raw, written as text.
  invoice_number:
    source_column: InvoiceNumber
    suppliers_invoice_number_eib_column: BG
    invoice_number_eib_column: K
    k_mirrors_bg: true
    number_format: "@"                      # text on every row for K and BG
    # GFSP-only (see description (7)/(8)): suffix repeated (SupplierID, InvoiceNumber) pairs.
    duplicate_suffix:
      enabled: true
      partition_by:
        - SupplierID
        - InvoiceNumber
      apply_when: pair_count_gt_1           # singletons keep the raw InvoiceNumber
      separator: "_"
      numbering: source_row_order           # 1..N within each pair
      start_at: 1
      applies_to:                           # suffixed value is written / used in all of these
        - K
        - BG
        - GQ                                # memo, via suppliers_invoice_number
        - grouping_key
    grouping_key:
      - SupplierID
      - InvoiceNumber                       # after duplicate_suffix

  # Amounts: Extended Amount (GF) = Net; Unit Cost (GE) left blank.
  line_amounts:
    extended_amount:
      source_column: Net
      target_eib_column: GF
      number_format: "0.00"                 # display 2 decimal places; value not rounded
    unit_cost:
      target_eib_column: GE
      value: blank

  # Memo (GQ): Supplier (U) + '_' + Suppliers Invoice Number (BG),
  # e.g. "S-009001_GFSP FUNDING OCT26", "S-009319_GFSP FUNDING OCT26_2".
  # No cost code (v2 source has none).
  memo_derivation:
    strategy: concat_underscore_join
    separator: "_"
    source_steps:
      supplier_id:
        source_column: SupplierID           # value written to U
      suppliers_invoice_number:
        source_column: InvoiceNumber        # value written to BG (after duplicate_suffix)
    concat_order:
      - supplier_id
      - suppliers_invoice_number
    target_eib_column: GQ

  # Per-row tax classification driven by TaxCode (J). Unchanged from v1.
  per_row_tax:
    driver_column: TaxCode
    rate_0:
      applicability: GBR_Outside_of_Scope
      code: GBR_Zero_Rated
      recoverability: Nonrecoverable_Allocate
    rate_20:
      applicability: GBR_Domestic_Purchase_Of_Goods_And_Services
      code: GBR_Standard
      recoverability: Fully_Recoverable

  company_fallback: ""                      # no fallback: Company comes from the source row
  mapping_sheet: MAPPING MASTER             # schema parity only; NOT opened at runtime (see worktag_resolution)

  # Worktags: read verbatim from their own source columns. No accounting string, no
  # Mapping MASTER lowest-hierarchy scan, no ResolveReportingTypeFromFinalCode.
  worktag_resolution:
    resolution: direct_from_source_columns
    source_columns:
      spend_category: Spend Category       # K
      reporting_type: Reporting Type       # L
      cost_centre: Cost Centre             # M
      event: Event                         # N
      camp: Camp                           # O
      fa_learning: FA Learning Course      # P
      commercial_partner: Commercial Partner  # Q
      grant: Grant                         # R
      program: Programme                   # S
      project: Project                     # T
    mandatory:                             # blank -> reject row; the other 7 may be blank
      - spend_category
      - reporting_type
      - cost_centre
    reject_values:                         # source-workbook "unresolved" marker -> reject row
      - NOT_FOUND
    note: >
      Source values are already Workday reference IDs (e.g. Staff_Travel_Other, CC06001,
      ECOM2701, PART0037, GRT0052, PRJ00433) and Reporting Type display values
      (e.g. "FA Operations", "FA Investments"). Optional worktags may be blank.
      The worktag pipeline is INACTIVE (same model as ap_cfa_claims): no
      worktag_business_objects / derived_worktags, so no Mapping MASTER lookup and no
      ResolveReportingTypeFromFinalCode at runtime. The source workbook's Fill Worktags
      macro writes NOT_FOUND where a cost code did not map; such rows are rejected.
  # Standard 9-pack worktag column letters for v46.2 Supplier Invoice EIB (+ Reporting Type).
  worktag_target_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH

shell_defaults:
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  source_worksheet_name: Workday Upload   # space, not underscore (BGFSP Payments_October2026.xlsx)
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  # customer_spreadsheet / supplier_spreadsheet / mapping_spreadsheet / mapping_sheet are
  # inherited from config/reference_paths.yaml.
  #
  # Paths use the repo's authored root (/Users/Rakesh.Patel/Documents/__data); the Windows
  # build profile in config/root_path_substitutions.yaml rewrites it to
  # C:\Users\Chika.Etheridge\Documents\workday_finance\data.
  #
  # Folder convention (matches stationery / taxi):
  #   GFSP/source/  <- user places the Workday Upload workbook here
  #   GFSP/target/  <- Runner writes EIB output here
  variants:
    - profile_key: ap_gfsp_fa
      profile_label: AP GFSP FA
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/GFSP/source/BGFSP Payments_October2026.xlsx
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/GFSP/target/Submit_Supplier_Invoice_ap_gfsp_fa_output.xlsx
