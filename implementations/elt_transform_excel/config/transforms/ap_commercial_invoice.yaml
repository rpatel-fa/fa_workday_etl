version: 1

transform:
  key: ap_commercial_invoice
  label: AP Commercial Invoice
  source_type: AP Commercial Invoice
  eib_population_type: Supplier Invoice
  description: >
    Commercial invoice Integration export from GP (e.g.
    "Memo Doc - EFAC 2RP- Commercial Payments AP CHECK.xlsx") transformed into the Workday
    Supplier Invoice EIB. Source is the canonical GP INTEGRATION tab that Finance AP already
    prepare for Workday / GP import. Schema is identical to ap_prize_funds: 11 cols A-K, same
    "Decscription" typo, same "PurchasesAmount" header with embedded spaces. CreditorID is the
    commercial-supplier creditor code (direct Supplier Spreadsheet Reference ID lookup,
    company-FA precedence 2-key). DistributionReferenceCode column drives accounting-string
    worktag mapping. Exemplar EFAC 2RP 2526 = 8 rows (Jul-26 commercial payments).
    See config/transform_specs/ap_commercial_invoice.yaml for the decision record.

runtime:
  step_list_macro: RunApCommInvSupInv

source_layout:
  worksheet_name: INTEGRATION
  worksheet_resolution: named
  header_row: 1
  data_start_row: 2
  header_detection: scan_required_headers
  required_headers:
    - BatchID
    - CreditorID
    - DocumentType
    # NOTE: intentionally misspelled with a 'c' — matches the Finance GP
    # export's "Decscription" header exactly. See transform_specs decision record.
    - Decscription
    - InvoiceDate
    - ReceiptDate
    - DocNo
    - DistributionReferenceCode
    # NOTE: "PurchasesAmount" header on the FIRST CLASS/Commercial/GP INTEGRATION
    # export carries leading + trailing spaces; NormalizeToken trims on both the
    # source scan and the required_headers comparison.
    - PurchasesAmount
    - TaxAmount
    - TaxDetailID

transform_constants:
  fixed_company_code: FA
  batch_id_token: EFAC 2RP 2526
  uniform_tax:
    applicability: GBR_Outside_of_Scope
    code: GBR_Zero_Rated
    recoverability: Nonrecoverable_Allocate
  company_fallback: THE FA GROUP - FA
  mapping_sheet: MAPPING MASTER
  worktag_business_objects:
    cost_centre: "Cost Center"
    spend_category: "Spend Category"
    event: "Events - Custom Org"
    camp: "Camps - Custom Org"
    fa_learning: "FA Learning - Custom Org"
    commercial_partner: "Commercial Partners - Custom Worktag"
    grant: "Grant"
    program: "Program - Delivered Org"
    project: "Projects (Opex)"
  derived_worktags:
    reporting_type:
      derivation: LEFT(accounting_element_2, 1) mapped via ResolveReportingTypeCode
  unmapped_handling: reject_mandatory_worktags
  supplier_eib_columns:
    spend_category: EW
    reporting_type: GR
    cost_centre: GT
    event: GV
    camp: GX
    fa_learning: GZ
    commercial_partner: HB
    grant: HD
    program: HF
    project: HH

shell_defaults:
  # source_layout defaults are per-variant (if needed). Base layout is already correct:
  # INTEGRATION tab, row 1 header, row 2 start. If a future commercial export uses a
  # different tab, override source_worksheet_name per-variant here.
  source_worksheet_name: INTEGRATION
  source_worksheet_resolution: named
  source_header_row: 1
  source_data_start_row: 2
  target_eib: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/eib_template/Submit_Supplier_Invoice_v46.2.xlsx
  variants:
    - profile_key: ap_commercial_invoice
      profile_label: AP Commercial Invoice
      source_data: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/commercial/source/Memo Doc - EFAC 2RP- Commercial Payments AP CHECK.xlsx
      output_file_path: /Users/Rakesh.Patel/Documents/__data/excel/finance_ref/eib/ap/commercial/target/Submit_Supplier_Invoice_ap_commercial_invoice_output.xlsx
    # Future supplier-specific variants are not needed if all commercial exports share the
    # same INTEGRATION tab contract (same 11 headers). If a new source uses a different
    # sheet or a different batch, add a variant row here (e.g. ap_commercial_invoice_aug26).
