- {master_column: L, field: Submit, value: "Y", note: "constant"}
- {master_column: BI, field: "Business Entity Name*", value: "= Customer Name", note: "restatement of a template column"}
- {master_column: "CQ / DR / EG", field: "Type* (address / phone / email)", value: BUSINESS, note: "constant"}
- {master_column: "CR / DS / EH", field: "Use For+ (address / phone / email)", value: "BILLING, SHIPPING, REMIT (email: BILLING)", note: "address and phone have no template column; Email Use For is a template column. SUPERSEDED 2026-10-12: Use For is BILLING only; Email Use For and Public inputs are not loaded"}
- {master_column: various, field: reference IDs, value: "e.g. NET_30, EMAIL, BILL_TO_CONTACTS, STATEMENT_CONTACTS, Customer_of_Goods", note: "Master takes Workday reference IDs. Lookups with no reference_id yet, needed at mapping: ref_document_delivery_method, ref_document_email_recipient_invoice, ref_document_email_recipient_statement, ref_transaction_tax_status. SUPERSEDED 2026-10-12: the reference_ids now exist"}

open_questions:
- id: default_payment_type_default
  question: >
    Default Payment Type was a fixed constant ('Manual' on all 4,132 migrated rows); it is now a
    13-value drop-down instead, on the reasoning that 'Manual' reflects a bulk legacy load rather
    than a house rule. Confirm with AR: is 'Manual' still the right default for a new customer, and
    do they in practice need Direct Debit / BACS / Faster Payments? If 'Manual' really is universal,
    give it default: Manual and drop the ref_payment_type lookup. This narrows the
    constants_typed_by_ar decision, which assumed every constant column stays constant.
  blocking: false
  owner: Finance (AR)
- id: payment_terms_requiredness
  question: >
    Payment Terms is required: true here, but the EIB marks it Optional and the migration left it
    blank on 3 of 4,132 rows. The requiredness is an assumption, not evidence - the reference
    pipeline's own filter (src_fin_customer drops customers with no payment terms) is a migration
    artifact and not a Workday rule. Confirm whether AR may leave it blank.
  blocking: false
  owner: Finance (AR)
- id: allowed_values
  question: >
    Drop-down / allowed-value lists for the free-text columns (Customer Category, Customer Group,
    Payment Terms, Default Currency, Transaction Tax Status, Tax ID Type, Device Type, the
    delivery methods, Region, Country). Deferred by the operator 2026-07-15 - enrich later. The
    column list is settled; this is presentation. Until then every such column is `type: text`,
    and the reference output's distinct values are the starting evidence.
  blocking: false
  owner: Finance (AR)
- id: cross_customer_email_dedup
  question: >
    The reference pipeline drops an email address already used by another customer. Should the
    new transform? Under the no-derivation rule it should not - AR typed it, so it goes in. But
    it is a real behaviour change from the reference, so confirm rather than assume.
  blocking: false
  owner: Finance (AR)
