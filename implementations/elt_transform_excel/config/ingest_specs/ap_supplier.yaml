- {tab: Supplier Payment, count: 6, letters: "F-K", columns: "Shipping Terms, Always Separate Payments, Do not pay during Bank Account updates, Exclude Freight Amount / Other Charge / Tax Amount from Supplier Invoice Discount"}
- {tab: Supplier Procurement, count: 16, letters: "D-K, M-T", columns: "Invoice Any Supplier, Shipping Method, Acknowledgement Expected?, Enable ASN, ASN Due in Days, Supplier Minimum Order Amount, Minimum Order Amount Currency, Text for Default Supplier Payment Memo, Use Invoice Memo as Default Supplier Payment Memo?, Use Supplier Connection Memo?, Enable Global Location Number?, Disable Change Order?, Multi-Supplier Supplier Link for PO Issue, Procurement Credit Card, Edit Portal Taxes, Change Order Issue Option"}
