- {tab: Supplier Address, count: 17, letters: "C-I, N, P, T, X-AD", columns: "Formatted Address, Address Format Type, Defaulted Business Site Address, Delete, Do Not Replace All, Last Modified, Descriptor, Subregion, Submunicipality, Address Line #4, Effective Date, Type, Use For, Use For Tenanted, Comments, Number of Days, Municipality Local"}
- {tab: Supplier Phone, count: 6, letters: "G, I, M-P", columns: "Area Code, Phone Number Extension, Type, Use For, Use For Tenanted, Comments"}
- {tab: Supplier Email, count: 7, letters: "D, I, K-O", columns: "Email Comment, Type, Use For Tenated, Delete, Do Not Replace All, Comments, Email"}

# Whole EIB tabs never populated by the reference pipeline. Not template columns.
excluded_tabs:
- {tabs: "Supplier Alternate Name, Supplier Company Restrictions, Supplier Intermediary Account", reason: "in publish_supplier.json but 0 rows in the reference output (sup_pop.json)"}
- {tabs: "Supplier Children, Supplier Related Worktags, Supplier Classification", reason: "not in publish_supplier.json - never published. Supplier Classification is an open question."}
- {tabs: "Supplier Contact Name, Supplier Contact Address, Supplier Contact Phone, Supplier Contact Email", reason: "not in publish_supplier.json - contacts are not migrated"}
- {tabs: "Supplier Prep (AL), Supplier (AL), Supplier Class Prep (AL), Supplier Group Ref (AL), Supplier Currencies (AL), Supplier Status Data (AL), Supplier Class Data (AL), Supplier Class Field (AL)", reason: "workbook preparation sheets, not EIB load tabs"}

# Master Suppliers.xlsx ('Submit Supplier') findings, now implemented by ap_supplier_master (see
# config/transform_specs/ap_supplier_master.yaml). Not template columns. Letters are Master sheet columns.
mapping_phase_findings:
- {master_column: Q, field: Approval Status, value: APPROVED, note: "constant on both samples"}
- {master_column: C, field: Add Only, value: "Y", note: "constant"}
- {master_column: R, field: Submit, value: "Y", note: "constant"}
- {master_column: CZ, field: Business Entity Name, value: "= Supplier Name", note: "restatement of a template column"}
- {master_column: DF, field: Address Format Type, value: BASIC, note: "constant"}
- {master_column: DJ, field: Address Effective Date, value: "1900-01-01", note: "constant"}
- {master_column: "EI / FJ / FY", field: "Type* (address / phone / email)", value: BUSINESS, note: "constant"}
- {master_column: "EJ / FK / FZ", field: "Use For+ (address / phone / email)", value: "BILLING, SHIPPING, REMIT", note: "SUPERSEDED 2026-10-12: Use For is BILLING only on address, phone and email; Email Use For is not loaded"}
- {master_column: DO, field: Address Line Type, value: "ADDRESS_LINE_<n>", note: "implied by Address Line 1/2/3 position"}
- {master_column: CC, field: Default PO Issue Email, value: "= the Email Address", note: "restatement; FA E2E carries it as Email!H Default PO"}
- {master_column: various, field: reference IDs, value: "e.g. DDA, EMAIL, Suppliers_A_L, ACTIVE, Supplier_of_Goods_Registered_in_this_Country", note: "Master takes Workday reference IDs, not display values. The supplier lookups carry reference_id where the tenant gives one; ref_supplier_status's tenant ID 'Active' differs from Master's 'ACTIVE' (Business_Entity_Status_Value_ID; ap_supplier_master writes the sample's ACTIVE - first-upload check in docs/TODO.md); ref_country is ISO2 but Master's phone Country ISO Code (FA) is ISO3 (GBR)."}

open_questions:
- id: supplier_classification
  question: >
    The tenant has a 'Payment Practice Report - UK' supplier classification (Significant UK
    Connection / Financial Services Related, Yes/No). Neither the migration nor the Master
    sample populates it. Does AP need it for new suppliers?
  blocking: false
  owner: Finance (AP)
- id: ref_country_coverage
  question: >
    ref_country has 106 countries; the supplier workbook lists 242. Tax ID types for 129 tenant
    countries outside ref_country are dropped (see ref_supplier_country_tax_id_type provenance).
    Extend ref_country (shared with ar_customer) if AP onboard suppliers from those countries.
  blocking: false
  owner: Finance (AP)
- id: phone_device_fax_pager
  question: >
    The supplier workbook's Phone_Device range also has Fax and Pager; ref_phone_device (shared)
    has Landline and Mobile only, and the reference output uses only those. Add Fax/Pager?
  blocking: false
  owner: Finance (AP)
- id: default_payment_type_default
  question: >
    Default Payment Type defaults to BACS (all 319 reference suppliers; the reference output also
    accepted Manual, which is no longer carried: one payment type). Confirm with AP that this is
    the right default for a new supplier.
  blocking: false
  owner: Finance (AP)
