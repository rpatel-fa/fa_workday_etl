        description: Delete a row using a key column.
        nameForModel: delete_row
        descriptionForModel: |-
          Deletes a single row from an Excel table, identified by matching a key column to a specific value. This permanently removes the row.
          - To modify column values without removing the row, use update_row instead.
          - Uses key_column and key_value to find the row -- the same lookup mechanism as get_row and update_row.
          - All identifier parameters (location, document_library, file, table) are case-sensitive and must match exactly.
        inputType:
          kind: Record
          properties:
            drive:
              kind: PropertyInfo
              displayName: Document Library
              description: Select a document library from the drop-down.
              nameForModel: delete_row_document_library
              descriptionForModel: Name of the document library (e.g. 'Documents', 'Shared Documents'). Must exactly match the value from policy or user context.
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            file:
              kind: PropertyInfo
              displayName: File
              description: Select an Excel file through File Browse.
              nameForModel: delete_row_file
              descriptionForModel: Excel filename including .xlsx extension (e.g. 'Agent_Risk_Log.xlsx'). May include a path prefix. Use exactly the value from policy or user context.
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            id:
              kind: PropertyInfo
              displayName: Key Value
              description: Enter the key value.
              nameForModel: delete_row_key_value
              descriptionForModel: The value to match in key_column to locate the row to delete. Always pass as a string, even for numeric IDs (e.g. 'EMP-10042', 'RISK-001').
              isRequired: true
              order: 5
              type:
                kind: String
            idColumn:
              kind: PropertyInfo
              displayName: Key Column
              description: Select a column from the drop-down.
              nameForModel: delete_row_key_column
              descriptionForModel: "Name of the column that uniquely identifies the row to delete (case-sensitive). Common examples: 'risk_id', 'EmployeeID', 'ProjectKey'. Use the column name exactly as it appears in the table schema."
              isRequired: true
              order: 4
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            source:
              kind: PropertyInfo
              displayName: Location
              description: "Select from the drop-down or specify one of the following:\r\n            - \"me\"\r\n            - \"SharePoint Site URL\"\r\n            - \"users/someone's UPN\"\r\n            - \"groups/group Id\"\r\n            - \"sites/SharePoint Site URL:/teams/team name:\" (the colons are required)"
