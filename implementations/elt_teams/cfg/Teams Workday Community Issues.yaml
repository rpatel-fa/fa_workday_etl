      - kind: ConnectorOperation
        displayName: Add a key column to a table
        description: Add a key column to an Excel table. The new column will be appended to the right.
        nameForModel: add_key_column_to_table
        descriptionForModel: |-
          Adds or repositions a key column in an existing Excel table. If the column already exists, it is moved to the rightmost position. If it does not exist, a new empty column is appended.
          - Use this to establish a key column for row lookups via get_row, update_row, and delete_row.
          - Not for adding data rows (use add_row_into_table) or creating tables (use create_table).
          - Rarely needed: most tables already have a usable key column. Only use when instructed or when no existing column can serve as a unique identifier.
        inputType:
          kind: Record
          properties:
            drive:
              kind: PropertyInfo
              displayName: Document Library
              description: Select a document library from the drop-down.
              nameForModel: add_key_column_to_table_document_library
              descriptionForModel: Name of the document library (e.g. 'Documents', 'Shared Documents'). Must exactly match the value from policy or user context.
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            file:
              kind: PropertyInfo
              displayName: File
              description: Select an Excel file through File Browse.
              nameForModel: add_key_column_to_table_file
              descriptionForModel: Excel filename including .xlsx extension (e.g. 'Agent_Risk_Log.xlsx'). May include a path prefix. Use exactly the value from policy or user context.
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            idColumn:
              kind: PropertyInfo
              displayName: Key Column
              description: Provide the key column name.
              nameForModel: add_key_column_to_table_key_column
              descriptionForModel: Optional. Name of the key column to add or reposition (e.g. 'LookupKey', 'ID'). Defaults to 'ID' if not provided. This column can then be used as key_column in get_row, update_row, and delete_row.
              order: 4
              type:
                kind: String
            source:
              kind: PropertyInfo
              displayName: Location
              description: "Select from the drop-down or specify one of the following:\r\n            - \"me\"\r\n            - \"SharePoint Site URL\"\r\n            - \"users/someone's UPN\"\r\n            - \"groups/group Id\"\r\n            - \"sites/SharePoint Site URL:/teams/team name:\" (the colons are required)."
              nameForModel: add_key_column_to_table_location
              descriptionForModel: SharePoint site URL or 'me' for personal OneDrive. Must exactly match the value from policy or user context -- do not guess or invent URLs.
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            table:
              kind: PropertyInfo
              displayName: Table
              description: Select a table from the drop-down.
              nameForModel: add_key_column_to_table_table
              descriptionForModel: Exact table name as defined in the workbook (case-sensitive, e.g. 'Risks', 'TrainingRecords'). Use the value from policy, user context, or get_tables output.
              isRequired: true
              order: 3
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
