          kind: String
        operationId: CreateIdColumn
      - kind: ConnectorOperation
        displayName: List rows present in a table
        description: List rows present in a table.
        nameForModel: get_items
        descriptionForModel: "Use tool to list, read and filter rows in a table inside an Excel file. Example user intent: Read and list the Budget table in the Finance.xlsx file."
        inputType:
          kind: Record
          properties:
            $filter:
              kind: PropertyInfo
              displayName: Filter Query
              description: An ODATA filter query to restrict the entries returned.
              nameForModel: get_items_filter
              descriptionForModel: "Set to a single OData $filter expression to narrow rows, using one condition with eq or ne or functions contains, startswith, endswith, and string values in single quotes. Example: City eq 'Seattle'."
              visibility: Advanced
              order: 4
              type:
                kind: String
            $orderby:
              kind: PropertyInfo
              displayName: Order By
              description: An ODATA orderBy query for specifying the order of entries.
              nameForModel: get_items_orderby
              descriptionForModel: "Use to sort the results by a single column. Set by using the column header name, followed by asc or desc. Only one column is allowed. Examples: Date desc, Price asc, Name asc."
              visibility: Advanced
              order: 5
              type:
                kind: String
            $select:
              kind: PropertyInfo
              displayName: Select Query
              description: Comma-separated list of columns to retrieve (first 500 by default).
              nameForModel: get_items_select
              descriptionForModel: "Set to a comma separated list of column names to return when only specific columns are needed. Example: Name,Email,Phone."
              visibility: Advanced
              order: 8
              type:
                kind: String
            $skip:
              kind: PropertyInfo
              displayName: Skip Count
              description: The number of entries to skip (default = 0).
              nameForModel: get_items_skip
              descriptionForModel: Set this to a nonnegative integer (e.g. 5) to skip the first N rows, for example when doing pagination or if the user asks for something "skip the first 5 rows".
              visibility: Advanced
              order: 7
              type:
                kind: Number
            $top:
              kind: PropertyInfo
              displayName: Top Count
              description: Total number of entries to retrieve (default = all).
              nameForModel: get_items_top
              descriptionForModel: Set this to a positive integer to limit the number of rows returned. For example, map phrases like "top 5" to 5 or "first 10" to 10.
              visibility: Advanced
              order: 6
              type:
                kind: Number
            dateTimeFormat:
              kind: PropertyInfo
              displayName: DateTime Format
              description: DateTime Format.
              nameForModel: get_items_date_time_format
              descriptionForModel: Set to how date values are represented, using only either ISO 8601 or Serial Number. Prefer ISO 8601 unless the user states otherwise.
              visibility: Advanced
              order: 9
              enumValues:
                - Serial Number
                - ISO 8601
              type:
                kind: String
            drive:
              kind: PropertyInfo
              displayName: Document Library
              description: Select a document library from the drop-down.
              nameForModel: get_items_drive
              descriptionForModel: 'Set to the document library name that contains the workbook. This is usually "OneDrive" if location parameter is "me". Example: OneDrive, Documents.'
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            extractSensitivityLabel:
              kind: PropertyInfo
              displayName: Extract Sensitivity Label
              description: A boolean whether to extract sensitivity label Id for associated artefact.
              nameForModel: excelonlinebusiness_extractSensitivityLabel
              descriptionForModel: Set to true to also return the sensitivity label id associated with the workbook. Optional; omit or set false when not needed.
              order: 10
              type:
                kind: Boolean
            fetchSensitivityLabelMetadata:
              kind: PropertyInfo
              displayName: Sensitivity Label Metadata
              description: A boolean whether to fetch sensitivity label Metadata for associated LabelId.
              nameForModel: excelonlinebusiness_fetchSensitivityLabelMetadata
              descriptionForModel: Set to true to also return the metadata for the workbook's sensitivity label id. Optional; omit or set false when not needed.
              order: 11
              type:
                kind: Boolean
            file:
              kind: PropertyInfo
              displayName: File
              description: Select an Excel file through File Browse.
              nameForModel: get_items_file
              descriptionForModel: "Set to the workbook path starting with a forward slash, including subfolders and the .xlsx extension. Example: /Reports/2025/Financials.xlsx."
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            source:
              kind: PropertyInfo
              displayName: Location
              description: "Select from the drop-down or specify one of the following:\r\n            - \"me\"\r\n            - \"SharePoint Site URL\"\r\n            - \"users/someone's UPN\"\r\n            - \"groups/group Id\"\r\n            - \"sites/SharePoint Site URL:/teams/team name:\" (the colons are required)"
              nameForModel: get_items_source
              descriptionForModel: "Set this to the storage location identifier for the workbook. Use me for the current user's OneDrive, the full SharePoint site URL for a site, users/{UPN} for another user's OneDrive, groups/{GroupId} for a Microsoft 365 group, or sites/{SiteURL}:/teams/{TeamName}: for a Team path (colons are required). Examples: me; https://contoso.sharepoint.com/sites/Marketing; users/alice@contoso.com; groups/12345678-aaaa-bbbb-cccc-123456789000"
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            table:
              kind: PropertyInfo
              displayName: Table
              description: Select a table from the drop-down.
              nameForModel: get_items_table
              descriptionForModel: "Set to the Excel table name inside the workbook, not the sheet name. Example: SalesTable."
              isRequired: true
              order: 3
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
