connectorDefinitions:
  - kind: ConnectorDefinition
    connectorId: /providers/Microsoft.PowerApps/apis/shared_excelonlinebusiness
    version: 639233694967292200
    displayName: Excel Online (Business)
    description: Excel Online (Business) connector lets you work with Excel files in document libraries supported by Microsoft Graph (OneDrive for Business, SharePoint Sites, and Office 365 Groups).
    connectorType: Public
    iconUri: https://static.powerapps.com/resource/ppcr/releases/v1.0.1826/1.0.1826.4868/excelonlinebusiness/icon.png
    changedTime: 2026-08-26T19:31:36.7292199Z
    hasPublicData: false
    isSSOSupported: true
    operations:
      - kind: ConnectorOperation
        displayName: Run script from SharePoint library
        description: Runs an Office Script against an Excel workbook. Use this action when the script is saved outside of the default location.
        nameForModel: run_script_prod_v2
        inputType:
          kind: Record
          properties:
            drive:
              kind: PropertyInfo
              displayName: Workbook Library
              description: Select a document library from the drop-down.
              nameForModel: run_script_prod_v2_drive
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            file:
              kind: PropertyInfo
              displayName: Workbook
              description: Select an Excel workbook through File Browse.
              nameForModel: run_script_prod_v2_file
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            scriptDrive:
              kind: PropertyInfo
              displayName: Script Library
              description: Select the SharePoint library of your Office Script file (.osts) from the drop-down.
              nameForModel: run_script_prod_v2_scriptdrive
              isRequired: true
              order: 4
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            scriptId:
              kind: PropertyInfo
              displayName: Script
              description: Select an Office Script file (.osts) in a SharePoint library from the drop-down.
              nameForModel: run_script_prod_v2_scriptid
              descriptionForModel: "Set to the path of the Office Script (.osts) file in the script library, starting with a forward slash. Example: /Scripts/Cleanup.osts."
              isRequired: true
              order: 5
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            ScriptParameters:
              kind: PropertyInfo
              description: Provide parameters for the Office Script.
              isRequired: true
              order: 6
              type:
                kind: UnresolvedDynamicType
            scriptSource:
              kind: PropertyInfo
              displayName: Script Location
              description: "Select from the drop-down or specify one of the following:\r\n            - \"me\"\r\n            - \"SharePoint Site URL\"\r\n            - \"users/someone's UPN\"\r\n            - \"groups/group Id\"\r\n            - \"sites/SharePoint Site URL:/teams/team name:\" (the colons are required)."
              nameForModel: run_script_prod_v2_scriptsource
              isRequired: true
              order: 3
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            source:
              kind: PropertyInfo
              displayName: Workbook Location
              description: "Select from the drop-down or specify one of the following:\r\n              - \"me\"\r\n              - \"SharePoint Site URL\"\r\n              - \"users/someone's UPN\"\r\n              - \"groups/group Id\"\r\n              - \"sites/SharePoint Site URL:/teams/team name:\" (colons are required)."
              nameForModel: run_script_prod_v2_source
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
        outputType:
          kind: UnresolvedDynamicType
        operationId: RunScriptProdV2
      - kind: ConnectorOperation
        displayName: Run script
        description: Runs an Office Script against an Excel workbook. Use this action when the script is saved in the default location.
        nameForModel: run_script_prod
        inputType:
          kind: Record
          properties:
            drive:
              kind: PropertyInfo
              displayName: Document Library
              description: Select a document library from the drop-down.
              nameForModel: excelonlinebusiness_drive
              descriptionForModel: Set to the document library name that contains the Excel workbook. For OneDrive based files often OneDrive; for SharePoint often Documents or another library like Shared Documents.
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            file:
              kind: PropertyInfo
              displayName: File
              description: Select an Excel file through File Browse.
              nameForModel: run_script_prod_file
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            scriptId:
              kind: PropertyInfo
              displayName: Script
              description: Select the Office Script you want to run from the drop-down.
              nameForModel: run_script_prod_scriptid
              isRequired: true
              order: 3
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            ScriptParameters:
              kind: PropertyInfo
              description: Information about a single script's parameter schema.
              isRequired: true
              order: 4
              type:
                kind: UnresolvedDynamicType
            source:
              kind: PropertyInfo
              displayName: Location
              description: "Select from the drop-down or specify one of the following:\r\n              - \"me\"\r\n              - \"SharePoint Site URL\"\r\n              - \"users/someone's UPN\"\r\n              - \"groups/group Id\"\r\n              - \"sites/SharePoint Site URL:/teams/team name:\" (colons are required)."
              nameForModel: excelonlinebusiness_source
              descriptionForModel: "Set this to the storage location identifier for the workbook. Use me for the current user's OneDrive, the full SharePoint site URL for a site, users/{UPN} for another user's OneDrive, groups/{GroupId} for a Microsoft 365 group, or sites/{SiteURL}:/teams/{TeamName}: for a Team path (colons are required). Examples: me; https://zava.sharepoint.com/sites/Sales"
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
        outputType:
          kind: UnresolvedDynamicType
        operationId: RunScriptProd
      - kind: ConnectorOperation
        displayName: Create table
        description: Create a new table in the Excel workbook.
        nameForModel: create_table
        descriptionForModel: |-
          Creates a new named table in an Excel file from a specified cell range and optional column definitions.
          - Use this only when the table does not already exist. If the table exists, use add_row_into_table to add data to it.
          - To discover existing tables, use get_tables.
          - table_range defines the initial extent. Match the column count to the number of columns_names provided.
          - Always provide columns_names to define the schema explicitly.
        inputType:
          kind: Record
          properties:
            ColumnsNames:
              kind: PropertyInfo
              displayName: Columns names
              description: Enter the columns names separated by ';' or ','.
              nameForModel: create_table_columns_names
              descriptionForModel: Optional. Comma-separated column names for the table schema (e.g. 'Bid_ID,Item_Description,Quantity,Unit_Price,Currency,Total_Cost'). Semicolons also accepted as separators but commas are standard. If omitted, the table is created without a predefined column schema.
              order: 5
              type:
                kind: String
            drive:
              kind: PropertyInfo
              displayName: Document Library
              description: Select a document library from the drop-down.
              nameForModel: create_table_document_library
              descriptionForModel: Name of the document library (e.g. 'Documents', 'Shared Documents'). Must exactly match the value from policy or user context.
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            file:
              kind: PropertyInfo
              displayName: File
              description: Select an Excel file through File Browse.
              nameForModel: create_table_file
              descriptionForModel: Excel filename including .xlsx extension (e.g. 'CapacityPlanning.xlsx', 'QuoteLog.xlsx'). May include a path prefix. Use exactly the value from policy or user context.
              isRequired: true
              order: 2
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: FilePicker
              type:
                kind: String
            Range:
              kind: PropertyInfo
              displayName: Table range
              description: Enter the table address using A1 notation.
              nameForModel: create_table_table_range
